  INTENSITY_K2: "{\"S\":{\"A\":{\"H\":{\"code\":\"K2-A-S-H\",\"label\":\"متقدم — نفوذ وكفاءة يقود العمليات بنجاح.\",\"lock\":\"قيادتك التحليلية عدسة تفكير، لا مقياس ذكاء (خارج النموذج) ولا ضمان تنفيذ (دائرة الإنجاز).\",\"user\":\"التحليل عدستك القائدة: تقود بها فهمك للمواقف وتوجّه بها قرارات من حولك. حين يحتار الفريق في تعقيد ما، أنت من يفككه إلى أجزاء واضحة قابلة للحسم. دقتك مصدر ثقة الجماعة، وإن كانت تستدعي أحياناً من يعينك على الإغلاق حين يتمدد الفحص.\",\"warn\":\"\"},\"H+\":{\"code\":\"K2-A-S-H+\",\"label\":\"متميز — سيادة وتدفق تشغيلي عالٍ مستمر.\",\"lock\":\"سيادة هذه العدسة لا تُترجم إنجازاً ميدانياً — التنفيذ يقيسه نظام مستقل (دائرة الإنجاز)؛ قد يجتمع تحليل سيادي مع تنفيذ متعثر بلا تناقض.\",\"user\":\"التحليل هو بوابتك السيادية: كل شيء يمر عبره أولاً وبتدفق ثابت لا ينقطع. تلتقط الخلل المنطقي فوراً وتبني الحجة المتماسكة بسلاسة تبدو للآخرين موهبة، وهي لك ببساطة الوضع الافتراضي. في المقابل، مساحات الحسم السريع والتقاط أجواء الناس تحتاج منك جهداً واعياً أو شريكاً.\",\"warn\":\"\"},\"H++\":{\"code\":\"K2-A-S-H++\",\"label\":\"فائق القدرة — طفرة سيادية استثنائية وتدفق دائم يقود لابتكار المسارات.\",\"lock\":\"الطفرة في عدسة التحليل **لا تعني تفوقاً شاملاً** — كلما ارتفعت هذه العدسة اتسعت مساحة ما تحجبه (اللحظة، الإنجاز، الأجواء)، فيزداد اعتمادك على شركاء يكملونها.\",\"user\":\"التحليل عندك ليس عدسة أولى فحسب — إنه يكاد يكون المُشغّل الوحيد لإدراكك. تفكّك، تدقّق، وتبني براهين بكثافة تفوق المعتاد بمراحل، لدرجة أنك قد تبتكر أطر تحليل جديدة لم تُصمَّم من قبل. هذه طاقة نادرة، ومعها يصبح توازنك مع العدسات الأخرى (الحسم، الناس، اللحظة) مسألة **إدارة واعية** لا خيار تلقائي.\",\"warn\":\"**آلية بلوغ هذا النطاق حسابياً موقوفة على قرار مالك المشروع (GAP-DR-01).**\",\"warn_status\":\"متقادم — GAP-DR-01 مغلقة (51-MATRIX-06 §136) · لا يُعرض\"},\"L\":{\"code\":\"K2-A-S-L\",\"label\":\"منخفض الجاهزية البنيوية وعرضة للانحراف تحت الضغط.\",\"lock\":\"الدرجة المنخفضة لا تقول شيئاً عن ذكائك — تقول أي عدسة لا تتصدر ترتيبك. التغطية بالتخادم، لا بمحاولة \\\"أن تصبح تحليلياً\\\".\",\"user\":\"التفكيك المنطقي المجرد ليس مسارك التلقائي — عقلك يقرأ العالم بعدسات أخرى أسرع إليه (الجدوى، الناس، الصورة الكبيرة). قد تمر ثغرة منطقية دون أن يلتقطها رادارك تلقائياً، **ليس عجزاً عن رؤيتها إذا وُجّهت إليها، بل غياباً لأولوية البحث عنها**. وتحت الضغط قد يقل استحضارك للفحص المنطقي أكثر.\",\"warn\":\"\"},\"L−\":{\"code\":\"K2-A-S-L−\",\"label\":\"ضعيف جداً تشغيلياً — يتطلب عزلاً/تخادماً فورياً في المهام المعتمدة على هذه العدسة.\",\"lock\":\"\\\"يتطلب عزلاً/تخادماً\\\" وصف **تشغيلي للمهمة**، لا حكم على قيمتك — عدساتك القائدة (أينما كانت) تحمل بصمتك التي لا يعوضها غيرك. `P = C + G`.\",\"user\":\"التحليل المنطقي المجرد بعيد جداً عن مسارك التلقائي — تصل إلى فهمك وقراراتك بطرق أخرى كلياً. في المهام التي تعتمد أساساً على التفكيك المنطقي الدقيق (تدقيق عقود، كشف مغالطات، بناء براهين)، الأنسب بوضوح أن تتخادم مع حامل هذه العدسة بدل حملها بنفسك — لا كنقص فيك، بل كتوزيع أمثل للعدسات.\",\"warn\":\"\"},\"M\":{\"code\":\"K2-A-S-M\",\"label\":\"متوازن — متوسط الأداء ومستقر تشغيلياً.\",\"lock\":\"\\\"متوازن\\\" موقع في ترتيب عدساتك، لا علامة في امتحان — وهو تحت عتبة الاشتعال، أي أن التحليل ليس بين عدساتك القائدة في التقرير.\",\"user\":\"التحليل حاضر عندك بتوازن: تستطيع تفكيك الأمور حين تحتاج، لكنه لا يتصدّر ترتيبك ولا يغيب. تعالج أغلب المواقف بعدسات أخرى، وتستدعي التحليل عند الحاجة الواضحة دون أن يكون ردّ فعلك التلقائي الأول. موقع مستقر مريح.\",\"warn\":\"\"},\"M+\":{\"code\":\"K2-A-S-M+\",\"label\":\"فوق المتوسط — نطاق فعّال نشط وموثوق ميدانياً.\",\"lock\":\"هذه أول كتلة \\\"مشتعلة\\\" (فوق 50%) — عدسة مساندة نشطة، لا ثانوية ولا ناقصة. `P = C + G`.\",\"user\":\"التحليل عدسة فعّالة عندك وتُستدعى بموثوقية حين يلزم — قرار مالي، فحص ادعاء، مقارنة عروض — لكنها ليست بوابتك الأولى الوحيدة؛ عدسة أخرى تشاركها القيادة. هذا موقع نشط: تملك أداة التحليل جاهزة دون أن تدفع كلفة تشغيلها الدائم على كل شيء.\",\"warn\":\"\"},\"OUT\":{\"code\":\"K2-A-S-OUT\",\"label\":\"منطقة بالغة الخطورة — تعطل أو ضمور شديد في استخدام الوعاء.\",\"lock\":\"OUT وصف **تشغيلي لموقع العدسة** (غياب من ترتيب المعالجة)، **وليس** حكماً على الشخص ولا على ذكائه ولا استخداماً لأي لغة عيادية. الغياب هنا في عدسة واحدة؛ ترتيبك يقوده غيرها. `P = C + G` — لا يُفسَّر كخلل في الكود الفطري بل كترتيب تفضيل.\",\"user\":\"عدسة التحليل المنطقي المجرد غائبة فعلياً عن ترتيب معالجتك — لا تُستدعى تلقائياً حتى عند الحاجة الواضحة إليها. عملياً: أي مهمة يتوقف نجاحها على التفكيك المنطقي الدقيق تحتاج **إسناداً كاملاً** لحامل هذه العدسة، مع بوابة فحص منطقي إلزامية في مسار قراراتك المهمة تعوّض غيابها التلقائي.\",\"warn\":\"\"}},\"C\":{\"H\":{\"code\":\"K2-C-S-H\",\"label\":\"متقدم قائد\",\"lock\":\"حراسة معرفية، لا انصياع سلوكي.\",\"user\":\"عدستك القائدة الأمان: ذاكرة الجماعة ومناعتها؛ من يقول \\\"قفوا\\\" أمام خطر لا يُرى.\",\"warn\":\"\"},\"H+\":{\"code\":\"K2-C-S-H+\",\"label\":\"متميز سيادي\",\"lock\":\"سيادة عدسة الأمان ≠ انصياع للأوامر ولا رأي أيديولوجي ولا تنفيذ (ثلاثة ملفات منفصلة).\",\"user\":\"الأمان بوابتك السيادية: كل جديد يمرّ على \\\"هل جُرّب؟ وما الضمانة؟\\\" بتدفق ثابت يحفظ الأصول.\",\"warn\":\"\"},\"H++\":{\"code\":\"K2-C-S-H++\",\"label\":\"معتمد: طفرة سيادية تقود ابتكار المسارات\",\"lock\":\"طفرة في عدسة الأمان **لا تعني طاعةً ولا موقفاً فكرياً ولا تطبيقاً ميدانياً**.\",\"user\":\"فحص الأمان يكاد يكون مُشغّلك الوحيد: تفحص السوابق والمخاطر بكثافة استثنائية وتبتكر أطر تحوّط جديدة.\",\"warn\":\"GAP-DR-01.\",\"warn_status\":\"متقادم — GAP-DR-01 مغلقة (51-MATRIX-06 §136) · لا يُعرض\"},\"L\":{\"code\":\"K2-C-S-L\",\"label\":\"منخفض الجاهزية\",\"lock\":\"يُغطّى بالتخادم أو سؤال ثابت: \\\"ما أسوأ ما قد يحدث؟\\\".\",\"user\":\"فحص السوابق ليس تلقائياً؛ قد تتبنى الجديد قبل اكتمال دليل أمانه — غياب أولوية لا تهوّر.\",\"warn\":\"\"},\"L−\":{\"code\":\"K2-C-S-L−\",\"label\":\"ضعيف جداً — تخادم فوري\",\"lock\":\"وصف تشغيلي للمهمة، لا حكم.\",\"user\":\"عدسة الأمان بعيدة عن مسارك؛ قرارات المخاطر العالية الأنسب مشاركتها مع حاملها.\",\"warn\":\"\"},\"M\":{\"code\":\"K2-C-S-M\",\"label\":\"متوازن مستقر\",\"lock\":\"موقع مستقر تحت العتبة.\",\"user\":\"التحوّط حاضر بتوازن: تستدعيه عند مخاطرة واضحة دون أن يتصدّر.\",\"warn\":\"\"},\"M+\":{\"code\":\"K2-C-S-M+\",\"label\":\"مساندة فعّالة موثوقة\",\"lock\":\"أول كتلة مشتعلة — مساندة نشطة.\",\"user\":\"فحص الأمان عدسة فعّالة تُستدعى عند قرار عالي المخاطر أو أصل ثمين، دون أن تنفرد بالقيادة.\",\"warn\":\"\"},\"OUT\":{\"code\":\"K2-C-S-OUT\",\"label\":\"خطورة بالغة: تعطل/ضمور\",\"lock\":\"غياب عدسة، لا حكم ولا عيادة (`P = C + G`).\\n\\n---\",\"user\":\"عدسة فحص الأمان غائبة عن ترتيبك؛ القرارات عالية المخاطر تحتاج بوابة تحوّط إلزامية من طرف آخر.\",\"warn\":\"\"}},\"E\":{\"H\":{\"code\":\"K2-E-S-H\",\"label\":\"متقدم قائد\",\"lock\":\"قراءتك معلومة تشغيلية، لا \\\"تشخيص\\\" (لغة محظورة) ولا انفعال (K_3).\",\"user\":\"عدستك القائدة السونار البشري: من يعرف \\\"السبب الحقيقي\\\" خلف تعثّر لا يُفسَّر.\",\"warn\":\"\"},\"H+\":{\"code\":\"K2-E-S-H+\",\"label\":\"متميز سيادي\",\"lock\":\"سيادة الفهم المعرفي ≠ شدة الانفعال (K_3)؛ الفهم عدسة والانفعال دائرة مستقلة.\",\"user\":\"قراءة الباطن بوابتك السيادية: تلتقط الفجوة بين القول والحال بتدفق ثابت وتفهم الجذر النفسي وأنت هادئ.\",\"warn\":\"\"},\"H++\":{\"code\":\"K2-E-S-H++\",\"label\":\"معتمد: طفرة سيادية تقود ابتكار المسارات\",\"lock\":\"طفرة في عدسة الفهم **لا تعني انفعالاً ولا عاطفيةً** (K_3 مستقل تماماً) ولا لباقة اجتماعية (S)؛ أعمق القرّاء قد يكون أهدأهم.\",\"user\":\"قراءة ما وراء الكلام تكاد تكون مُشغّلك الوحيد: تفكّك النماذج الداخلية للبشر بكثافة استثنائية وتبتكر أطر فهم جديدة لدوافعهم.\",\"warn\":\"GAP-DR-01.\",\"warn_status\":\"متقادم — GAP-DR-01 مغلقة (51-MATRIX-06 §136) · لا يُعرض\"},\"L\":{\"code\":\"K2-E-S-L\",\"label\":\"منخفض الجاهزية\",\"lock\":\"يُغطّى بالتخادم مع سؤال: \\\"ما الذي لا أراه هنا؟\\\".\",\"user\":\"الغوص وراء الظاهر ليس تلقائياً؛ قد تفاجئك مواقف البشر — غياب أولوية البحث تحت السطح لا عجز.\",\"warn\":\"\"},\"L−\":{\"code\":\"K2-E-S-L−\",\"label\":\"ضعيف جداً — تخادم فوري\",\"lock\":\"وصف تشغيلي للمهمة، لا حكم ولا عيادة.\",\"user\":\"قراءة القاع النفسي بعيدة عن مسارك؛ المهام المعتمدة على فهم الدوافع الدفينة الأنسب مشاركتها مع حاملها.\",\"warn\":\"\"},\"M\":{\"code\":\"K2-E-S-M\",\"label\":\"متوازن مستقر\",\"lock\":\"موقع مستقر تحت العتبة؛ لا يُقرأ عاطفيةً.\",\"user\":\"فهم البواطن حاضر بتوازن: تستدعيه عند الحاجة الواضحة دون أن يتصدّر.\",\"warn\":\"\"},\"M+\":{\"code\":\"K2-E-S-M+\",\"label\":\"مساندة فعّالة موثوقة\",\"lock\":\"أول كتلة مشتعلة — مساندة نشطة؛ الفهم معرفي لا انفعالي.\",\"user\":\"قراءة الأعماق عدسة فعّالة تُستدعى عند خلاف غامض أو قرار يمسّ إنساناً، دون أن تنفرد بالقيادة.\",\"warn\":\"\"},\"OUT\":{\"code\":\"K2-E-S-OUT\",\"label\":\"خطورة بالغة: تعطل/ضمور\",\"lock\":\"غياب عدسة معرفية واحدة، **لا حكم ولا لغة عيادية إطلاقاً** (`P = C + G`).\\n\\n---\",\"user\":\"عدسة قراءة البواطن غائبة عن ترتيبك؛ القرارات الماسّة بدوافع الأفراد تحتاج قارئاً من طرف آخر.\",\"warn\":\"\"}},\"H\":{\"H\":{\"code\":\"K2-H-S-H\",\"label\":\"متقدم قائد\",\"lock\":\"توليد الإمكان ذهني، لا تنفيذ (K_4)؛ وغزارة الأفكار ليست إنجازاً.\",\"user\":\"عدستك القائدة مولّد الاحتمالات: من يخترع باباً حين تُغلق كل الأبواب المعروفة.\",\"warn\":\"\"},\"H+\":{\"code\":\"K2-H-S-H+\",\"label\":\"متميز سيادي\",\"lock\":\"سيادة التوليد ≠ توجيه (St) ولا ذكاء عام؛ أنت تفتح الأبواب، وتحديد الوجهة عدسة أخرى.\",\"user\":\"التوليد التباعدي بوابتك السيادية: ترى كل إطار قابلاً للكسر وتفتح الاحتمالات بتدفق لا ينضب.\",\"warn\":\"\"},\"H++\":{\"code\":\"K2-H-S-H++\",\"label\":\"معتمد: طفرة سيادية تقود ابتكار المسارات\",\"lock\":\"طفرة في عدسة التوليد **لا تعني رؤية استراتيجية** (St — غبش عاملي) ولا مقياس ذكاء ولا تنفيذاً (K_4).\",\"user\":\"كسر الأطر يكاد يكون مُشغّلك الوحيد: تولّد الاحتمالات الصفرية بكثافة استثنائية تعيد صياغة قواعد اللعبة.\",\"warn\":\"GAP-DR-01.\",\"warn_status\":\"متقادم — GAP-DR-01 مغلقة (51-MATRIX-06 §136) · لا يُعرض\"},\"L\":{\"code\":\"K2-H-S-L\",\"label\":\"منخفض الجاهزية\",\"lock\":\"يُغطّى بالتخادم: \\\"ماذا لو كان كل ما نفترضه خاطئاً؟\\\".\",\"user\":\"كسر الأطر ليس تلقائياً؛ قد تعالج دائماً \\\"بالطريقة المعروفة\\\" — غياب أولوية البحث خارج الصندوق لا عجز.\",\"warn\":\"\"},\"L−\":{\"code\":\"K2-H-S-L−\",\"label\":\"ضعيف جداً — تخادم فوري\",\"lock\":\"وصف تشغيلي للمهمة، لا حكم.\",\"user\":\"التوليد التباعدي بعيد عن مسارك؛ المهام المعتمدة على الابتكار الجذري الأنسب مشاركتها مع حاملها.\",\"warn\":\"\"},\"M\":{\"code\":\"K2-H-S-M\",\"label\":\"متوازن مستقر\",\"lock\":\"موقع مستقر تحت العتبة.\",\"user\":\"الخيال التوليدي حاضر بتوازن: تستدعيه عند الجدران المسدودة دون أن يتصدّر.\",\"warn\":\"\"},\"M+\":{\"code\":\"K2-H-S-M+\",\"label\":\"مساندة فعّالة موثوقة\",\"lock\":\"أول كتلة مشتعلة — مساندة نشطة.\",\"user\":\"التوليد عدسة فعّالة تُستدعى عند انسداد أو حاجة لكسر نمط، دون أن تنفرد بالقيادة.\",\"warn\":\"\"},\"OUT\":{\"code\":\"K2-H-S-OUT\",\"label\":\"خطورة بالغة: تعطل/ضمور\",\"lock\":\"غياب عدسة، لا حكم ولا عيادة (`P = C + G`).\\n\\n---\",\"user\":\"عدسة كسر الأطر غائبة عن ترتيبك؛ المهام المعتمدة على البدائل الصفرية تحتاج مولّداً من طرف آخر.\",\"warn\":\"\"}},\"O\":{\"H\":{\"code\":\"K2-O-S-H\",\"label\":\"متقدم قائد\",\"lock\":\"بناء الخريطة ذهني، لا ضمان تنفيذها.\",\"user\":\"عدستك القائدة النظام: من يحوّل الحماس إلى خطوات ومالكين ومواعيد.\",\"warn\":\"\"},\"H+\":{\"code\":\"K2-O-S-H+\",\"label\":\"متميز سيادي\",\"lock\":\"سيادة تنظيم ذهني ≠ ترتيب مادي/زمني فعلي (K_4).\",\"user\":\"الهيكلة بوابتك السيادية: تقولب وتجزّئ وتجدول كل شيء ذهنياً بتدفق ثابت يستند إليه الجميع.\",\"warn\":\"\"},\"H++\":{\"code\":\"K2-O-S-H++\",\"label\":\"معتمد: طفرة سيادية تقود ابتكار المسارات\",\"lock\":\"طفرة تنظيم ذهني **لا تعني مكتباً مرتباً ولا التزاماً فعلياً بالمواعيد** (دائرة الإنجاز).\",\"user\":\"الهيكلة تكاد تكون مُشغّلك الوحيد: تحوّل كل فوضى إلى نظام بكثافة استثنائية وتبتكر أطر تنظيم جديدة.\",\"warn\":\"GAP-DR-01.\",\"warn_status\":\"متقادم — GAP-DR-01 مغلقة (51-MATRIX-06 §136) · لا يُعرض\"},\"L\":{\"code\":\"K2-O-S-L\",\"label\":\"منخفض الجاهزية\",\"lock\":\"يُغطّى بالتخادم أو قالب جاهز.\",\"user\":\"التقسيم والجدولة المسبقة ليست تلقائية؛ قد تنطلق المشاريع بلا خريطة — غياب أولوية لا عجز.\",\"warn\":\"\"},\"L−\":{\"code\":\"K2-O-S-L−\",\"label\":\"ضعيف جداً — تخادم فوري\",\"lock\":\"وصف تشغيلي للمهمة، لا حكم.\",\"user\":\"الهيكلة بعيدة عن مسارك؛ المهام المعتمدة على القوالب والتسلسل الأنسب إسنادها.\",\"warn\":\"\"},\"M\":{\"code\":\"K2-O-S-M\",\"label\":\"متوازن مستقر\",\"lock\":\"موقع مستقر تحت العتبة.\",\"user\":\"التنظيم حاضر بتوازن: تستدعيه عند الحاجة دون أن يتصدّر ترتيبك.\",\"warn\":\"\"},\"M+\":{\"code\":\"K2-O-S-M+\",\"label\":\"مساندة فعّالة موثوقة\",\"lock\":\"أول كتلة مشتعلة — مساندة نشطة.\",\"user\":\"الهيكلة عدسة فعّالة تُستدعى عند مشروع كبير أو تدفق مختل، دون أن تنفرد بالقيادة.\",\"warn\":\"\"},\"OUT\":{\"code\":\"K2-O-S-OUT\",\"label\":\"خطورة بالغة: تعطل/ضمور\",\"lock\":\"غياب عدسة، لا حكم ولا عيادة (`P = C + G`).\\n\\n---\",\"user\":\"عدسة الهيكلة غائبة عن ترتيبك؛ المهام الإجرائية تحتاج إسناداً + قالباً مفروضاً من البيئة.\",\"warn\":\"\"}},\"R\":{\"H\":{\"code\":\"K2-R-S-H\",\"label\":\"متقدم قائد\",\"lock\":\"قيادة عملية ذهنية، لا ضمان تنفيذ.\",\"user\":\"عدستك القائدة الجدوى: من يسأل \\\"بكم؟ ومتى؟ وبمن؟\\\" فيحوّل الأحلام إلى مشاريع.\",\"warn\":\"\"},\"H+\":{\"code\":\"K2-R-S-H+\",\"label\":\"متميز سيادي\",\"lock\":\"سيادة عدسة الجدوى ≠ تنفيذ ميداني (K_4 مستقل).\",\"user\":\"الجدوى بوابتك السيادية: تلتقط الممكن والمكلف فوراً وبتدفق ثابت، وتحوّل الرؤى إلى خطوات نافذة اليوم.\",\"warn\":\"\"},\"H++\":{\"code\":\"K2-R-S-H++\",\"label\":\"معتمد: طفرة سيادية تقود ابتكار المسارات\",\"lock\":\"طفرة في عدسة الجدوى **لا تعني تنفيذاً ميدانياً فائقاً** (دائرة الإنجاز مستقلة).\",\"user\":\"الحس العملي يكاد يكون مُشغّلك الوحيد: تسعّر كل شيء بالمتاح لحظياً وتبتكر حلولاً من لا شيء بكثافة استثنائية تعيد رسم طرق الإنجاز.\",\"warn\":\"آلية بلوغ النطاق موقوفة (GAP-DR-01).\",\"warn_status\":\"متقادم — GAP-DR-01 مغلقة (51-MATRIX-06 §136) · لا يُعرض\"},\"L\":{\"code\":\"K2-R-S-L\",\"label\":\"منخفض الجاهزية\",\"lock\":\"يُغطّى بالتخادم، لا بمحاولة \\\"أن تصبح عملياً\\\".\",\"user\":\"تسعير القيود ليس مسارك التلقائي؛ قد تمرّ خطة بلا سؤال \\\"بكم؟\\\" — غياب أولوية لا عجز.\",\"warn\":\"\"},\"L−\":{\"code\":\"K2-R-S-L−\",\"label\":\"ضعيف جداً — تخادم فوري\",\"lock\":\"وصف تشغيلي للمهمة، لا حكم عليك.\",\"user\":\"الجدوى المادية بعيدة عن مسارك؛ المهام المعتمدة على التسعير والموارد الأنسب إسنادها لحاملها.\",\"warn\":\"\"},\"M\":{\"code\":\"K2-R-S-M\",\"label\":\"متوازن مستقر\",\"lock\":\"موقع مستقر تحت عتبة الاشتعال.\",\"user\":\"الحس العملي حاضر بتوازن: تستدعيه عند الحاجة الواضحة دون أن يتصدّر.\",\"warn\":\"\"},\"M+\":{\"code\":\"K2-R-S-M+\",\"label\":\"مساندة فعّالة موثوقة\",\"lock\":\"أول كتلة مشتعلة — مساندة نشطة لا ناقصة.\",\"user\":\"الجدوى عدسة فعّالة تُستدعى بموثوقية عند أزمة أو ميزانية، لكنها تشارك القيادة لا تنفرد بها.\",\"warn\":\"\"},\"OUT\":{\"code\":\"K2-R-S-OUT\",\"label\":\"خطورة بالغة: تعطل/ضمور\",\"lock\":\"غياب عدسة واحدة من الترتيب، لا حكم على الشخص ولا لغة عيادية (`P = C + G`).\\n\\n---\",\"user\":\"عدسة الجدوى غائبة عن ترتيب معالجتك؛ المهام التنفيذية-الموردية تحتاج إسناداً كاملاً + بوابة جدوى إلزامية.\",\"warn\":\"\"}},\"S\":{\"H\":{\"code\":\"K2-S-S-H\",\"label\":\"متقدم قائد\",\"lock\":\"هندسة الرسالة ذهنية، لا تنفيذ فعاليات ميداني (K_4).\",\"user\":\"عدستك القائدة المحيط البشري: الواجهة والمترجم؛ من يمرّر القرار الصعب ويحشد التأييد.\",\"warn\":\"\"},\"H+\":{\"code\":\"K2-S-S-H+\",\"label\":\"متميز سيادي\",\"lock\":\"سيادة قراءة السطح ≠ قراءة الأعماق (E)؛ والخجول قد يحملها.\",\"user\":\"قراءة الناس بوابتك السيادية: تقرأ المجلس قبل أن تجلس وتهندس القبول بتدفق ثابت.\",\"warn\":\"\"},\"H++\":{\"code\":\"K2-S-S-H++\",\"label\":\"معتمد: طفرة سيادية تقود ابتكار المسارات\",\"lock\":\"طفرة في عدسة السطح **لا تعني تعاطفاً ولا عمقاً إنسانياً** (E مستقل) ولا \\\"كاريزما\\\".\",\"user\":\"قراءة المحيط البشري تكاد تكون مُشغّلك الوحيد: تمسح المجالس وتهندس القبول بكثافة استثنائية وتبتكر مسارات نفوذ جديدة.\",\"warn\":\"GAP-DR-01.\",\"warn_status\":\"متقادم — GAP-DR-01 مغلقة (51-MATRIX-06 §136) · لا يُعرض\"},\"L\":{\"code\":\"K2-S-S-L\",\"label\":\"منخفض الجاهزية\",\"lock\":\"يُغطّى بالتخادم في توقيت الطرح وأسلوبه.\",\"user\":\"حساب \\\"كيف سيستقبلها الناس\\\" ليس تلقائياً؛ قد تصطدم فكرة ممتازة بمقاومة كان يمكن تفاديها — غياب أولوية لا ضعف.\",\"warn\":\"\"},\"L−\":{\"code\":\"K2-S-S-L−\",\"label\":\"ضعيف جداً — تخادم فوري\",\"lock\":\"وصف تشغيلي للمهمة، لا حكم.\",\"user\":\"عدسة المحيط البشري بعيدة عن مسارك؛ المهام المعتمدة على الحشد والتوافق الأنسب إسنادها.\",\"warn\":\"\"},\"M\":{\"code\":\"K2-S-S-M\",\"label\":\"متوازن مستقر\",\"lock\":\"موقع مستقر تحت العتبة.\",\"user\":\"الحس الاجتماعي حاضر بتوازن: تستدعيه عند موقف حساس دون أن يتصدّر.\",\"warn\":\"\"},\"M+\":{\"code\":\"K2-S-S-M+\",\"label\":\"مساندة فعّالة موثوقة\",\"lock\":\"أول كتلة مشتعلة — مساندة نشطة.\",\"user\":\"قراءة الناس عدسة فعّالة تُستدعى عند تفاوض أو رأب صدع، دون أن تنفرد بالقيادة.\",\"warn\":\"\"},\"OUT\":{\"code\":\"K2-S-S-OUT\",\"label\":\"خطورة بالغة: تعطل/ضمور\",\"lock\":\"غياب عدسة، لا حكم ولا عيادة (`P = C + G`).\\n\\n---\",\"user\":\"عدسة قراءة الناس غائبة عن ترتيبك؛ القرارات الماسّة بالجماعة تحتاج واجهة بشرية من طرف آخر.\",\"warn\":\"\"}},\"St\":{\"H\":{\"code\":\"K2-St-S-H\",\"label\":\"متقدم قائد\",\"lock\":\"تحديد الوجهة ذهني، لا تنفيذ (K_4) ولا توليد بدائل (H).\",\"user\":\"عدستك القائدة البوصلة: من يسأل \\\"هل هذا الطريق يوصلنا حيث نريد أصلاً؟\\\".\",\"warn\":\"\"},\"H+\":{\"code\":\"K2-St-S-H+\",\"label\":\"متميز سيادي\",\"lock\":\"سيادة التوجيه ≠ توليد إبداعي (H) ولا رسم خطوات تفصيلية (O).\",\"user\":\"رصد المآل بوابتك السيادية: ترى المنعطف قبل بلوغه بتدفق ثابت وتوجّه الدفة بثقة.\",\"warn\":\"\"},\"H++\":{\"code\":\"K2-St-S-H++\",\"label\":\"معتمد: طفرة سيادية تقود ابتكار المسارات\",\"lock\":\"طفرة في عدسة التوجيه **لا تعني توليد أفكار** (H — غبش عاملي) ولا تنظيماً (O) ولا تنفيذاً (K_4).\",\"user\":\"قراءة المآلات تكاد تكون مُشغّلك الوحيد: تربط الأنماط البعيدة وترسم البوصلة بكثافة استثنائية تعيد تعريف الوجهات.\",\"warn\":\"GAP-DR-01.\",\"warn_status\":\"متقادم — GAP-DR-01 مغلقة (51-MATRIX-06 §136) · لا يُعرض\"},\"L\":{\"code\":\"K2-St-S-L\",\"label\":\"منخفض الجاهزية\",\"lock\":\"يُغطّى بالتخادم: \\\"إلى أين يأخذنا هذا بعد سنوات؟\\\".\",\"user\":\"رصد المآلات ليس تلقائياً؛ قد تُفاجئك تحولات لم تُرصد — غياب أولوية البحث في الأفق لا عجز.\",\"warn\":\"\"},\"L−\":{\"code\":\"K2-St-S-L−\",\"label\":\"ضعيف جداً — تخادم فوري\",\"lock\":\"وصف تشغيلي للمهمة، لا حكم.\",\"user\":\"النظر بعيد المدى بعيد عن مسارك؛ القرارات المصيرية طويلة الأثر الأنسب مشاركتها مع حاملها.\",\"warn\":\"\"},\"M\":{\"code\":\"K2-St-S-M\",\"label\":\"متوازن مستقر\",\"lock\":\"موقع مستقر تحت العتبة.\",\"user\":\"النظر البعيد حاضر بتوازن: تستدعيه عند القرارات الكبرى دون أن يتصدّر.\",\"warn\":\"\"},\"M+\":{\"code\":\"K2-St-S-M+\",\"label\":\"مساندة فعّالة موثوقة\",\"lock\":\"أول كتلة مشتعلة — مساندة نشطة.\",\"user\":\"قراءة المآلات عدسة فعّالة تُستدعى عند قرار مصيري أو تحوّل كبير، دون أن تنفرد بالقيادة.\",\"warn\":\"\"},\"OUT\":{\"code\":\"K2-St-S-OUT\",\"label\":\"خطورة بالغة: تعطل/ضمور\",\"lock\":\"غياب عدسة، لا حكم ولا عيادة (`P = C + G`).\\n\\n---\",\"user\":\"عدسة المآل البعيد غائبة عن ترتيبك؛ القرارات الاستراتيجية تحتاج بوصلة من طرف آخر.\",\"warn\":\"\"}}}}",
  LOOKALIKE_K2: "{\"LD\":{\"LD-01\":{\"first\":\"الأمان عبر **السابقة المُجرّبة** (تاريخي)\",\"id\":\"LD-01\",\"pair\":\"C ↔ O\",\"question\":\"هل يرفض الجديد لأنه غير مُجرّب (C)، أم يقبله إن كان أكفأ هيكلياً (O)؟\",\"second\":\"الاستقرار عبر **الهندسة الأكفأ** (بنيوي ولو جديد)\",\"shared\":\"كلاهما يحمي الاستقرار ويقاوم التغيير الفوضوي\",\"source\":\"`50-DEPTH-K2-C` §5 بند 3 · `50-DEPTH-K2-O` §5 بند 3\"},\"LD-02\":{\"first\":\"**تضييق** الاحتمالات نحو مآل نافع (احتمالي)\",\"id\":\"LD-02\",\"pair\":\"St ↔ H\",\"question\":\"هل يفلتر نحو مسار واحد (St)، أم يفتح بدائل لا نهائية (H)؟\",\"second\":\"**توسيع** الاحتمالات بلا قيد (تباعدي)\",\"shared\":\"كلاهما يتعامل مع المجرد الكبير وغير المألوف\",\"source\":\"`50-DEPTH-K2-St` §5 بند 1 · `50-DEPTH-K2-H` §5 بند 1 · **غبش عاملي موثق**\"},\"LD-03\":{\"first\":\"قراءة **السطح الأفقي** (مناخ، قبول، خريطة قوى)\",\"id\":\"LD-03\",\"pair\":\"S ↔ E\",\"question\":\"هل يقرأ موقع الشخص في الشبكة (S)، أم دافعه الدفين (E)؟\",\"second\":\"قراءة **القاع العمودي** (نية، ألم، احتياج)\",\"shared\":\"كلاهما يشتغل على \\\"الإنسان\\\" ويقرأ الناس\",\"source\":\"`50-DEPTH-K2-S` §5 بند 1 · `50-DEPTH-K2-E` §5 بند 3 · **الانهيار العاملي**\"},\"LD-04\":{\"first\":\"الفحص **المجهري** للمتغير الواحد (Micro)\",\"id\":\"LD-04\",\"pair\":\"A ↔ St\",\"question\":\"هل يحفر في التفصيلة (A)، أم يرصد الصورة الممتدة (St)؟\",\"second\":\"الرصد **الكلي** للنظام والمآل (Macro)\",\"shared\":\"كلاهما يحلل بعمق ويفحص قبل الحسم\",\"source\":\"`50-DEPTH-K2-A` §5 بند 7 · صدام CSLIM A↔St\"},\"LD-05\":{\"first\":\"**يحسب** الجدوى والقيود والموارد **ذهنياً مسبقاً**\",\"id\":\"LD-05\",\"pair\":\"R ↔ K_4\",\"question\":\"هل يرى الحل العملي (R)، أم ينفّذه ميدانياً (K_4)؟\",\"second\":\"**يباشر** التنفيذ والمبادرة والحركة فعلياً\",\"shared\":\"كلاهما يبدو \\\"عملياً منجزاً على الأرض\\\"\",\"source\":\"قفل §6 · `50-DEPTH-K2-R` §5 بند 1\"},\"LD-06\":{\"first\":\"**يبني** الخريطة الإجرائية والجدول **ذهنياً**\",\"id\":\"LD-06\",\"pair\":\"O ↔ K_4\",\"question\":\"هل يصمم المسار (O)، أم يسيّله على الأرض (K_4)؟\",\"second\":\"**يرتّب** مادياً و**يلتزم** بالزمن الفعلي حركياً\",\"shared\":\"كلاهما يبدو \\\"منظماً ملتزماً بالمواعيد\\\"\",\"source\":\"قفل §6 · `50-DEPTH-K2-O` §5 بندا 1،2 · GAP-O-01\"},\"LD-07\":{\"first\":\"**يقرأ** النموذج الداخلي للآخر **معرفياً جافاً**\",\"id\":\"LD-07\",\"pair\":\"E ↔ K_3\",\"question\":\"هل يفهم الألم قراءةً (E)، أم يعيش شدته حيوياً (K_3)؟\",\"second\":\"**ينظّم شدة** الاستثارة الحيوية والوجدانية\",\"shared\":\"كلاهما يبدو متصلاً بعالم المشاعر\",\"source\":\"قفل §6 · `50-DEPTH-K2-E` §5 بند 1 · \\\"المتفهم لا يبكي\\\"\"}}}",
  LOCKREG_K2: "{\"ACCEPTED_LOCK_MENTIONS\":{\"K2-E-S-H+|شدة الانفعال\":{\"context\":\"سيادة الفهم المعرفي ≠ شدة الانفعال (K_3)؛ الفهم عدسة والانف\",\"kind\":\"منع\",\"term\":\"شدة الانفعال\",\"verdict\":\"إنفاذ قفل — الصيغة نفيٌ/فصلٌ لا خلط\"},\"K2-E-S-H|تشخيص\":{\"context\":\"قراءتك معلومة تشغيلية، لا \\\"تشخيص\\\" (لغة محظورة) ولا انفعال\",\"kind\":\"منع\",\"term\":\"تشخيص\",\"verdict\":\"إنفاذ قفل — الصيغة نفيٌ/فصلٌ لا خلط\"},\"K2-R-S-H+|تنفيذ ميداني\":{\"context\":\"سيادة عدسة الجدوى ≠ تنفيذ ميداني (K_4 مستقل).\",\"kind\":\"منع\",\"term\":\"تنفيذ ميداني\",\"verdict\":\"إنفاذ قفل — الصيغة نفيٌ/فصلٌ لا خلط\"}},\"note\":\"DEC-229 — ذِكرٌ مشروع داخل حقل قفل. أي إصابة خارج هذا السجلّ تُرصد.\"}",
  CONTENT_K4: "{\"_meta\":{\"pack\":\"CONTENT_K4\",\"rule\":\"صفر تأليف — كل نص هنا منقول حرفياً من طبقة المستخدم المختومة (DEC-265). الفحص آلي في test_report_k4.py: أي نص لا يوجد حرفياً في مصدره يوقف الإصدار.\",\"sealed_by\":\"DEC-266\",\"sources\":{\"F\":\"55-USER-K4-F_Focus_User_Layer.md\",\"OR\":\"55-USER-K4-OR_Organization_User_Layer.md\",\"PER\":\"55-USER-K4-PER_Perseverance_User_Layer.md\",\"PF\":\"55-USER-K4-PF_Priorities_User_Layer.md\",\"TI\":\"55-USER-K4-TI_Task_Initiation_User_Layer.md\",\"TM\":\"55-USER-K4-TM_Time_Management_User_Layer.md\",\"WM\":\"55-USER-K4-WM_Working_Memory_User_Layer.md\",\"_contract\":\"136-K4-ENGINE_DEC-266.md\",\"_surfaces\":\"138-K4-SURFACES_DEC-268.md\"},\"version\":\"1.0\"},\"band_label\":{\"OUT\":\"قراءة خاصة\",\"core\":\"كفاءة أساسية\",\"high\":\"قدرة عالية\",\"limited\":\"حضور محدود\"},\"composed\":{\"bottleneck_meaning\":\"«الأدنى» هنا **موضعٌ في ملفك أنت** — مقارنةً بين محطاتك لا بينك وبين أحد.\",\"bottleneck_tie\":\"تعادلُ أكثر من محطة في النطاق الأدنى **يُعرض كما هو** — ولا يُرجَّح بينها بما لا سند له.\",\"interruption_multi\":\"تتعدد مواضع الانقطاع عندك، وتُعرض **بترتيب المسار لا بترتيب أهمية** — فالمحطات السبع لازمة معاً.\",\"kind\":{\"تعزيز\":\"حين تكون **{أ}** و**{ب}** في نطاق القدرة العالية معاً، يقع العمق في موضعه — فالناتج أكبر من جمع المحطتين.\",\"تفاقم\":\"**{أ}** و**{ب}** في نطاق الحضور المحدود معاً — و**كلٌّ منهما يوسّع أثر الآخر**، فتُقرآن معاً لا كلٌّ على حدة.\",\"مؤازرة\":\"**{أ}** تسند **{ب}** حيث تحتاج سنداً. وحدُّ السند مصرَّح: **يخفّف الأثر ولا يؤدي الوظيفة الغائبة** — ولحظة انقطاعك عن السند يعود ما كان مخفَّفاً ظاهراً.\",\"هدر\":\"**{أ}** في نطاق الحضور المحدود **يُسقط ثمرة {ب}** — و**{ب} لم تضعف**: قوتها قائمة، والساقط مردودها.\"},\"network_lead\":\"فيما يلي كيف تعمل محطاتك بعضها مع بعض — قراءةُ **مردودٍ** لا قراءةَ درجات.\",\"network_limit\":\"هذه أوصافُ **مردودٍ** بين محطاتك — لا سببيةً مثبتة، ولا حكماً على درجة أيٍّ منها، ولا ترتيبَ أهمية بينها.\",\"pattern\":{\"K4-PAT-01\":\"ثلاث محطات متجاورة الأثر — الأولويات والوقت والإكمال — في نطاق الحضور المحدود معاً. وما يميّز اجتماعها أنه **يُقرأ مركَّباً لا ثلاث قراءات منفصلة**.\",\"K4-PAT-02\":\"محطاتك السبع في نطاق القدرة العالية. وهذه قراءة **ملفٍّ لا سبع قراءات**: طريقة عملٍ قائمة يُحافَظ عليها — لا مهارةٌ تُبنى.\",\"K4-PAT-03\":\"محطاتك السبع في نطاق الحضور المحدود. وهذه كذلك قراءة **ملفٍّ واحد** تقتضي مدخلاً واحداً متدرجاً، لا سبع معالجات متوازية.\",\"K4-PAT-04\":\"محطةٌ واحدة في نطاق الحضور المحدود وسائرها في الكفاءة الأساسية فأعلى — فقراءة ملفك تنطلق **من موضع واحد**.\"},\"pattern_limit\":\"النمط **وصفُ اجتماعٍ** لا مقياسَ شدة، ولا يُقرأ سبباً لشيء، ولا يُعمَّم على غير حالته.\"},\"crossing\":{\"closing\":\"هذه احتمالات **مسجَّلة بنيوياً وغير محقَّقة ميدانياً** — تُعرض لتوسيع نظرك، لا لتُصدر حكماً. والتمييز بينها **يعرفه صاحب التجربة** لا النظام.\",\"entry\":{\"K4-XR-02\":\"**«لم أبدأ» لا تعني بالضرورة ضعفاً في محطة البدء**: قد يكون الدافع نفسه لم يتولّد أصلاً — ومولِّد الدافع نظامٌ آخر لا تقيسه هذه الدائرة.\",\"K4-XR-03\":\"القاعدة الحاكمة سؤالٌ واحد: **هل رافق التوقفَ أو الانحرافَ مؤشرٌ داخلي محسوس، أم كان الداخل هادئاً وتعطّل التنفيذ الخارجي وحده؟** الأول شأن دائرة أخرى، والثاني شأن هذه الدائرة.\",\"K4-XR-04\":\"**بأيّ حالٍ كنتَ وقت التوقف؟** ملل أو تعب سلوكي مع هدوء داخلي ⇒ هذه الدائرة · قلق أو ثقل محسوس ⇒ دائرة أخرى. **وثمة حالة ثالثة يعترف النموذج أنه لا يحسمها**: إنهاكٌ صامت بلا قلق واعٍ — **تُعرض ولا تُنسب لأيٍّ منهما**.\",\"K4-XR-05\":\"**أن تشحن نفسك داخلياً بنجاح لا يستلزم أن يقع الفعل**: الطاقة والتأهّب حالةٌ تُقاس بذاتها، ولا يُستنتج من عدم البدء ضعفٌ فيها.\",\"K4-XR-06\":\"**بعد كبحٍ ناجح**: إن نشأت نيّة أو بديلٌ واضح ولم يُنفَّذ، فالتقصير في التنفيذ لا في الكبح — وإن لم تنشأ نيّة أصلاً فالموضع آخر.\",\"K4-XR-08\":\"**وضوح الخطة في ذهنك شيء، وتحريكها في الميدان شيء آخر**: إن كانت الخطة مرتَّبة تماماً والفوضى في التطبيق، فالموضع ميداني — وبناء الترتيب الذهني نظامٌ آخر.\"},\"heading\":\"قبل أن تنسب هذا إلى تنفيذك\",\"lead\":\"هذه ليست قراءةً لدائرة أخرى، ولا رقماً منها. هي **احتمالات إسنادٍ مسجَّلة** في النموذج: قبل أن يُنسب ما تلاحظه إلى محطة من محطات إنجازك، ثمة مواضع أخرى قد يكون منها.\"},\"heading\":{\"audit\":\"بصمة القراءة\",\"bottleneck\":\"المحطة الأدنى\",\"interruption\":\"مواضع الانقطاع\",\"lookalike\":\"أسئلة للفرز\",\"network\":\"كيف تعمل محطاتك معاً\",\"panel\":\"لوحة محطاتك\",\"reserve\":\"تحفّظ القراءة\",\"training\":\"تدريبات\"},\"lookalike\":{\"K4-LK-01\":\"هل وقع الانجراف عند الاختيار — أي لم يُختَر الأعلى أثراً أصلاً — أم أثناء التنفيذ على هدفٍ اختير صحيحاً؟\",\"K4-LK-02\":\"هل خفّض الترتيبُ الاحتكاكَ على مهمة جارية — أم صار الترتيب هو المهمة؟\",\"K4-LK-03\":\"هل توقف الجهد عند التعب أو الملل — أم استمر الجهد واصطدمت الخطة بزمنها الحقيقي؟\"},\"notice\":{\"choke_plain\":\"وهذه قراءة موضعٍ على التتابع، لا قولٌ بأنها تخنق ما بعدها.\",\"gap\":\"بعض محطاتك خارج نطاق التصنيف — بياناتها متعارضة أو ناقصة. هذا تقرير فجوة تشغيلية: لا يُقرأ فوق النقص نمطٌ ولا قراءة مسار.\",\"lookalike_lead\":\"مشهدٌ يحتمل أكثر من قراءة — والفرز بالمحرّك لا بالأثر:\",\"order\":\"الترتيب هنا سند قراءة لا قياس: المحطات السبع لازمة معاً.\",\"tie\":\"أكثر من محطة في النطاق الأدنى — تُعرض جميعاً بلا ترجيح.\",\"training_lead\":\"تدريبات مسنودة إلى مقاصد التصميم المختومة — تعمل داخل ما هو مكتسب وقابل للتغيير، بلا وعد نتيجة.\"},\"reserve\":{\"F\":\"حين تكون داخل عملك، هل **تفكّ ارتباطك حين يستحق الأمر فكّه** ثم تعود — أم أن عدم الانصراف عندك **شامل** لا يستثني ما ينبغي أن يمرّ؟ التعريف يجعل المرونة في العودة جزءاً من المهارة، لا خروجاً عليها.\",\"OR\":\"حين ترتّب، هل **يخفّ الاحتكاك على ما تنفّذه فعلاً** — أم يمضي الوقت في الترتيب ويبقى العمل حيث كان؟ التعريف يجعل الترتيب خادماً للتنفيذ، لا بديلاً عنه.\",\"PER\":\"هل **لمواصلتك حدّ** — نقطةٌ تتوقف عندها أو تعيد فيها التقدير — أم أنك تواصل **بلا شرط**؟ التعريف يجعل قابلية التعافي جزءاً من المهارة لا استثناءً منها.\",\"opening\":\"الأرجح أن درجتك العالية هنا كفاءة حقيقية.\"},\"training\":{\"F\":\"خصّص جلسة واحدة — لا يومك كله — **للمسار الحاكم تحديداً**: الشيء الذي يتحرك به كل ما بعده. المقصود ليس أن تركّز أكثر، بل أن **يقع عمقك على الموضع الذي يستحقه**.\",\"OR\":\"قبل أن تبدأ، **جهّز المسرح مرة واحدة**: ما تحتاجه أمامك، وما لا تحتاجه بعيد. المقصود أن تُدفع كلفة التهيئة **دفعة واحدة قبل البدء** بدل أن تُدفع مجزّأة في كل خطوة.\",\"PER\":\"لا تترك الإغلاق لآخر الطاقة — **ضعه داخل نافذة**: «هذا يُغلق قبل نهاية هذه النافذة». والإغلاق يكون بما عُرِّف مسبقاً أنه نهاية، لا بما يبدو نهايةً حين تتعب.\",\"PF\":\"بطاقة واحدة أمامك، فيها **سطر واحد**: ما هو الأعلى أثراً الآن. لا قائمة ولا ترتيب طويل — سطر واحد يُحدَّث حين يتغيّر، ويكون هو المرجع حين يزاحمك ما هو أسهل.\",\"TI\":\"قبل أن تفتح العمل، اكتب في سطر واحد **ما الذي يجعله منتهياً**: «ينتهي حين يُرسَل»، «ينتهي حين تُكتَب الفقرات الثلاث». تبدأ وأنت تعرف أين الباب الذي ستخرج منه.\",\"TM\":\"بدل «سأعمل على هذا اليوم»، حدّد **نافذة لها بداية ونهاية**: «من كذا إلى كذا، وهذا ما سيكون قد تمّ عند نهايتها». النافذة تجعل التقدير **قابلاً للمراجعة** بدل أن يبقى انطباعاً.\"},\"training_void\":{\"WM\":\"لا تدريب مسجَّل لهذه المحطة.\"},\"valve\":{\"F\":{\"U01\":\"هذه المهارة **ثلاثة أفعال لا فعل واحد**: أن تُوجّه انتباهك، وأن تقاوم ما يجذبه جانباً، وأن **تعود إلى مسارك بمرونة** حين ينحرف. والفعل الثالث جزء منها لا استثناء عليها — التركيز ليس ألّا تنحرف أبداً، بل أن تعرف طريق العودة.\",\"U03\":\"تدخل في العمل وتبقى فيه، وإذا سحبك شيء جانباً عدتَ سريعاً دون أن تفقد ما كنتَ فيه.\",\"U04\":\"ينسحب انتباهك إلى ما هو جانبي أكثر مما تريد، والأثقل من الانسحاب نفسه هو **بطء العودة**: تجد نفسك بعيداً وتحتاج وقتاً لتستأنف.\",\"U05\":\"حين ينسحب انتباهك، السؤال الأول ليس «كم تركيزي؟» بل: **هل رافق الانسحابَ شيء محسوس في داخلك** (قلق، ثقل، توتر)، أم كان الداخل هادئاً والانتباه وحده هو ما انجرف؟\"},\"OR\":{\"U01\":\"هذه المهارة **وسيلةٌ لها غاية مكتوبة في تعريفها**: أن يصير مسرحك الخارجي بحيث **تكلّفك كل خطوة أقلّ**. وهي فعلان لا فعل: أن **تبني** النظام، وأن **تديره** بعد بنائه.\",\"U03\":\"الأشياء في مواضعها، وما تحتاجه تصل إليه دون بحث. لا تُنفق طاقتك في تهيئة المسرح كلما بدأت — المسرح مهيَّأ سلفاً.\",\"U04\":\"تدفع **ضريبة احتكاك في كل خطوة**: بحثٌ عن أداة، ملفٌّ لا يُعرف مكانه، تهيئةٌ تُعاد كل مرة. ولا يظهر هذا في نتيجة واحدة كبيرة، بل في تسرّبٍ صغير متكرر.\",\"U05\":\"بينك وبين هذه المحطة سؤالٌ فاصل: **هل الخطة نفسها غير مرتَّبة في ذهنك، أم أنها مرتَّبة تماماً والفوضى في الميدان؟**\"},\"PER\":{\"U01\":\"هذه ليست مهارة «التحمّل بلا حدود». تعريفها نفسه يضع لها **حدّين**: أن تكون المواصلة **قابلة للتعافي**، وألّا تستنزف النظام. فالمثابرة هنا **استمرارٌ ذكي**، والذكاء فيه أنه يعرف حدّه.\",\"U03\":\"ما تبدأه يصل إلى نهايته. وحين يفتُر الحماس في المنتصف — وهو يفتُر — تواصل بالجهد لا بالحماس، ثم تستعيد طاقتك بعد الإنجاز.\",\"U04\":\"تتراكم عندك أشياء **مفتوحة**: بُدئت بجدّ ولم تُغلق. وليس السبب غياب الرغبة — الرغبة كانت حاضرة عند البداية؛ الفجوة في **المسافة الأخيرة** حين يفتُر الجديد ولم يبقَ إلا الإتمام.\",\"U05\":\"حين تتوقف عن إكمال شيء، السؤال الفاصل واحد: **بأيّ حالٍ كنتَ وقت التوقف؟**\"},\"PF\":{\"U01\":\"هذه المهارة **شقّان**: أن **تختار** الأعلى أثراً، وأن **تحمي** ذلك الاختيار من الانجراف. والشقّ الثاني هو الذي يُختبر يومياً — فالاختيار يُتخذ مرة، والحماية تُمارَس في كل ساعة.\",\"U03\":\"ينتهي يومك وقد تحرّك ما يستحق أن يتحرك. تعرف ما هو الأهم، وتبقى عليه حين يزاحمه ما هو أسهل أو أعجل.\",\"U04\":\"يمتلئ يومك بما هو **متاح** لا بما هو **أعلى أثراً**: أشياء كثيرة أُنجزت، والشيء الذي كان يحرّك البقية لم يُلمس. والتعب هنا حقيقي — لكنه وقع في غير موضعه.\",\"U05\":\"هذا ليس قولاً إنك لا تعرف الأهم؛ قد تعرفه تماماً. المقصود **ما وقع عليه وقتك فعلاً**، لا ما في ذهنك.\"},\"TI\":{\"U01\":\"جوهرها سؤال لحظي: *«هل أبدأ الآن؟»*. مهمتها أن تعبر بك المسافة بين **أن تنوي** و**أن تتحرك** — أن تتحوّل النية إلى فعل أول ملموس، من دون أن تنتظر دفعاً من خارجك.\",\"U03\":\"المسافة عندك بين القرار والحركة قصيرة: تقرر فتبدأ، ولا تحتاج موعداً نهائياً يدفعك ولا شخصاً يذكّرك.\",\"U04\":\"تكون النية حاضرة وواضحة، ويبقى الفعل الأول معلّقاً حتى يأتي دافعٌ من خارج: موعدٌ يقترب، أو طلبٌ من أحد، أو ضغطٌ يتراكم. **الفجوة ليست في الرغبة — بل في العبور من النية إلى الحركة.**\",\"U05\":\"علامتها الفارقة أن الشيء **لم يُفتَح أصلاً** — لا أنه فُتِح وتعثّر.\"},\"TM\":{\"U01\":\"ليست هذه مهارة «الالتزام بالمواعيد»، بل مهارة **صدق التقدير**: كم يستغرق هذا فعلاً — لا في أفضل الأحوال، بل في ظروفك الواقعية؟ ومنها يخرج وعدٌ بالتسليم يمكن الوفاء به.\",\"U03\":\"تقديرك قريب من الواقع، فما تعِد به يقع في وقته غالباً، ولا تفاجئك الأعمال بأنها كانت أطول مما ظننت.\",\"U04\":\"الزمن المُدرَك أقصر من الزمن الحقيقي. فتُبنى الخطط على تقدير متفائل، وحين تصطدم بواقعها يتحوّل آخرها إلى **سباق إنقاذ**.\",\"U05\":\"هذا ليس قولاً بأنك لا تحترم المواعيد؛ المقصود **دقّة التقدير** لا الالتزام الأخلاقي به.\"},\"WM\":{\"U01\":\"جوهر هذه المهارة سؤال يتردد أثناء العمل لا قبله: *«ما الذي يجب أن يبقى حاضراً في ذهني الآن؟»*. مهمتها أن تُبقي الهدف والخطوة التالية وما أنجزتَه للتوّ **حاضرةً معك وأنت تنفّذ** — فلا تفقد الخيط في منتصف الطريق.\",\"U03\":\"تستطيع أن تُقاطَع ثم تعود إلى ما كنت فيه دون أن تبدأ من الصفر. الهدف والخطوات تبقى معك وأنت تعمل، فلا تحتاج أن تسأل نفسك كل قليل: «أين كنت؟».\",\"U04\":\"يحدث أن يغيب عنك جزء من الخيط أثناء العمل نفسه: خطوة سقطت، أو هدفٌ ضاقت صورته، أو رجعتَ من مقاطعةٍ فوجدتَ نفسك تعيد التقاط ما كنتَ تعرفه. هذا وصفٌ لموضع هذه المحطة في ملفك الآن — **لا حكم عليك**، ولا وصفٌ لذاكرتك عموماً.\",\"U05\":\"علامتها الفارقة أنك **تبدأ فعلاً** — ثم يتسرّب السياق أثناء الطريق.\"}}}",
};

    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  // UTF-8
  const bytes = [];
  for (let i = 0; i < str.length; i++) {
    let c = str.codePointAt(i);
    if (c > 0xffff) i++;
    if (c < 0x80) bytes.push(c);
    else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63));
    else if (c < 0x10000) bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    else bytes.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push((bitLen / Math.pow(2, i * 8)) & 0xff);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < bytes.length; off += 64) {
    const w = new Array(64);
    for (let i = 0; i < 16; i++) {
      w[i] = (bytes[off+i*4] << 24) | (bytes[off+i*4+1] << 16) | (bytes[off+i*4+2] << 8) | bytes[off+i*4+3];
    }
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H = H.map((v, i) => (v + [a,b,c,d,e,f,g,h][i]) | 0);
  }
  return H.map((v) => (v >>> 0).toString(16).padStart(8, "0")).join("");

    const got = _sha256(_RAW[name]);

      bad.push(`${name} (${PACK_SOURCE[name]}): البصمة ${got.slice(0,16)} ≠ ${PACK_SHA[name].slice(0,16)}`);
    }
  }
  if (bad.length) throw new PackIntegrityError("انجراف حزمة — يُوقَف الإصدار:\n- " + bad.join("\n- "));

  var PCT_VALUE = /\d+(?:[.,]\d+)?\s*%/g;

  var MENTION_REGISTRY = Object.create(null);

  var PCT_REGISTRY = {
    "INTENSITY_K2:/S/A/M+/lock":
      'هذه أول كتلة "مشتعلة" (فوق 50%) — عدسة مساندة نشطة، لا ثانوية ولا ناقصة. `P = C + G`.',

  };

  function mkErr(name, message) { var e = new Error(message); e.name = name; return e; }
  function ctx(t, i) { return t.slice(Math.max(0, i - 60), i + 40).replace(/\n/g, " "); }
  function fmt(hits) {
    return hits.slice(0, 8).map(function (h) { return "    [" + h[0] + "] …" + h[1] + "…"; }).join("\n");
  }

  function scan(text) {
    if (typeof text !== "string") return [];
    var hits = [], m; SP_TOKEN.lastIndex = 0;
    while ((m = SP_TOKEN.exec(text)) !== null) {
      var c = ctx(text, m.index);
      if (Object.prototype.hasOwnProperty.call(MENTION_REGISTRY, c.trim())) continue;
      hits.push([m.index, c]);
    }
    return hits;
  }

  function spGate(text, where) {
    where = where || "<مخرج غير مسمّى>";
    var hits = scan(text);
    if (hits.length) throw mkErr("SPLeakError",
      "ح-4/DEC-183 — الرمز `SP%` حاضر في مخرج «" + where + "» (" +
      hits.length + " إصابة). الإصدار موقوف.\n" + fmt(hits));
    return text;
  }

  function stripRegistered(text) {
    for (var k in PCT_REGISTRY) {
      if (!Object.prototype.hasOwnProperty.call(PCT_REGISTRY, k)) continue;
      text = text.split(PCT_REGISTRY[k]).join("");
    }
    return text;
  }

  function scanPct(text) {
    if (typeof text !== "string") return [];
    var s = stripRegistered(text), hits = [], m;
    PCT_VALUE.lastIndex = 0;
    while ((m = PCT_VALUE.exec(s)) !== null) hits.push([m.index, ctx(s, m.index)]);
    return hits;
  }

  function pctGate(text, where) {
    where = where || "<مخرج غير مسمّى>";
    var hits = scanPct(text);

      "ح-5/DEC-183 — نسبة مئوية غير مسجَّلة في مخرج «" + where + "» (" +
      hits.length + " إصابة). الإصدار موقوف.\n" + fmt(hits));
    return text;
  }

  function outputGate(text, where) { spGate(text, where); pctGate(text, where); return text; }

  var API = { scan: scan, spGate: spGate, scanPct: scanPct, pctGate: pctGate,

              MENTION_REGISTRY: MENTION_REGISTRY, PCT_REGISTRY: PCT_REGISTRY };

  let n = 0;
  for (const ln of text.split("\n")) {
    if (ln.startsWith(LOCK_PREFIX)) n += 1; else kept.push(ln);
  }
  return [kept.join("\n"), n];
}

// R1 — كتل الشدة الثماني (إلزامية · 51-MATRIX-06/R1)
const _BAND_ALIAS = { "L-": "L−" };

function intensityBlock(dim, code) {
  const key = _BAND_ALIAS[code] || code;
  const b = ((PACKS.INTENSITY_K2.S[dim] || {})[key]);
  if (b) _USED.push(b.code);                    // DEC-222
  if (!b) throw new SlotResolutionError(`R1/حارس: كتلة الشدة K2-${dim}-S-${key} غائبة — لا تُخمَّن.`);
  return b;
}

const _CW = /[\u0600-\u06FF]{4,}/g;
const _contentWords = (t) => new Set(String(t).match(_CW) || []);

/** ت-6 (DEC-224) — تطابق مضموني: يرصد الاحتواء التامّ ويُبلِّغ أقصى تداخل. */
/** تقريب موحَّد لمنزلتين (`DEC-238`) — نصفٌ لأعلى بصيغة صريحة.
 *  نظيرٌ بتّي لـ`_round2` البايثونية؛ لا اتّكال على `Math.round` ولا على
 *  `round()`، فقد أعطتا `0.13` مقابل `0.12` عند `0.125`. */
function _round2(v) { return Math.floor(v * 100 + 0.5) / 100; }

function t6Guard(deliveryLines, calledUnits) {
  const hits = [];
  let worst = 0;
  for (const ln of deliveryLines) {
    const w = _contentWords(ln);
    if (!w.size) continue;
    for (const unit of calledUnits) {
      const wu = _contentWords(unit);
      if (!wu.size) continue;
      let inter = 0;
      for (const x of w) if (wu.has(x)) inter += 1;
      const ratio = inter / w.size;
      if (ratio > worst) worst = ratio;
      if (ratio >= 1.0) { hits.push({ check: "ت-6", line: ln.slice(0, 50), unit: unit.slice(0, 50) }); break; }
    }
  }
  return [hits, _round2(worst)];
}

function purGate(text, dims) {
  const hits = [];
  for (const d of dims) {
    for (const row of (PACKS.PUR_K2.PUR[d] || [])) {
      if (text.includes(row.forbidden)) {
        hits.push({ dim: d, check: "PUR", token: row.forbidden.slice(0, 40),
                    alt: row.alt.slice(0, 60) });
      }
    }
  }
  return hits;
}

function purScanPacks(dims) {
  const hits = [];
  for (const d of dims) {
    const layer = PACKS.USERLAYER_K2[d] || {};
    for (const code of Object.keys(layer)) {
      for (const row of (PACKS.PUR_K2.PUR[d] || [])) {
        if (String(layer[code].user || "").includes(row.forbidden)) {
          hits.push({ dim: d, entry: code, token: row.forbidden.slice(0, 40) });
        }
      }
    }
  }
  return hits;
}

function _board(profile) {
  // DEC-183: لا SP · DEC-187: الحالة بالكلمة + الرمز
  const rows = ["| البُعد | الرمز | الحالة |", "| :-- | :--: | :-- |"];
  const st = { D: "مهيمنة", M: "مساندة", L: "منطفئة" };
  for (const d of profile.ranked) {
    const sp = profile.sp[d];
    const tag = (d === profile.center) ? "🎯 المركز" : st[K2.compState(sp)];
    rows.push(`| ${K2.LENS_NAME[d]} (${d}) | ${K2.octalCode(sp)} | ${tag} |`);
  }
  return rows.join("\n");
}

function _k2line(code) {
  const center = code.split("-")[0];
  const pack = PACKS.CONTENT_K2[center];
  if (pack && pack.lines && code in pack.lines) return pack.lines[code];
  throw new Error(`سطر «${code}» غير موجود في أي مصدر معتمد.`);
}

// DEC-225/و — نطاقا العرض: brief = R2/R3 حرفياً · full = DEC-211/ج₂
// ════════════════════════════════════ محوّل حزمة المحتوى (DEC-236) ═══
/**
 * نظير `ContentPack.texts_for` في `k2_content.py` — يجمع نصوص المصدر
 * المستدعاة فعلاً لهذا الملف كي يمسحها تدقيق العزل في المحرّك.
 *
 * مطابقة حرفية مقصودة: نصّ العمى أولاً، ثم لكل عدسة غير المركز
 * `presence` فـ`recommendation`، بترتيب مفاتيح `sp` نفسه. والمفقود
 * **يُتجاوَز صمتاً** كما في بايثون — لا يُرفع استثناء.
 */
const K2_CONTENT_ADAPTER = {
  textsFor(profile) {
    const out = [];
    const c = profile.center;
    const pack = PACKS.CONTENT_K2[c];
    if (pack && pack.blindness) out.push(pack.blindness);
    for (const lens of Object.keys(profile.sp)) {
      if (lens === c) continue;
      const v = profile.sp[lens];
      const st = v > 70 ? "D" : v > 50 ? "M" : "L";
      const ln = pack && pack.lines ? pack.lines[`${c}-${lens}-${st}`] : null;
      if (!ln) continue;                       // نظير MissingContentError المتجاوَز
      out.push(ln.presence, ln.recommendation || "");
    }
    return out.filter(Boolean);
  },
};

function buildReportK2(sp, mode) {
  mode = mode || "full";
  _USED = [];                                   // DEC-220
  const res = K2.run({ sp, content: K2_CONTENT_ADAPTER });   // DEC-236
  const c = res.profile.center;
  const L = [];
  let n = 0;
  const extPending = [];

  const head = (t) => { n += 1; L.push(`## ${AR_NUM[n - 1]} · ${t}`, J1(t), ""); };

  // ① قبل أن تقرأ — DEC-188: حرفياً
  head("قبل أن تقرأ"); L.push(`> ${PCG_LOCK}`, "");

  // ② لوحة الرموز
  head("لوحة رموزك الثمانية"); L.push(_board(res.profile), "");
  L.push("**ماذا يعني رمز كل عدسة عندك:**", "");
  for (const d of res.profile.ranked) {
    const b = intensityBlock(d, K2.octalCode(res.profile.sp[d]));
    L.push(`- **${K2.LENS_NAME[d]} (${d}) — ${b.code.split("-").pop()}`
      + (b.label ? ` · ${b.label}` : "") + `:** ` + b.user);
    if (b.lock) L.push(`  > 🔒 ${b.lock}`);
  }
  L.push("");

  // ③ مركزك
  const centerEntries = CENTER_SLOTS.flatMap((sl) => resolveSlot(c, sl));
  const cat = _catalog(c, centerEntries);
  head(`مركزك — ${K2.LENS_NAME[c]}`);
  if (cat) L.push(...cat, "");
  else { extPending.push(`55-USER-K2-${c}`); L.push("> وسم إلزامي: [كتالوج المركز — خارجي]", ""); }   // DEC-210 · ج-4

  // ④ عدساتك المهيمنة والمساندة
  // DEF-K2-03 — المركز قد يقع في support إن كان SP ≤ 70
  const others = res.profile.dominant.concat(res.profile.support).filter((d) => d !== c);
  if (others.length) {
    head("عدساتك المهيمنة والمساندة");
    for (const d of others) {
      const sc = _catalog(d, SUPPORT_SLOTS.flatMap((sl) => resolveSlot(d, sl)));
      L.push(`### ${K2.LENS_NAME[d]} (${d}) — ${K2.octalCode(res.profile.sp[d])}`);
      L.push(...(sc || ["> وسم إلزامي: [محتوى خارجي]"]), "");
    }
  }

  // العدسات المعروضة — المركز + المهيمنة + المساندة
  const shown = (mode === "brief") ? [c] : [c].concat(others);
  const sub = (d, entries) => {
    const e = _catalog(d, entries);
    if (e) { L.push(`### ${K2.LENS_NAME[d]} (${d})`); L.push(...e, ""); }
    return Boolean(e);
  };

  // ⑤ كيف تتركّب عدساتك
  head("كيف تتركّب عدساتك");
  L.push("**نقطة عماك — مقروءةً مع ملفك (ت-8):**", "");
  for (const h of res.t8) L.push(`- ${h.half}: ${h.phrase}.`);
  if (res.stitch) L.push("", `> ${res.stitch}`);
  L.push("");
  const cov = res.lines.filter((x) => x.kind === "coverage");
  const col = res.lines.filter((x) => x.kind === "coloring");
  L.push("**تغطية عماك عبر عدساتك:**", "");
  for (const x of cov) L.push(`- ${_k2line(x.code).presence}`);
  L.push("", "**كيف تلوّن عدساتك تعبيرك:**", "");
  for (const x of col) L.push(`- ${_k2line(x.code).presence}`);
  L.push("");
  L.push("**ما تُسقطه كل عدسة قبل أن تعالج · ونقطة عماها:**", "");
  for (const d of shown) sub(d, slotFilter(d).concat(resolveSlot(d, "BLIND")));

  // ⑥ حين تلتقي عدستان
  head("حين تلتقي عدستان");
  const r11 = r11Block(res.profile);
  if (r11.length) L.push("**حين يشتعل التوليد والتوجيه معاً (R11):**", "", ...r11);
  L.push("**كيف تقرأ من أمامك بكل عدسة:**", "");
  for (const d of shown) sub(d, slotOthers(d));

  // ⑦ تحت الضغط
  head("تحت الضغط");
  for (const d of shown) sub(d, resolveSlot(d, "PRESSURE").concat(slotNoise(d)));

  // ⑧ أسئلة تخصّك (ت-7)
  head("أسئلة تخصّك وحدك");
  L.push(res.delivery_questions.length
    ? "> هذه أسئلة تساعدك على قراءة ما سبق بنفسك — لا أحكام."
    : "> ملاحظة تخادم: راجع مقطع كيف تتركّب عدساتك.", "");
  for (const code of res.delivery_questions) L.push(`- ${_k2line(code).question}`);
  L.push("");

  // ⑨ نقاط عماك · بصمتك
  head("نقاط عماك · بصمتك");
  if (res.profile.off.length) {
    L.push("> غياب أولوية لا نقص — تُغطّى بالتخادم لا بالإصلاح الذاتي (P = C + G).", "");
    for (const d of res.profile.off) {
      L.push(`- **${K2.LENS_NAME[d]} (${d})** منطفئة (${K2.octalCode(res.profile.sp[d])}).`);
    }
    L.push("");
  }
  for (const d of shown) {
    const ok = sub(d, resolveSlot(d, "FOOTPRINT")
      .concat(resolveSlot(d, "NOTMINE", false), slotEconomy(d), slotMech(d)));
    if (!ok && d === c) { extPending.push(`55-USER-K2-${c}/البصمة`); L.push("> وسم إلزامي: [محتوى خارجي]", ""); }
  }

  // R10 — الوسمان الإجرائيان الملازمان (51-MATRIX-06 §15 · DEC-219) بقالب ج-4
  L.push("", "> وسم إلزامي: [توحيد تشغيلي مؤقت — GAP-A-01 — قابل للترقية]",
         "> وسم إلزامي: [توحيد تشغيلي مؤقت — GAP-A-02 — قابل للمراجعة]");

  L.push("", J6);

  // R9 — البوابة على كامل المخرج قبل الإصدار (DEC-213)
  // ت-6 (DEC-224)
  const _deliveryLines = res.lines.map((x) => _k2line(x.code).presence);
  const _calledUnits = res.profile.ranked
    .map((d) => intensityBlock(d, K2.octalCode(res.profile.sp[d])).user)
    .concat(CENTER_SLOTS.flatMap((sl) => resolveSlot(c, sl))
      .map((k) => ((PACKS.USERLAYER_K2[c] || {})[k] || {}).user).filter(Boolean));
  const [t6Hits, t6Worst] = t6Guard(_deliveryLines, _calledUnits);

  const textOut = L.join("\n");
  const [scanned, locksExcluded] = stripLocks(textOut);   // DEC-217/ب
  const dimsCalled = [c].concat(others);
  const gate = K2.auditIsolation([scanned])
    .map((w) => ({ check: "isolation", token: w }))
    .concat(purGate(scanned, dimsCalled), purScanPacks(dimsCalled),
            scanLockFields(), scanLockDrift());   // ح-7 · DEC-241

  const packSha = {
    USERLAYER_K2: _shaObj(PACKS.USERLAYER_K2), PUR_K2: _shaObj(PACKS.PUR_K2.PUR),
    INTENSITY_K2: _shaObj(PACKS.INTENSITY_K2.S), LOOKALIKE_K2: _shaObj(PACKS.LOOKALIKE_K2.LD),
    CONTENT_K2: _shaObj(PACKS.CONTENT_K2),          // DEC-223
  };
  const spR = {};
  for (const d of Object.keys(sp).sort((a, b) => (a < b ? -1 : a > b ? 1 : 0))) {
    spR[d] = Math.round(sp[d] * 10) / 10;
  }

  const audit = {
    sp: spR, engine_version: K2.ENGINE_VERSION, spec_version: K2.SPEC_VERSION,
    instrument_pin: K2.INSTRUMENT_PIN,
    entries_used: Array.from(new Set(_USED
      .concat(res.lines.map((x) => x.code))                     // DEC-222
      .concat(dimsCalled.map((d) => `PUR-${d}`))))
      .sort((a, b) => (a < b ? -1 : a > b ? 1 : 0)),
    pack_sha: packSha,
    report_sha256: PK._sha256(textOut).slice(0, 16),
    r9_gate: gate.length ? gate : "clean",
    r9_locks_excluded: locksExcluded,
    lock_registry_size: Object.keys(PACKS.LOCKREG_K2.ACCEPTED_LOCK_MENTIONS).length,
    r10_tags: ["GAP-A-01", "GAP-A-02"],
    // DEC-245 — إعلان حالة الديون، نظيرَ ما في K3. **إعلانٌ لا قياس**:
    // مستخرَج من `02-MASTER` ولا يُحسب من الكود. المحتوى مطابق للنظير البايثوني.
    accepted_debts: ["DEBT-K2-BALANCE-01", "GAP-LOCK-01"],
    open_debts: [],
    t6_gate: t6Hits.length ? t6Hits : "clean", t6_max_overlap: t6Worst,
    mode: mode, sections_rendered: n, center: c, composition_lines: res.lines.length,
    delivery: res.delivery_questions,
    t8: res.t8.map((h) => [h.half, h.verdict]),
    fric02: Boolean(res.stitch),
    isolation: res.audit.length ? res.audit : "clean",
    external_pending: _sortCP(Array.from(new Set(extPending))),
  };
  return [SPG.outputGate(L.join("\n"), `تقرير K2 · ${mode}`), audit];
}

// ═════════════════════════════════════════════════════════════ K3 ═══════

// DEC-196 — تغطية صريحة لكل نطاق؛ لا وسم افتراضي صامت
const BAND_LABEL = {
  limited: "حضور محدود", core: "كفاءة أساسية",
  high: "قدرة عالية", OUT: "قراءة خاصة",
};

function bandLabel(b) {
  if (!(b in BAND_LABEL)) throw new Error(`DEC-196/حارس: نطاق غير معتمد «${b}» — يُصدر تقرير فجوة`);
  return BAND_LABEL[b];
}

// DEC-197/ج — الاسم المرادف يُشتقّ من نصّ الخاتمة المعتمد، لا يُؤلَّف
const _ALT_RE = /وهذه المهارة\s*—\s*\*\*(.+?)\*\*/;

function altName(skill) {
  const m = _ALT_RE.exec(PACKS.CIRCLE_K3.tail[skill]);
  if (!m) throw new Error(`DEC-197/حارس: اسم الخاتمة غير مستخرَج في ${skill}`);
  return m[1].trim();
}

function skillHeading(skill, b) {
  const short = K3.USER_NAME[skill], alt = altName(skill);
  // DEC-228/ب — التطابق التامّ وحده (لا احتواء جزئي)
  const name = (alt === short) ? short : `${short} (${alt})`;
  return `### ${name} — ${bandLabel(b)}`;
}

const H3 = { 1: "قبل أن تقرأ", 2: "موقعك من النظام", 4: "قدراتك الخمس",
             5: "تأكُّد من القوة", 6: "كيف تعمل قدراتك معاً", 7: "من أين يبدأ هذا؟",
             8: "هل هذا أنا؟", 9: "فكرة تصلح لما بعد التقرير" };

/** ر-2: يُسقط سطر عنوان المصدر (### أو #) ويُبقي المتن. */
function dropHeading(text) {
  const lines = text.split("\n");
  if (lines.length && lines[0].trimStart().startsWith("#")) lines.shift();
  return lines.join("\n").trim();
}

/** التقرير الفردي الكامل — تسعة أقسام (SPEC v2.1 §7 · DEC-139). */
// ═══════════════════════════════ عقد المحتوى الخارجي لـK3 (DEC-238) ═══
/**
 * نظير `REQUIRED_EXTERNAL` في `k3_content.py` — **بالمفاتيح وبالترتيب نفسه**،
 * لأن `missing()` تُرجِع بترتيب العقد لا بترتيب الفقد.
 *
 * كلٌّ يشير إلى **مصدره الفعلي في الحزم**، لا إلى قيمة ثابتة: الحقل الذي
 * لا يفحص يُبلّغ سلامةً كاذبة — وهو عين ما كان يفعله `auditIsolation([])`
 * قبل `DEC-236`.
 */
const K3_EXTERNAL_CONTRACT = {
  covenant_opening:  () => PACKS.THREE_K3.covenant_opening,
  circle_map_shared: () => PACKS.CIRCLE_K3.shared,
  circle_map_tail:   () => PACKS.CIRCLE_K3.tail,
  trust_banner:      () => PACKS.BANNER_K3.trust_banner,
  skill_sections:    () => PACKS.SECTIONS_K3,
  verify_block:      () => PACKS.TEXTLAYER_K3.VERIFY_BLOCK,
  separation_qs:     () => PACKS.TEXTLAYER_K3.SEPARATION_QS,
  out_text:          () => PACKS.THREE_K3.out_text,
  reflective_frame:  () => PACKS.THREE_K3.reflective_frame,
};

/** محوّل حزمة محتوى K3 (`DEC-240`) — نظير `ContentPack` في تمرير `missing()`
 *  إلى بوابة `strict` بالمحرّك، كما يفعل `k3_report.py:83`. */
const K3_CONTENT_ADAPTER = { missing: () => k3MissingContent() };

function k3MissingContent() {
  return Object.keys(K3_EXTERNAL_CONTRACT).filter((k) => {
    let v;
    try { v = K3_EXTERNAL_CONTRACT[k](); } catch (e) { return true; }
    if (v === undefined || v === null || v === "") return true;
    if (typeof v === "object" && !Object.keys(v).length) return true;
    return false;
  });
}

function buildReportK3(sp) {
  const TL = PACKS.TEXTLAYER_K3;
  const res = K3.run(sp, TL, PACKS.G5_K3, { content: K3_CONTENT_ADAPTER });   // DEC-240
  const L = [];
  let n = 0;
  const head = (key) => { n += 1; L.push(`## ${AR_NUM[n - 1]} · ${H3[key]}`, ""); };

  // ① فاتحة العهد
  head(1); L.push(PACKS.THREE_K3.covenant_opening, "");

  // ② خريطة الدائرة — DEC-195/ج: المشترك فقط
  head(2); L.push(PACKS.CIRCLE_K3.shared, "");

  // ③ لافتة الثقة — ر-4: بلا عنوان ولا رقم
  if (["limited", "OUT"].includes(K3.band(sp.EP))) {
    L.push("> ⚠️ " + PACKS.BANNER_K3.trust_banner, "");
  }

  // ④ الأقسام المهارية — ر-3: C-01 يُسقَط (العنوان يحمل معناه)
  head(4);
  for (const s of K3.SKILLS) {
    const b = K3.band(sp[s]), sec = PACKS.SECTIONS_K3[s];
    L.push(skillHeading(s, b), "", PACKS.CIRCLE_K3.tail[s], "", sec.U01, "");
    if (b === "OUT") {
      L.push(PACKS.THREE_K3.out_text.replace("{القدرة}", K3.USER_NAME[s]), "", sec.U10, "");
    } else if (b === "core" || b === "high") {
      L.push("**ما يظهر عندك:**", sec.U08, "");
    } else {
      L.push("**ما يحتاج انتباهاً:**", sec.U09, "");
    }
  }

  // ⑤ كتلة التحقق — قبل القراءة المركّبة (ق7)
  const high = ["IR", "BI", "CF", "ST"].filter((s) => K3.band(sp[s]) === "high");
  if (high.length) {
    L.push(TL.CONNECTIVES["C-02"], "");
    head(5);
    L.push(dropHeading(TL.VERIFY_BLOCK), "");
    for (const s of high) L.push("- " + TL.VERIFY_QUESTIONS[s]);
    L.push("", TL.VERIFY_CLOSING, "");
  }

  // ⑥ القراءة المركّبة
  if (res.section6) { head(6); L.push(res.section6, ""); }

  // ⑦ سؤال موضع الجذر
  if (res.section7) { head(7); L.push(res.section7, ""); }

  // ⑧ أسئلة الفصل
  L.push(TL.CONNECTIVES["C-05"], "");
  head(8); L.push(TL.SEPARATION_QS, "");

  // ⑨ الإطار التأملي
  L.push(TL.CONNECTIVES["C-06"], "");
  head(9); L.push(dropHeading(PACKS.THREE_K3.reflective_frame));

  // DEC-206 — audit كامل مطابق لنظيره البايثوني (a في k3_report)
  const audit = {
    pack_sha: {
      SECTIONS_K3: _shaObj(PACKS.SECTIONS_K3), THREE_K3: _shaObj(PACKS.THREE_K3),
      CIRCLE_K3: _shaObj({ shared: PACKS.CIRCLE_K3.shared, tail: PACKS.CIRCLE_K3.tail }),
    },
    report_sha256: PK._sha256(L.join("\n")).slice(0, 16),
    sp: res.sp, codes: res.codes, bands: res.bands,
    cells_activated: res.cells_activated, cost_map: res.cost_map,
    patterns_recognized: res.patterns_recognized,
    containment_state: res.containment_state, root_question: res.root_question,

  full.forEach((l, i) => { if (l.startsWith("### ")) lastSkill = i; });

  for (let i = lastSkill + 1; i < full.length; i++) {
    if (full[i].startsWith("## ") || bridges.has(full[i].trim())) { stop = i; break; }

function buildReportK4(sp, pack) {
  pack = k4RequirePack(pack);

  const L = [];
  let n = 0;
  const head = (key) => { n += 1; L.push(`## ${AR_NUM[n - 1]} · ${pack.heading[key]}`); L.push(""); };
  const NAME = K4.USER_NAME;

  // ① لوحة المحطات

  L.push(pack.notice.order, "");
  for (const v of K4.VALVES) {
    const b = a.bands[v];
    L.push(`### ${NAME[v]} — ${k4BandLabel(pack, b)}`, "", pack.valve[v].U01, "");
    if (b === "core" || b === "high") L.push(pack.valve[v].U03, "");

  // ② مواضع الانقطاع — مُثرىً بالسطح المركَّب (`138 §3/②`)

  const C = pack.composed;
  if (pts.length) {
    head("interruption");
    if (pts.length > 1) L.push(C.interruption_multi, "");
    for (const v of pts) L.push(`**${NAME[v]}** — ` + pack.valve[v].U05, "");

  // ③ المحطة الأدنى — ر-4
  const bn = a.bottleneck;
  if (bn.valves.length) {
    head("bottleneck");
    if (bn.tie) L.push("> " + pack.notice.tie, "");
    const names = bn.valves.map((v) => NAME[v]).join("، ");
    L.push(`**${names}** — ${k4BandLabel(pack, bn.band)}`, "");
    L.push(C.bottleneck_meaning, "");
    if (bn.tie) L.push(C.bottleneck_tie, "");

      L.push(pack.notice.choke_plain, "");

  }

  // ④ الشبكة والأنماط — مُثرىً بالسطح المركَّب (`138 §3/②-③`)
  if (a.constraint_map.length || a.patterns_recognized.length) {
    head("network");
    if (a.constraint_map.length) {
      L.push(C.network_lead, "");
      for (const c of a.constraint_map) {
        const arrow = c.mutual ? "×" : "←";
        L.push(`- **${c.kind}** · ${NAME[c.a]} ${arrow} ${NAME[c.b]}`);
        L.push("  " + fillPair(C.kind[c.kind], NAME[c.a], NAME[c.b]));

      L.push("", C.network_limit, "");

    head("reserve");
    L.push(pack.reserve.opening, "");
    for (const code of a.reading_reserve) {
      const v = inv[code];
      L.push(`- **${NAME[v]}** — ` + pack.reserve[v]);
    }
    L.push("");
  }

  // ⑥ أسئلة الفرز
  if (a.lookalike_flags.length) {
    head("lookalike");
    L.push(pack.notice.lookalike_lead, "");
    for (const code of a.lookalike_flags) L.push("- " + pack.lookalike[code]);
    L.push("");
  }

  // ⑦ التدريبات
  if (pts.length) {
    head("training");
    L.push(pack.notice.training_lead, "");
    for (const v of pts) {
      const t = pack.training[v];
      if (t === undefined) L.push(`- **${NAME[v]}** — ` + pack.training_void[v]);
      else L.push(`- **${NAME[v]}** — ` + t);
    }
    L.push("");
  }

  // ⑧ بصمة القراءة — تصيير مطابق لـ json.dumps(sort_keys=True, indent=1)
  head("audit");
  L.push("```", jsonPy(a, 1), "```");

  // كتلة التدقيق تُكمَل **بعد** تصيير المتن — فلا يدخل ما يوصفها في ما تصفه.
  // و`pack_sha`/`report_sha256` **حقلان ملزمان** في `136 §3/④`: كانا حاضرين
  // في بايثون وغائبين هنا، والقياس القائم لم يكشفهما لأنه يقارن كتلة
  // **المحرك** ونصّ التقرير — لا كتلة تدقيق التقرير (رُصد ببناء `DEC-271`).
  const audit = Object.assign({}, a, { sections_rendered: n });
  audit.pack_sha = { CONTENT_K4: _shaObj(pack) };
  const body = L.join("\n");
  SPG.outputGate(body, "تقرير K4");
  audit.report_sha256 = PK._sha256(body).slice(0, 16);
  return [body, audit];
}

// سطح القراءة العابرة — **مخرج مستقل** (`138 §2`)
// مشغِّله نطاقات K4 وحدها — لا يدخله رقم ولا نطاق من دائرة أخرى.
const CROSSING_TRIGGERS = [
  ["K4-XR-02", ["TI"]],
  ["K4-XR-05", ["TI"]],
  ["K4-XR-06", ["TI"]],
  ["K4-XR-04", ["PER"]],
  ["K4-XR-08", ["OR", "TM", "PF"]],
];

function crossingEntries(sp) {
  const out = [];
  for (const [code, valves] of CROSSING_TRIGGERS) {
    if (valves.some((v) => K4.band(sp[v]) === "limited")) out.push(code);
  }
  return out.length ? ["K4-XR-03"].concat(out) : [];
}

/** يُصدَر **مستقلاً** — ولا يُستدعى من `buildReportK4` أبداً. */
function buildCrossingSurface(sp, pack) {
  pack = k4RequirePack(pack);
  const codes = crossingEntries(sp);
  if (!codes.length) return ["", { surface: "crossing", entries: [], rendered: false }];
  const cr = pack.crossing;
  const L = [`# ${cr.heading}`, "", cr.lead, ""];
  for (const code of codes) L.push("- " + cr.entry[code]);
  L.push("", cr.closing);
  const body = L.join("\n");
  SPG.outputGate(body, "سطح القراءة العابرة K4");
  const audit = { surface: "crossing", entries: codes, rendered: true,
                  spec_version: "138-K4-SURFACES v1.0" };
  // `PK._sha256` سها-256 حقيقي مُصدَّر من `packs.js` — يعمل في البيئتين،
  // وقيمته مطابقة لـ`crypto` حرفياً (مفحوص). فلا مسار خاص بالعقدة.
  audit.surface_sha256 = PK._sha256(body).slice(0, 16);
  return [body, audit];
}

/** تصيير JSON بترتيب مفاتيح وبمسافة بادئة — نظير `json.dumps(..., sort_keys=True, indent=N)`. */
function jsonPy(v, indent, level) {
  level = level || 0;
  const pad = " ".repeat(indent * (level + 1));
  const padEnd = " ".repeat(indent * level);
  if (v === null || v === undefined) return "null";
  if (typeof v === "boolean") return v ? "true" : "false";
  if (typeof v === "number") return Number.isInteger(v) ? `${v}.0` : String(v);
  if (typeof v === "string") return JSON.stringify(v);
  if (Array.isArray(v)) {
    if (!v.length) return "[]";
    return "[\n" + v.map((x) => pad + jsonPy(x, indent, level + 1)).join(",\n") + "\n" + padEnd + "]";
  }
  const keys = Object.keys(v).sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
  if (!keys.length) return "{}";
  return "{\n" + keys.map((k) => pad + JSON.stringify(k) + ": " + jsonPy(v[k], indent, level + 1)).join(",\n")
         + "\n" + padEnd + "}";
}

"use strict";
/**
 * bridge.js — جسر الأداة ← المحرّكين (المرحلة ④-ب)
 * =================================================
 * يحوّل `answers` من الاستبيان إلى `sp` بالصيغة التي يقبلها المحرّكان.
 *
 * 🔒 لا يُعيد حساباً ولا يُعرّف مصفوفة: مصفوفات البنود تُقرأ من
 *    `K2_MAP`/`K3_MAP` القائمتين في الأداة — وقد فُحصتا مقابل
 *    `41-Raw_Measure v4.2 §5.2/§5.3` فطابقتا 1:1.

 * جدار العزل (§6): تقارير منفصلة لا تتقاطع. لا دالة هنا تُمرّر قيمة من
 * دائرة إلى أخرى (DEC-205) — وخانات الدوائر الثلاث متباينة تماماً:
 * 56 (K2) + 55 (K3) + 77 (K4) = 188 = كل خانات الأداة (مفحوص في build_site).
 */
(function (root) {

  // §5.3 — ربط اسم المهارة العربي في الأداة بكود المحرك
  const K3_NAME_TO_CODE = {
    "قوة الملاحظة": "EP",       // K3-EP · قوة الملاحظة الانفعالية
    "التحكم الانفعالي": "IR",   // K3-IR · التحكم الانفعالي الداخلي
    "كبح جماح النفس": "BI",     // K3-BI · كبح جماح النفس الميكانيكي
    "المرونة": "CF",            // K3-CF · المرونة الانفعالية والتكيف
    "تحمل الضغوط": "ST",        // K3-ST · تحمل الضغوط والإنقاذ العصبي
  };

  class BridgeContractError extends Error {
    constructor(m) { super(m); this.name = "BridgeContractError"; }
  }

  /** SS = x − 2z + y — نفس معادلة `calcVessel` (41 §3). */
  function vessel(answers, items) {
    let x = 0, y = 0;
    for (const [item, letter] of items) {
      const a = answers[item];
      if (!a) throw new BridgeContractError(`البند ${item} متروك — عقد المدخل يمنع الإكمال (41 §7)`);
      x += (letter === "a") ? a.ratingA : a.ratingB;
      if (a.choice === letter) y += 1;
    }
    const z = items.length - y;
    return { x, y, z, ss: x - 2 * z + y, n: items.length };
  }

  /** sp لـK2 — ثمانية أبعاد · MAX_RAW = 42. */
  function spK2(answers, K2_MAP, K2_ORDER) {
    const sp = {};
    for (const k of K2_ORDER) {
      const v = vessel(answers, K2_MAP[k].items);
      if (v.n !== 7) throw new BridgeContractError(`K2/${k}: ${v.n} بنداً بدل 7`);
      sp[k] = v.ss / 42 * 100.0;
    }
    return sp;
  }

  /** sp لـK3 — خمس مهارات · MAX_RAW = 66. */
  function spK3(answers, K3_MAP) {
    const sp = {};
    for (const [name, items] of Object.entries(K3_MAP)) {
      const code = K3_NAME_TO_CODE[name];
      if (!code) throw new BridgeContractError(`مهارة K3 غير معرَّفة: «${name}»`);
      const v = vessel(answers, items);
      if (v.n !== 11) throw new BridgeContractError(`K3/${code}: ${v.n} بنداً بدل 11`);
      sp[code] = v.ss / 66 * 100.0;
    }
    const missing = ["EP", "IR", "BI", "CF", "ST"].filter((s) => !(s in sp));
    if (missing.length) throw new BridgeContractError(`مهارات K3 ناقصة: ${missing}`);
    return sp;
  }

  /** sp لـK4 — سبعة صمامات · MAX_RAW = 66 (`DEC-270`).
   *  الخريطة تُمرَّر من المحرك (`K4.ITEM_MAP`) — مصدرُ حقيقةٍ واحد،
   *  ومطابقتُها للجدول المختوم (`41 §5.4`) مفحوصة في `build_site`. */
  function spK4(answers, K4_MAP) {
    const sp = {};
    const order = ["WM", "TI", "F", "PF", "OR", "TM", "PER"];
    for (const code of order) {
      const items = K4_MAP[code];
      if (!items) throw new BridgeContractError(`صمام K4 غير معرَّف: «${code}»`);
      const v = vessel(answers, items);
      if (v.n !== 11) throw new BridgeContractError(`K4/${code}: ${v.n} بنداً بدل 11`);
      sp[code] = v.ss / 66 * 100.0;
    }
    return sp;
  }

  function missingItems(answers, maps) {
    const need = new Set();
    for (const m of maps) for (const [it] of m) need.add(it);
    return Array.from(need).filter((it) => !answers[it]).sort((a, b) => a - b);
  }

  root.RawahilBridge = {
    K3_NAME_TO_CODE, vessel, spK2, spK3, spK4, missingItems, BridgeContractError,

  function mdToNodes(md, keyBase) {
    const out = [];

    let tbl = null, li = null;
    const flushLi = () => {
      if (!li) return;
      out.push(React.createElement("ul", { key: `${keyBase}-u${out.length}`, className: "rw-ul" }, li));
      li = null;
    };
    const flushTbl = () => {
      if (!tbl) return;
      const [head, ...rows] = tbl;
      out.push(React.createElement("table", { key: `${keyBase}-t${out.length}`, className: "rw-tbl" },
        React.createElement("thead", null,
          React.createElement("tr", null, head.map((c, i) =>
            React.createElement("th", { key: i }, inline(c))))),
        React.createElement("tbody", null, rows.map((r, ri) =>
          React.createElement("tr", { key: ri }, r.map((c, ci) =>
            React.createElement("td", { key: ci }, inline(c))))))));
      tbl = null;

      const parts = String(t).split(/(\*\*[^*]+\*\*)/g);

        ? React.createElement("b", { key: i }, p.slice(2, -2))

        if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue;
        flushLi(); (tbl = tbl || []).push(cells);

      flushTbl();
      if (!l.trim()) { flushLi(); continue; }
      if (l.startsWith("### ")) out.push(React.createElement("h4", { key: i, className: "rw-h4" }, inline(l.slice(4))));
      else if (l.startsWith("## ")) out.push(React.createElement("h3", { key: i, className: "rw-h3" }, inline(l.slice(3))));
      else if (l.startsWith("> ")) out.push(React.createElement("blockquote", { key: i, className: "rw-q" }, inline(l.slice(2))));
      else if (l.startsWith("- ")) { (li = li || []).push(React.createElement("li", { key: i, className: "rw-li" }, inline(l.slice(2)))); continue; }

      result.k4 = { text: txt, audit, sp: sp4 };
      // سطح القراءة العابرة — **مخرج مستقل** لا يُدمج في تقرير أي دائرة
      // (`133 §3/①` · `138 §2`). يُصدَر فارغاً إن لم يتحقق مشغِّل.
      const [xtxt, xaudit] = RP.buildCrossingSurface(sp4);
      result.crossing = xtxt ? { text: xtxt, audit: xaudit } : null;
    } catch (e) { result.errors.push("K4: " + e.message); }
    return result;
  }

  // ── التصدير — مستقلّ لكل تبويب ────────────────────────────────────
  function download(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function exportMd(doc, circle, name, scope) {
    const CIRCLE_AR = { k2: "التفكير", k3: "الانفعال", k4: "الإنجاز", x: "قراءة عابرة" };
    const hdr = `# تقرير ${CIRCLE_AR[circle] || circle}` +
                (name ? ` — ${name}` : "") + (scope ? ` (${scope})` : "") + "\n\n";
    download(SPG.outputGate("\uFEFF" + hdr + doc.text, `تصدير MD · ${circle}`),
      `تقرير-${{ k2: "التفكير-K2", k3: "الانفعال-K3", k4: "الإنجاز-K4",
                  x: "قراءة-عابرة-K4" }[circle] || circle}${scope ? "-" + scope : ""}.md`,
      "text/markdown;charset=utf-8");
  }

  function exportPrint(doc, circle, name) {
    const w = window.open("", "_blank");
    if (!w) return;
    const title = `تقرير ${circle === "k2" ? "التفكير" : "الانفعال"}${name ? " — " + name : ""}`;
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    w.document.write(SPG.outputGate(
      `<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>${esc(title)}</title>` +
      `<style>body{font-family:system-ui,'Segoe UI',Tahoma,sans-serif;line-height:1.9;padding:28px;max-width:820px;margin:auto;color:#1a1a1a}` +
      `h1{font-size:20px}h2{font-size:17px;border-bottom:1px solid #ddd;padding-bottom:5px;margin-top:26px}` +
      `h3{font-size:15px;margin-top:18px}blockquote{border-right:3px solid #999;margin:0;padding:2px 12px;color:#444}` +
      `table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:5px 8px;font-size:13px}` +
      `@page{margin:16mm}</style></head><body>` +
      `<h1>${esc(title)}</h1>` + mdToHtml(doc.text) +
      `<\/body><\/html>`, `تصدير طباعة · ${circle}`));
    w.document.close();
    setTimeout(() => { try { w.print(); } catch (e) {} }, 350);
  }

  function mdToHtml(md) {
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const inl = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    const out = [];
    let tbl = null, inList = false;
    const flushT = () => {
      if (!tbl) return;
      const [h, ...r] = tbl;
      out.push("<table><thead><tr>" + h.map((c) => `<th>${inl(c)}</th>`).join("") +
        "</tr></thead><tbody>" + r.map((row) =>
          "<tr>" + row.map((c) => `<td>${inl(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table>");
      tbl = null;
    };
    const flushL = () => { if (inList) { out.push("</ul>"); inList = false; } };
    for (const l of md.split("\n")) {
      if (/^\|.*\|$/.test(l.trim())) {
        const cells = l.trim().slice(1, -1).split("|").map((c) => c.trim());
        if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue;
        flushL(); (tbl = tbl || []).push(cells); continue;
      }
      flushT();
      if (!l.trim()) { flushL(); continue; }
      if (l.startsWith("### ")) { flushL(); out.push(`<h3>${inl(l.slice(4))}</h3>`); }
      else if (l.startsWith("## ")) { flushL(); out.push(`<h2>${inl(l.slice(3))}</h2>`); }
      else if (l.startsWith("> ")) { flushL(); out.push(`<blockquote>${inl(l.slice(2))}</blockquote>`); }
      else if (l.startsWith("- ")) { if (!inList) { out.push("<ul>"); inList = true; } out.push(`<li>${inl(l.slice(2))}</li>`); }
      else { flushL(); out.push(`<p>${inl(l)}</p>`); }
    }
    flushT(); flushL();
    return out.join("\n");
  }

  /** JSON مقسَّم حقلين: التسليم للمستفيد · المراجعة لأداة المشرف لاحقاً. */
  function exportJson(doc, circle, name) {
    // DEC-231 — النطاقات مُعلَنة لا مستنتَجة من غياب حقل.
    // `null` صامت لا يُميّز «لا نطاق مختصر لهذه الدائرة» من «مفقود/تالف» —
    // وهو ما يحظره `ن-7`. فالحقول الاختيارية تُحذف، ويُعلَن ما هو متاح.
    const scopes = doc.brief ? ["full", "brief"] : ["full"];
    const payload = {
      schema: "RAWAHIL-REPORT-v1.2",
      circle: circle.toUpperCase(),
      generated_at: new Date().toISOString(),
      scopes,                                               // DEC-231
      delivery: { markdown: doc.text },
      audit: doc.audit,
    };
    if (name) payload.subject = name;
    if (doc.brief) {                                        // DEC-225/و
      payload.delivery.markdown_brief = doc.brief;
      payload.audit_brief = doc.briefAudit;
    }
    download(SPG.outputGate(JSON.stringify(payload, null, 1), `تصدير JSON · ${circle}`),
      `${circle}-تقرير-كامل.json`, "application/json;charset=utf-8");
  }

  // ── لوحة K1 الداخلية — `DEC-186` قائم عليها وحدها بعد رفعه عن K4 (`DEC-266`)
  function InternalPanel({ report }) {
    const [open, setOpen] = useState(false);
    return React.createElement("div", { className: "rw-panel" },
      React.createElement("button", { className: "rw-toggle", onClick: () => setOpen(!open) },
        (open ? "▾ " : "▸ ") + "لوحة تشخيصية داخلية — K1"),
      open && React.createElement("div", { className: "rw-panelbody" },
        React.createElement("blockquote", { className: "rw-warn" },
          "⚠️ [خارج نطاق التقرير — لا محرك معتمد]. أرقام خام للمراجعة الداخلية فقط، " +
          "لا تُقرأ كتوصيف ولا تُصدَّر إلى المستفيد."),
        React.createElement("h4", { className: "rw-h4" }, "K1 — عدّ الاختيارات"),
        React.createElement("ul", null, (report.k1 || []).map((r, i) =>
          React.createElement("li", { key: i }, `${r.name}: ${r.count}/${r.max}`))),
        React.createElement("p", { className: "rw-hint" },
          "دائرة الإنجاز (K4) خرجت من هذه اللوحة إلى تقرير معتمد — DEC-266.")));
  }

  // ── التبويبان ──────────────────────────────────────────────────────
  function DualReportView({ answers, report, name, K2_MAP, K2_ORDER, K3_MAP, K4_MAP, onRestart }) {
    const [tab, setTab] = useState("k2");
    const [brief, setBrief] = useState(false);   // DEC-225/و
    const [xopen, setXopen] = useState(false);   // سطح القراءة العابرة — مستقل
    const [gen] = useState(() => generate(answers, K2_MAP, K2_ORDER, K3_MAP, K4_MAP));

    if (gen.errors.length && !gen.k2 && !gen.k3 && !gen.k4) {
      return React.createElement("div", { className: "rw-wrap" },
        React.createElement("h2", null, "تعذّر توليد التقرير"),
        React.createElement("ul", null, gen.errors.map((e, i) =>
          React.createElement("li", { key: i }, e))),
        React.createElement("button", { className: "rw-btn", onClick: onRestart }, "العودة"));
    }

    const doc = tab === "k2" ? gen.k2 : tab === "k3" ? gen.k3 : gen.k4;
    const label = tab === "k2" ? "التفكير" : tab === "k3" ? "الانفعال" : "الإنجاز";

    return React.createElement("div", { className: "rw-wrap", dir: "rtl" },
      // شريط التبويبين — لا محتوى مشترك بينهما
      React.createElement("div", { className: "rw-tabs" },
        React.createElement("button", {
          className: "rw-tab" + (tab === "k2" ? " on" : ""), onClick: () => setTab("k2"),
        }, "تقرير التفكير (K2)"),
        React.createElement("button", {
          className: "rw-tab" + (tab === "k3" ? " on" : ""), onClick: () => setTab("k3"),
        }, "تقرير الانفعال (K3)"),
        React.createElement("button", {
          className: "rw-tab" + (tab === "k4" ? " on" : ""), onClick: () => setTab("k4"),
        }, "تقرير الإنجاز (K4)")),

      React.createElement("blockquote", { className: "rw-note" },
        "التقارير الثلاثة مستندات منفصلة يُقرأ كلٌّ منها وحده. لا يُقابَل بند من أحدها ببند من الآخر."),

      gen.errors.length ? React.createElement("blockquote", { className: "rw-warn" },
        "⚠️ " + gen.errors.join(" · ")) : null,

      // DEC-225/و — مبدّل نطاق العرض (K2 وحده؛ النطاقان لا يمسّان K3)
      tab === "k2" && doc && doc.brief ? React.createElement("div", { className: "rw-scope" },
        React.createElement("button", {
          className: "rw-toggle", onClick: () => setBrief(!brief),
        }, brief ? "▸ عرض مختصر — اضغط للكامل" : "▾ عرض كامل — اضغط للمختصر"),
        React.createElement("span", { className: "rw-hint" },
          brief ? " (المركز كتالوجاً كاملاً · R2/R3)" : " (كل العدسات · R2 مستوفى 94/94)")) : null,

      doc
        ? React.createElement("div", { className: "rw-doc", key: tab + (brief ? "-b" : "") },
            mdToNodes((tab === "k2" && brief && doc.brief) ? doc.brief : doc.text, tab))
        : React.createElement("p", { className: "rw-p" }, `تقرير ${label} غير متاح.`),

      // تصدير مستقلّ لكل تبويب
      doc && React.createElement("div", { className: "rw-actions" },
        React.createElement("div", { className: "rw-actlabel" }, `تصدير تقرير ${label} وحده:`),
        React.createElement("button", { className: "rw-btn", onClick: () => exportMd(doc, tab, name) }, "⬇ Markdown كامل"),
        tab === "k2" && doc.brief ? React.createElement("button", {
          className: "rw-btn ghost",
          onClick: () => exportMd({ text: doc.brief, audit: doc.briefAudit }, tab, name, "مختصر"),
        }, "⬇ Markdown مختصر") : null,
        React.createElement("button", { className: "rw-btn ghost", onClick: () => exportJson(doc, tab, name) }, "⬇ JSON"),
        React.createElement("button", { className: "rw-btn ghost", onClick: () => exportPrint(doc, tab, name) }, "🖨 طباعة / PDF")),

      // سطح القراءة العابرة — **مخرج مستقل**: كتلة خارج متن أي تقرير،
      // ولا تظهر إلا إن تحقق مشغِّلها من نطاقات K4 وحدها (`138 §2/①`).
      gen.crossing && React.createElement("div", { className: "rw-panel" },
        React.createElement("button", {
          className: "rw-toggle", onClick: () => setXopen(!xopen),
        }, (xopen ? "▾ " : "▸ ") + "قراءة عابرة — سطح مستقل"),
        xopen && React.createElement("div", { className: "rw-panelbody" },
          React.createElement("blockquote", { className: "rw-note" },
            "سطحٌ مستقل لا يُدمج في متن أي تقرير، ولا يحمل درجةً من دائرة أخرى."),
          React.createElement("div", { className: "rw-doc" },
            mdToNodes(gen.crossing.text, "x")),
          React.createElement("div", { className: "rw-actions" },
            React.createElement("button", {
              className: "rw-btn ghost",
              onClick: () => exportMd(gen.crossing, "x", name),
            }, "⬇ Markdown — السطح العابر")))),

      report && React.createElement(InternalPanel, { report }),

      React.createElement("div", { className: "rw-actions" },
        React.createElement("button", { className: "rw-btn ghost", onClick: onRestart }, "↺ إعادة")));
  }

  root.RawahilDualReport = { DualReportView, generate, mdToHtml, exportMd, exportJson, exportPrint };

})(typeof window !== "undefined" ? window : globalThis);


</script>
