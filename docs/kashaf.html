 فيه قد يملّك؛ أما الخلل الغامض فيوقظ تركيزك كله.\"},\"U-04\":{\"example\":\"حين يقول لك أحدهم \\\"خذ هذا القرار لأن إحساسي يقول كذا\\\"، قد تشعر بمقاومة داخلية فورية — ليس رفضاً للشخص، بل لأن \\\"الإحساس\\\" وحده لا يعطيك شيئاً تفحصه.\",\"lock\":\"لا تقرأ هذا كحكم بأن أصحاب الحدس مخطئون أو أنك على صواب دائماً — إنه وصف لما يريح عدستك وما يرهقها، والعدسات الأخرى لها منطقها المشروع.\",\"title\":\"مثلث الإزعاج\",\"user\":\"ثلاثة أشياء تستنزفك أكثر من غيرها: كلام يناقض نفسه، وقرارات تُبرَّر بالمشاعر بدل الأسباب، ومعلومات ضبابية لا يُعرف مصدرها. انزعاجك منها ليس مزاجاً صعباً — إنها فعلياً تعطّل الطريقة التي يفهم بها عقلك العالم.\"},\"U-05\":{\"example\":\"زميل يعرض عملاً وهو متوتر؛ تلتقط أنت خطأً في الشريحة الثالثة وتذكره فوراً وبدقة. ملاحظتك صحيحة تماماً — لكن قد لا تلاحظ أن توقيتها أمام الجميع كان أثقل عليه من الخطأ نفسه.\",\"lock\":\"هذا لا يعني أنك \\\"قاسٍ\\\" أو \\\"لا تفهم الناس\\\" — قراءة بواطن الناس عدسة أخرى مستقلة في النموذج (بُعد المتفهم)، ودرجتك هنا لا تقول شيئاً عنها.\",\"title\":\"قراءة الآخرين (الحجة لا الباطن)\",\"user\":\"حين تستمع لشخص، فإن أول ما تلتقطه أذنك غالباً هو **بنية كلامه**: هل هو متسق؟ أين الثغرة؟ قد يفوتك في المقابل ما وراء الكلام — توتره، حاجته لأن يُسمَع، أو حساسية موقعه أمام الحاضرين. ليس لأنك لا تهتم، بل لأن عدستك تلتقط الحجة قبل صاحبها.\"},\"U-06\":{\"example\":\"في مشروع عائلي أو مهني، أنت غالباً من يسأل \\\"هل حسبنا التكلفة الكاملة؟ ماذا لو تأخر المورد؟\\\" قبل التوقيع — أسئلة قد تبدو مزعجة لحظتها وتُشكر بعد شهور.\",\"lock\":\"كونك فاحص الفكرة لا يعني أنك منفّذها الأفضل — الفحص الذهني شيء، والتنفيذ الميداني شيء آخر يقيسه نظام مستقل تماماً في النموذج (دائرة الإنجاز).\",\"title\":\"الموقع في الفريق (فاحص الجودة المسبق)\",\"user\":\"مكانك الطبيعي في أي عمل جماعي هو **قبل** اتخاذ القرار، لا بعده: أنت الشخص الذي يختبر متانة الفكرة قبل أن تُصرف عليها ميزانية أو يُبنى عليها جدول. حين يُستشار رأيك مبكراً توفّر على الجميع كلفة اكتشاف الخلل متأخراً.\"},\"U-07\":{\"example\":\"شراء جهاز جديد قد يستغرق منك أسابيع من المقارنات والمراجعات، وحين تحسم أخيراً يكون الطراز الأحدث قد صدر — فتبدأ دورة مقارنة جديدة.\",\"lock\":\"هذا **ليس عيباً في شخصيتك ولا حكماً نهائياً عليك** — إنه ثمن معروف لعدسة عالية الدقة، ويُدار عادةً بشراكة مع من يجيدون الإغلاق والحسم، لا بمحاولة \\\"إصلاح\\\" طبيعتك.\",\"title\":\"نقطة العمى الأولى (التمدد في الفحص)\",\"user\":\"الوجه الآخر لدقتك أن الفحص قد لا يعرف متى يتوقف: كلما اقتربت من الحسم ظهرت زاوية جديدة تستحق التدقيق، فيتأجل القرار. أنت لا تتهرب — أنت فقط لم تصل بعد إلى \\\"برهان مكتمل\\\"، والحياة نادراً ما تقدّم براهين مكتملة.\"},\"U-08\":{\"example\":\"ترسل ملاحظات دقيقة ومفيدة على عمل صديق في منتصف يوم عصيب عليه؛ الملاحظات ممتازة، والتوقيت — الذي لم يخطر ببالك أصلاً — هو ما آلمه.\",\"lock\":\"لا يُستنتج من هذا أي شيء عن مشاعرك أنت أو قدرتك على الاهتمام بالآخرين — الانفعال وشدته ملف منفصل كلياً (دائرة الانفعال)، وقراءة بواطن الناس ملف ثالث (بُعد المتفهم). هذه العدسة تصف الفلترة فقط.\",\"title\":\"نقطة العمى الثانية (غياب الإشارة الوجدانية عن الخريطة)\",\"user\":\"حين يُقال لك \\\"لم تراعِ مشاعر فلان\\\"، غالباً لم يكن الأمر تجاهلاً منك — الإشارة العاطفية ببساطة لم تدخل في حساباتك أصلاً، لأن فلترك التلقائي يلتقط الحجج لا الأجواء. الفرق مهم: أنت لم \\\"تختر\\\" الإهمال؛ الخريطة التي عملت عليها لم تحتوِ تلك الطبقة.\"},\"U-09\":{\"example\":\"بعد يوم مليء بالاجتماعات قد تحتاج ساعة صمت وحدك — ليس انطواءً حزيناً، بل إعادة شحن؛ وفيها غالباً تحلّ المشكلة التي عجز عنها الاجتماع كله.\",\"lock\":\"تفضيل العزلة للتفكير لا يعني ضعفاً اجتماعياً ولا يقيس علاقاتك — إنه وصف لمصدر شحن العدسة، لا أكثر.\",\"title\":\"اقتصاد الطاقة واللغة\",\"user\":\"أفكارك الأفضل تأتي غالباً في الهدوء، لا في وسط النقاش. الاجتماعات الطويلة المفتوحة والدردشة غير الموجهة تستهلكك أسرع من العمل نفسه، وتفضّل الكلام القليل الدقيق على الشرح المطوّل. حين تطلب \\\"أعطني الخلاصة\\\" فأنت لا تستعجل أحداً — أنت تحمي طاقتك الذهنية.\"},\"U-10\":{\"example\":\"في أسبوع تتراكم فيه المطالب من كل اتجاه، قد تجد نفسك عاجزاً عن الرد حتى على رسالة بسيطة، ثم تنفجر بنقاش منطقي حاد في نقطة صغيرة لا تستحق — ثم تعود لطبيعتك حين يخف الحمل.\",\"lock\":\"لا يُبنى على هذه الحالة أي وصف دائم لك، ولا تُقرأ شدة الانفعال المصاحبة من هذه العدسة — الشدة ملف دائرة الانفعال المستقل.\",\"title\":\"حالة الضغط القصوى (الارتداد العابر)\",\"user\":\"تحت ضغط شديد جداً، قد تمر بحالة مؤقتة معروفة لهذا النمط: تتجمد عن الحسم تماماً، ثم تنسحب وتغلق الباب، وإن استمر الضغط قد يتحول منطقك الدقيق إلى سلاح جدل حاد. المهم أن تعرف: **هذه حالة طوارئ عابرة مرتبطة بالضغط، وليست شخصيتك** — تنقضي بانقضاء سببها.\"},\"U-11\":{\"example\":\"سؤالك \\\"البسيط\\\" في بداية مشروع — \\\"على أي افتراض بنينا هذا الرقم؟\\\" — قد يكون هو الفرق بين تعديل ورقة اليوم وخسارة أشهر لاحقاً.\",\"lock\":\"كون هذا إسهامك المميز لا يجعله الإسهام \\\"الأعلى\\\" — كل عدسة في النموذج تضيف ما لا يعوضه غيرها، ولا ترتيب تفاضلي بين البصمات.\",\"title\":\"البصمة (ما تضيفه ولا يعوَّض)\",\"user\":\"إسهامك الذي لا يعوضه أحد: أنت جهاز الإنذار المبكر ضد الأفكار المتناقضة. المجموعة التي تضمّك تكتشف الخلل وهو رخيص؛ والتي تفتقدك تكتشفه بعد أن صار غالياً. وضوحك ليس رفاهية — إنه صمام أمان الجميع.\"}},\"C\":{\"U-01\":{\"example\":\"حين يتحمس الجميع لتطبيق استثماري جديد \\\"الكل يستخدمه\\\"، تكون أنت من سأل: \\\"منذ متى يعمل؟ ماذا حدث لمستخدميه في أول أزمة؟ وما الضمانة؟\\\" — أسئلة قد تبرد الحماس لحظتها، وتحفظ المال لاحقاً.\",\"lock\":\"هذا وصف لطريقة **فحصك الذهني** للأمور — لا لمدى طاعتك للتعليمات ولا التزامك السلوكي. الانضباط في التنفيذ ملف آخر تماماً في النموذج لا تقيسه هذه العدسة.\",\"title\":\"دورة المعالجة (بوابة الأمان)\",\"user\":\"عقلك يستقبل أي جديد بسؤال تلقائي واحد: \\\"هل جُرّب هذا من قبل؟ وماذا حدث؟\\\". لا يرتاح للفكرة لأنها لامعة أو مقنعة، بل حين يجد لها سابقة صمدت أو ضمانة تحمي مما قد يسوء. أنت لا \\\"تعرقل\\\" — أنت تُجري فحص الأمان الذي يتجاوزه الآخرون بحماسهم.\"},\"U-02\":{\"example\":\"رفضت لسنوات الدفع الإلكتروني، ثم حين اعتمدته جهة موثوقة تعرفها وجرّبه أخوك عاماً كاملاً بلا مشكلة — تبنّيته بهدوء تام. لم تتغير أنت؛ اكتمل دليل الأمان.\",\"lock\":\"لا يُقرأ من هذا أنك \\\"ضد التطور\\\" — طلب الدليل قبل التبني عدسة فحص، لا موقفاً من المستقبل.\",\"title\":\"قاعدة الحجب (دليل الأمان لا عداء الجديد)\",\"user\":\"حين ترفض فكرة جديدة، فأنت في الحقيقة لا ترفض **جِدّتها** — أنت ترفض **غياب دليل أمانها**. والدليل أن موقفك يتغير فور ظهور تجربة ناجحة موثوقة: لست ضد الجديد، أنت ضد المجهول غير المختبَر. هذا فرق جوهري يظلمك من لا يراه.\"},\"U-03\":{\"example\":\"في اجتماع عائلي متحمس لبيع أرض قديمة واستثمار ثمنها في مشروع مغرٍ، كنت الصوت الوحيد الذي قال \\\"لا نبيع الأصل\\\" — وواجهت الامتعاض وقتها، والشكر بعد سنتين.\",\"lock\":\"ممارسة الاعتراض لا تعني أنك \\\"سلبي\\\" أو \\\"معطّل\\\" بطبعك — إنها وظيفة عدستك حين يثبت التهديد، وتُقرأ بنتائجها لا بشعبيتها اللحظية.\",\"title\":\"سلطة الاعتراض (وظيفة الجهاز المناعي)\",\"user\":\"أنت من يقول \\\"قفوا\\\" حين يندفع الجميع نحو خطر لا يرونه — وقول \\\"قفوا\\\" في وجه حماس جماعي يحتاج صلابة لا يملكها كثيرون. اعتراضك ليس حباً في المعارضة؛ إنه آخر خط دفاع قبل أن يلمس الخطر ما لا يُعوَّض.\"},\"U-04\":{\"example\":\"لا تمانع تغيير أثاث البيت كله دون تعليق — لكن حين اقترح أحدهم \\\"تعديلاً بسيطاً\\\" في طريقة حفظ أوراق العائلة المهمة، وقفت له بكل انتباهك.\",\"lock\":\"هذا وصف لما يستنفر معالجتك المعرفية، لا تفسير لدوافعك العميقة — تلك لها مفتاح مستقل (مفتاح الاتساق والأمان) يُقرأ في قسمه.\",\"title\":\"المحرك (صيانة الأمان لا حب القديم)\",\"user\":\"ما يحركك ليس \\\"حب القديم\\\" كما قد يظن البعض — بل حماية ما يستحق الحماية. القديم المستقر الذي لا يهدده شيء قد لا يشغل بالك أصلاً؛ أما حين يقترب خطر من شيء ثمين (مدّخرات، سمعة، علاقة، نظام يعمل) فتستيقظ كل حواسك.\"},\"U-05\":{\"example\":\"حين يقول مديرك صباحاً \\\"غيّرنا كل خطة هذا الشهر، نبدأ اليوم بنظام جديد\\\" — ما يقلقك ليس الجهد الإضافي، بل سؤال لم يجب عنه أحد: \\\"وما الذي يضمن ألا ينهار الجديد كما أُلغي القديم بجرة قلم؟\\\".\",\"lock\":\"لا يُقرأ من انزعاجك هذا شيء عن مستوى قلقك أو توترك الداخلي — شدة الانفعال ملف مستقل تماماً (دائرة الانفعال) لا تقيسه هذه العدسة.\",\"title\":\"ثنائي الإزعاج (تهديد إدراكي لا مزاج)\",\"user\":\"شيئان يستنزفانك أكثر من غيرهما: التغيير المفاجئ الذي يهبط بلا مقدمات ولا حساب، وتجاوز القواعد المتفق عليها وكأنها زينة. انزعاجك منهما ليس \\\"صعوبة تأقلم\\\" — عقلك يقرؤهما فعلياً كإنذار خطر، لأن كليهما يعني أن شبكة الأمان التي يعتمد عليها الجميع لم تعد مضمونة.\"},\"U-06\":{\"example\":\"زميل تأخر عن التزام مرة واحدة، فانخفض رصيده عندك درجة كاملة ولم يرتفع بعدها بسهولة — بينما تجاوز الآخرون الموقف في يومه.\",\"lock\":\"هذا لا يعني أنك \\\"قاسي الأحكام\\\" — إنه ترتيب ما تلتقطه عدستك أولاً؛ وقراءة بواطن الناس وظروفهم عدسة أخرى مستقلة (بُعد المتفهم) لا تُستنتج من درجتك هنا.\",\"title\":\"قراءة الآخرين (موقعهم من خط الأمان)\",\"user\":\"حين تقيّم شخصاً، يذهب نظرك تلقائياً إلى سؤال واحد: \\\"هل هذا ممن يصون العهود والقواعد، أم ممن يستهين بها؟\\\". الموثوقية عندك عملة التعامل الأولى. قد يفوتك في المقابل أن صاحب الفكرة \\\"الخطرة\\\" يحمل منطقاً وجيهاً يستحق السماع، أو أن كاسر القاعدة كان يمر بظرف قاهر.\"},\"U-07\":{\"example\":\"حين اقترح الأعضاء الجدد فكرة \\\"مبتكرة\\\" بحماس، كنت الوحيد الذي قال: \\\"جرّبناها قبل خمس سنوات، وهذا بالضبط ما حدث\\\" — فوفّرت عليهم إعادة تجربة مكلفة.\",\"lock\":\"كونك حارس القواعد **ذهنياً** لا يعني أنك منفّذها الميداني الأفضل — فحص الامتثال عدسة تفكير، وتطبيق الإجراءات على الأرض دائرة أخرى (الإنجاز) تُقاس مستقلة.\",\"title\":\"الموقع في الفريق (الذاكرة والمناعة)\",\"user\":\"موقعك الطبيعي في أي جماعة مزدوج: أنت **ذاكرتها** — من يتذكر ماذا جُرّب من قبل ولماذا فشل — وأنت **مناعتها** — من يفحص كل وافد جديد قبل أن يصل إلى القلب. الفرق التي تضمّك لا تكرر أخطاءها القديمة؛ والتي تفتقدك تدفع ثمن كل درس مرتين.\"},\"U-08\":{\"example\":\"أجّلت تحديث أدوات عملك سنوات لأن أدواتك \\\"تعمل ولا داعي للمخاطرة\\\" — وحين اضطررت أخيراً للتحديث، كانت الفجوة قد اتسعت حتى صار العبور نفسه هو المخاطرة الكبرى التي كنت تتقيها.\",\"lock\":\"هذا ثمن معروف لعدسة الأمان، **لا عيب شخصية ولا حكم نهائي** — ويُدار بشراكة مع أصحاب النظر البعيد وكاسري الأطر (سيصممون التغيير وتصمم أنت شبكة أمانه)، لا بتغيير طبيعتك.\",\"title\":\"نقطة العمى (كلفة عدم التغيير الخفية)\",\"user\":\"الوجه الآخر ليقظتك أن عدستك ترى نوعاً واحداً من الخطر بوضوح كامل — خطر التغيير — بينما النوع الثاني، خطر **البقاء كما نحن**، صامت لا يطلق إنذاراً. فقد تحمي بإتقان قلعةً بينما يتحول الوادي كله من حولها، ويكون أكبر خطر على القلعة هو بقاءها وحدها.\"},\"U-09\":{\"example\":\"الزيارة المفاجئة \\\"خمس دقائق فقط\\\" ترهقك أكثر من اجتماع ساعتين مجدول من أسبوع — ليس لثقل الضيف، بل لأن غير المتوقع يستهلك منك ضعف ما يستهلكه المخطط.\",\"lock\":\"تفضيلك للمستقر وصف لمصدر شحن العدسة، لا مقياس شجاعة ولا انفتاح — لكل عدسة بيئة وقودها.\",\"title\":\"اقتصاد الطاقة واللغة\",\"user\":\"طاقتك تزدهر في البيئات المستقرة المعلومة القواعد، وتُستنزف في الأجواء المتقلبة التي \\\"كل يوم فيها مفاجأة\\\". ولغتك تعكس عدستك: تستشهد بالمتفق عليه (\\\"لكننا اتفقنا على...\\\"، \\\"النظام ينص على...\\\") وتفضّل المواعيد المرتبة سلفاً على \\\"المرور العابر\\\" غير المتوقع.\"},\"U-10\":{\"example\":\"في فترة تتلاحق فيها التغييرات من كل جهة، وجدت نفسك ترفض حتى اقتراحاً بسيطاً كنت ستقبله في أي يوم عادي — ثم استقرت الأمور فعدت تناقشه بهدوء وقبلته.\",\"lock\":\"لا يُبنى على هذه الحالة وصف دائم (\\\"رافض لكل شيء\\\")، ولا تُقرأ منها شدة التوتر المصاحب — الشدة الانفعالية ملف مستقل (دائرة الانفعال).\",\"title\":\"حالة الضغط القصوى (الارتداد العابر)\",\"user\":\"تحت ضغط شديد جداً، قد تمر بحالة مؤقتة معروفة لهذا النمط: يتحول فحصك الدقيق إلى رفض شامل لكل شيء — كل اقتراح \\\"لا\\\"، كل تعديل \\\"مرفوض\\\" — ثم تنغلق تماماً وتتمسك بالوضع القائم حرفياً مهما كانت المعطيات. المهم أن تعرف: **هذه حالة طوارئ عابرة يصنعها الضغط، وليست شخصيتك** — تنقضي بانقضائه، ويعود فحصك المتوازن.\"},\"U-11\":{\"example\":\"قد تكون في العمل أول من يعترض على قرار الإدارة الجديد غير المدروس (فحص أمان)، وفي الوقت نفسه من أوائل المتبنين لفكرة اجتماعية غير مألوفة اقتنعت بها — لا تناقض: العدسة تفحص المخاطر، ولا تملي المواقف.\",\"lock\":\"يُحظر في تقريرك وصفك بـ\\\"المطيع\\\" أو ربط عدستك بأي توجه فكري — كلاهما خارج ما تقيسه هذه العدسة كلياً.\",\"title\":\"ما لا تعنيه هذه العدسة (تحصين مزدوج)\",\"user\":\"أمران كثيراً ما يُخلطان بعدستك وهما ليسا منها: **الأول** الطاعة — عدستك تطلب دليل الأمان، وقد تكون أنت بالذات أشد الناس اعتراضاً على أمر فوقي غير مضمون العواقب؛ حارس القاعدة ليس خادم الآمِر. **والثاني** المواقف الفكرية أو الاجتماعية — هذه العدسة طريقة فحص للمخاطر، لا رأياً في قضايا الناس والحياة؛ قد يحمل صاحبها أكثر الآراء انفتاحاً.\"},\"U-12\":{\"example\":\"بعد سنوات، حين تعصف أزمة بالجميع، يكتشف الفريق أن الاحتياطي الذي أصررت على عدم المساس به — رغم كل الإغراءات — هو ما أبقاهم واقفين.\",\"lock\":\"كون هذا إسهامك المميز لا يجعله \\\"الأعلى\\\" — كل عدسة تضيف ما لا يعوضه غيرها، ولا ترتيب تفاضلي بين البصمات.\",\"title\":\"البصمة (ما تضيفه ولا يعوَّض)\",\"user\":\"إسهامك الذي لا يعوضه أحد: أنت من يضمن أن ما بُني **يبقى**. الآخرون يضيفون طوابق جديدة؛ أنت من يتفقد الأساسات. نزاهتك في تطبيق القاعدة على الجميع — بمن فيهم نفسك — هي ما يجعل الناس يثقون بالنظام أصلاً. المجموعة التي تضمّك تنام مطمئنة أن أحداً يسهر على ما لا يجوز التفريط فيه.\"}},\"E\":{\"U-01\":{\"example\":\"زميل رفض اقتراحاً بسيطاً بحدة غير مبررة؛ بينما انشغل الجميع بالرد على حجته، كنت أنت تسأل داخلياً: \\\"ما الذي لمسه هذا الاقتراح عنده حتى ردّ هكذا؟\\\" — وغالباً وصلت إلى الجواب قبل نهاية الاجتماع.\",\"lock\":\"هذه **قراءة ذهنية** لما يجري داخل الآخر — وليست انفعالاً معه ولا تأثراً به. عمق قراءتك للناس شيء، وشدة مشاعرك أنت شيء آخر تماماً يقيسه نظام مستقل في النموذج (دائرة الانفعال) — **ولا يُستدل من أحدهما على الآخر أبداً**.\",\"title\":\"دورة المعالجة (قراءة ما وراء الكلام)\",\"user\":\"عقلك يستقبل كلام الناس على طبقتين تلقائياً: ما **قيل**، وما **يجري تحته**. حين يقول أحدهم \\\"أنا بخير\\\" بنبرة معينة، تلتقط الفجوة بين الجملة وصاحبها قبل أن يكملها. ثم — دون قصد — تجد نفسك تعيد بناء الموقف من زاويته هو: خلفيته، تاريخه، ما الذي يجعل هذا الموقف بهذا الثقل عنده تحديداً.\"},\"U-02\":{\"example\":\"صديق ينهار متحدثاً عن أزمته؛ الجالسون تأثروا وارتبكوا وعجزوا عن الكلام — وأنت، بهدوء تام، كنت الوحيد الذي فهم بالضبط ما الذي يؤلمه فعلاً (وليس ما يقول إنه يؤلمه)، وقلت الجملة الوحيدة التي احتاجها.\",\"lock\":\"لا يُستنتج من عمق فهمك أي شيء عن انفعالك، ولا من هدوئك أي نقص في فهمك — **الفهم عدسة تفكير، والانفعال دائرة مستقلة بالكامل**. قد يجتمع فهم عميق مع هدوء تام، أو مشاعر جياشة مع قراءة سطحية — كل التركيبات واردة.\",\"title\":\"القراءة الهادئة (تفهم دون أن تذوب)\",\"user\":\"أدق ما في عدستك — وأكثر ما يُساء فهمه — أنك تستطيع أن **تفهم ألم شخص بعمق كامل وأنت هادئ تماماً**. فهمك ليس عدوى مشاعر؛ إنه قراءة. مثل مترجم بارع ينقل نصاً مؤثراً بدقة كاملة دون أن يكون هو المتأثر. ولهذا قد يظن من لا يعرفك أن هدوءك برود — بينما هو بالضبط ما يجعل قراءتك موثوقة: العين الدامعة ترى أقل.\"},\"U-03\":{\"example\":\"شخص اعتاد انتزاع تنازلاتك بقصص مؤثرة؛ في المرة التي التقط فيها رادارك التمثيل، وجد أمامه فجأة شخصاً آخر: هادئاً، دقيقاً، يسأل عن التواريخ والتفاصيل والتناقضات — وانتهت اللعبة.\",\"lock\":\"هذا التحول ليس \\\"قسوة مفاجئة\\\" ولا تقلباً — إنه آلية حماية موثقة في نمطك تحمي قارئ الأعماق من أن يُستغل عمقه. ولا يعني أن عدستك \\\"طيبة\\\" أو \\\"قاسية\\\" — القراءة أداة، والأخلاق ملف آخر لا يقيسه النموذج.\",\"title\":\"الرادار لا يُستغَل (التحييد الهادئ)\",\"user\":\"عدستك ليست ساذجة — العكس تماماً: نفس الرادار الذي يلتقط الألم الحقيقي يلتقط **الألم المُمثَّل**. وحين تكتشف أن أحدهم يوظف المشاعر لاستغلالك، يحدث عندك تحول موثق في نمطك: ينطفئ الدفء فجأة وتتحول إلى قارئ بارد يفكك الحجج تفكيكاً — تحول يفاجئ المتلاعب الذي ظن أن \\\"الشخص المتفهم\\\" فريسة سهلة.\"},\"U-04\":{\"example\":\"في تجمّع كبير، تجد نفسك في النهاية جالساً في الزاوية مع شخص واحد يحدثك بصدق عن حياته الحقيقية — وتخرج تشعر أن هذه الجلسة وحدها \\\"كانت تستحق\\\".\",\"lock\":\"هذا وصف لما يجذب معالجتك المعرفية، لا تفسير لدوافعك العميقة — تلك لها مفتاح مستقل (مفتاح الوصال الوجداني) يُقرأ في قسمه.\",\"title\":\"المحرك (الأصالة قبل كل شيء)\",\"user\":\"ما يجذبك في الناس ليس لطفهم ولا حضورهم — بل **حقيقتهم**. الحديث الحقيقي لعشر دقائق يساوي عندك أمسية كاملة من المجاملات. والشخص \\\"المثالي\\\" الذي لا تصل إلى حقيقته يشغلك أكثر من الشخص الصعب الواضح — لأن عدستك تبحث عن الأصيل تحت كل قناع.\"},\"U-05\":{\"example\":\"اجتماع يناقش \\\"تسريح الفائض من الموارد البشرية\\\" بلغة أرقام صرفة — الآخرون يناقشون الجدوى، وأنت الوحيد الذي يزعجه أن كلمة \\\"بشر\\\" اختفت تماماً من حديث عن بشر.\",\"lock\":\"انزعاجك من التسليع موقف عدسة معرفي، ولا يُقرأ منه شدة انفعالك ولا يُستخدم لوصفك بـ\\\"الحساس\\\" — الشدة ملف مستقل (دائرة الانفعال).\",\"title\":\"ثلاثي الإزعاج\",\"user\":\"ثلاثة أشياء تستنزفك: الكلام المزيف الذي يقول غير ما يُضمر، وتوظيف المشاعر أداة للخداع، ومعاملة البشر كأرقام أو أدوات تُستهلك. انزعاجك ليس \\\"حساسية مفرطة\\\" — هذه الثلاثة تهاجم فعلياً جوهر ما تعمل به عدستك: قراءة الحقيقي في الإنسان وصون كرامته.\"},\"U-06\":{\"example\":\"بينما وصف الجميع زميلاً بأنه \\\"معقّد وصعب\\\"، كنت أنت من قال \\\"هذا شخص تعرّض لتجاوز ما ولم يعد يثق\\\" — وحين عاملته على هذا الأساس، تغيّر معك وحدك.\",\"lock\":\"هذا لا يعني أنك \\\"أطيب\\\" من غيرك ولا أن قراءتك حكم نهائي على أحد — إنها ترتيب ما تلتقطه عدستك أولاً؛ ومنطق الحجج وخرائط النفوذ عدستان أخريان مستقلتان.\",\"title\":\"قراءة الآخرين (نفوس لها جذور)\",\"user\":\"حين تنظر إلى شخص، ترى تلقائياً **قصة**: هذا العناد له جذر، وهذه المبالغة تغطي شيئاً، وهذا الصمت يقول الكثير. لا أحد عندك \\\"سيئ بلا سبب\\\" — الجميع نتاج طريق. قد يفوتك في المقابل ما لا تلتقطه هذه العدسة: أن صاحب القصة المؤثرة يحمل حجة متهافتة منطقياً، أو أن \\\"الجريح\\\" يجلس فعلياً في موقع نفوذ يحرك به المجلس.\"},\"U-07\":{\"example\":\"إنتاجية موظف ممتاز انهارت فجأة؛ اقترحت الإدارة الحوافز ثم الإنذارات بلا جدوى — وأنت من عرف أن المسألة كلها كلمة جارحة قالها له مسؤول قبل شهرين ولم ينسها.\",\"lock\":\"قراءتك للجذر **معلومة تشغيلية** تقدمها للفريق — وليست \\\"تشخيصاً\\\" لأحد ولا حكماً عليه؛ ثم إن تنفيذ المعالجة (جلسة، قرار، ترتيب جديد) عمل ميداني يقيسه نظام آخر (دائرة الإنجاز).\",\"title\":\"الموقع في الفريق (السونار)\",\"user\":\"موقعك الطبيعي في أي فريق هو **السونار**: ترى تحت السطح ما لا تراه التقارير. حين يتعثر شخص كفء بلا سبب ظاهر، أو تفشل مبادرة سليمة على الورق، أنت من يعرف \\\"السبب الحقيقي\\\" الذي لا يُكتب في محاضر الاجتماعات. الفرق التي تفتقد سونارك تصطدم مراراً بجبال جليد بشرية لا تظهر على راداراتها.\"},\"U-08\":{\"example\":\"بعد أسبوع ساندت فيه ثلاثة أشخاص في أزماتهم، وجدت نفسك مساء الخميس مستنزفاً بلا سبب \\\"خاص بك\\\" — حمولتك كانت كلها حمولات الآخرين التي دخلت ولم تخرج.\",\"lock\":\"هذا ثمن معروف لعدسة الغوص، **لا \\\"ضعف شخصية\\\" ولا حكم نهائي** — **حدّ عدسة لا نقص إرادة**، ولا يُدار بإطفاء عمقك. **ولا يُقرأ من الاستنزاف المعرفي هذا أي قياس لمشاعرك** — تلك دائرة مستقلة. *(وصف سبيل التغطية نُقل إلى معجم المركز — `DEC-158`.)*\",\"title\":\"نقطة العمى (حين تذوب الحدود)\",\"user\":\"الوجه الآخر لعمقك أن الغوص الطويل في دواخل الناس قد يُذيب الحدود: تحمل همّ هذا وقصة ذاك حتى تختلط حمولتهم بحمولتك، وتجد نفسك مستنزفاً بمشكلات ليست لك، عاجزاً عن إغلاق الأبواب التي فتحتها قراءتك. المفارقة أن أعمق ما فيك هو بالضبط ما يحتاج أسواراً.\"},\"U-09\":{\"example\":\"في مناسبة كبيرة تجد نفسك خلال ساعة قد انسحبت من صخب القاعة إلى حديث جانبي عميق مع شخص واحد — وهو الجزء الوحيد من الأمسية الذي ستتذكره.\",\"lock\":\"تفضيلك للعمق الثنائي لا يعني ضعفاً اجتماعياً — قراءة المجالس الواسعة وإدارتها عدسة أخرى (البُعد الاجتماعي) مستقلة تماماً؛ ولكل عدسة محطة وقودها.\",\"title\":\"اقتصاد الطاقة واللغة\",\"user\":\"وقودك التواصل **العميق الفردي**: جلسة صادقة مع شخص واحد تشحنك، وأمسية مجاملات مع عشرين تفرغك — وهنا فرق دقيق مهم: لست \\\"منعزلاً عن الناس\\\"، أنت تريد الناس **بعمق لا بعرض**. ولغتك تشبه عدستك: دافئة، مباشرة إلى الجوهر، تسأم البروتوكولات وتفتح المكاشفة — \\\"كيف حالك فعلاً؟\\\" لا \\\"كيف الأحوال؟\\\".\"},\"U-10\":{\"example\":\"بعد فترة حملت فيها أزمات ثلاثة مقربين معاً، لاحظت أنك صرت فجأة \\\"عملياً بارداً\\\" مع الجميع بلا استثناء — ثم مرت العاصفة وعاد دفؤك المعتاد تدريجياً.\",\"lock\":\"كلمة \\\"احتراق\\\" هنا تصف **انهياراً في نظام الفرز الذهني** — وليست وصفاً لمشاعر جياشة ولا انهيار أعصاب؛ أي شدة انفعالية قد تصاحب الحالة ملف مستقل تماماً (دائرة الانفعال) لا يُقرأ من هذه العدسة. ولا يُبنى على الحالة وصف دائم.\",\"title\":\"حالة الضغط القصوى (الارتداد العابر)\",\"user\":\"تحت ضغط شديد جداً، قد تمر بحالة مؤقتة معروفة لهذا النمط على مرحلتين: أولاً يتعطل \\\"جدار الفرز\\\" الذي يفصل ما تقرؤه في الناس عمّا تحمله أنت — فتختلط الحمولات وتفقد القدرة على معرفة أي همّ همّك. ثم — كآلية نجاة — ينقلب النظام فجأة إلى الوضع البارد: تتوقف عن القراءة العميقة كلياً وتتعامل مع كل شيء بمنطق جاف مسافةً وحماية. المهم أن تعرف: **هذه حالة طوارئ معرفية عابرة يصنعها الضغط، لا شخصيتك** — تنقضي بانقضائه ويعود توازن القراءة والجدار معاً.\"},\"U-11\":{\"example\":\"قد تكون في العزاء أهدأ الحاضرين عيناً وأعمقهم إدراكاً لما يحتاجه أهل الفقيد فعلاً — بينما يبكي بجوارك شخص لم يفهم من الموقف شيئاً. دمعُه انفعال، وهدوؤك قراءة — ملفان لا يقيس أحدهما الآخر.\",\"lock\":\"يُحظر في تقريرك استنتاج \\\"العاطفية\\\" أو \\\"الحساسية\\\" أو \\\"الطيبة\\\" من درجتك هنا — **الخلط بين الفهم والانفعال هو أخطر خطأ يحذّر منه النموذج بأكمله.**\",\"title\":\"ما لا تعنيه هذه العدسة (تحصين ثلاثي)\",\"user\":\"ثلاثة أشياء كثيراً ما تُخلط بعدستك وليست منها: **الأول** — العاطفية: عمق فهمك للناس لا يعني أنك \\\"سريع التأثر\\\" أو \\\"مرهف الدمع\\\"؛ قد تكون أهدأ من في الغرفة وأعمقهم قراءة، فالفهم عدسة والانفعال دائرة أخرى. **الثاني** — اللباقة الاجتماعية: قراءة قاع شخص واحد غير إدارة سطح مجلس كامل؛ قد تقرأ الأعماق ببراعة وترتبك في المناسبات العامة. **الثالث** — الطيبة: عدستك أداة قراءة محايدة، تخدم بها من تحب وتكشف بها من يتلاعب — والقارئ العميق ليس بالضرورة \\\"الشخص اللطيف\\\"، ولا اللطيف بالضرورة قارئاً.\"},\"U-12\":{\"example\":\"حين احتار الجميع لماذا يرفض شريك أساسي عرضاً \\\"لا يُرفض\\\"، كنت أنت من قال: \\\"المسألة ليست في الأرقام — هو يشعر أنه لم يُستشر من البداية\\\". عُولجت الكلمة، فوُقّع العقد.\",\"lock\":\"كون هذا إسهامك المميز لا يجعله \\\"الأعلى\\\" — كل عدسة تضيف ما لا يعوضه غيرها، ولا ترتيب تفاضلي بين البصمات.\",\"title\":\"البصمة (ما تضيفه ولا يعوَّض)\",\"user\":\"إسهامك الذي لا يعوضه أحد: أنت من يعرف **لماذا** يفعل الناس ما يفعلون. الخطط عند غيرك، والأرقام عند غيرك — أما مفاتيح البشر الحقيقية فعندك. المجموعة التي تضمّك تعرف لماذا نجحت مع الناس فتكرر النجاح؛ والتي تفتقدك تنجح معهم صدفة وتفشل حيرة، لأن أحداً فيها لا يقرأ ما تحت السطح.\"}},\"H\":{\"U-01\":{\"example\":\"في نقاش عائلي حول تنظيم مصروف البيت بالطريقة المعتادة، تقترح فجأة فكرة مستوحاة من طريقة عمل تطبيق ألعاب — ربط ليس بديهياً لأحد، لكنه يفتح باباً جديداً كلياً.\",\"lock\":\"هذا يصف كيف **يولّد** عقلك الإمكانات — لا كيف تُنفَّذ على الأرض. توليد الإمكان عدسة تفكير؛ والتنفيذ الفعلي نظام مستقل في النموذج (دائرة الإنجاز) لا تقيسه هذه العدسة.\",\"title\":\"دورة المعالجة (بوابة كسر الإطار)\",\"user\":\"عقلك يستقبل أي شيء بسؤال تلقائي: \\\"وماذا لو كان غير ذلك تماماً؟\\\". لا ترى القاعدة الموجودة حداً نهائياً، بل إطاراً مؤقتاً يمكن كسره وإعادة تركيبه. وحين تصلك فكرة من مجال، يمزجها عقلك بفكرة من مجال بعيد كلياً فيولد شيئاً لم يكن موجوداً — هذه ليست شروداً، إنها طريقة عملك الأصلية.\"},\"U-02\":{\"example\":\"يجتمع الفريق ليختار بين حلّين، فتفتح أنت فجأة باباً ثالثاً ورابعاً لم يكونا مطروحين — بعضهم يمتنّ لأنك أنقذتهم من خيار سيئ، وبعضهم يتضايق لأنك \\\"أطلت\\\" ما ظنّه محسوماً.\",\"lock\":\"كون عدستك توسيعية لا يعني أنك \\\"لا تحسم\\\" أو \\\"فوضوي\\\" — الإغلاق والحسم عدسات أخرى مشروعة، والفريق يحتاج من يفتح ومن يغلق معاً.\",\"title\":\"العدسة التوسيعية (الوحيدة التي تفتح)\",\"user\":\"ثمة فرق جوهري بينك وبين معظم من حولك: عقولهم تعمل بالتضييق — تأخذ المشكلة وتقلّص الخيارات حتى تصل إلى إجابة واحدة. أما عقلك فيعمل بالعكس تماماً: يأخذ الإجابة الواحدة ويفتحها على عشرة احتمالات لم تخطر لأحد. هذا يجعلك لا غنى عنه حين تكون كل الأبواب مغلقة — وقد يزعج من يريد الإغلاق السريع.\"},\"U-03\":{\"example\":\"تطرح فكرة مشروع ملهمة في مجلس، فيتحمس الجميع — ثم تتبخر لأن لا أحد حوّلها إلى خطوات. الفكرة كانت رائعة؛ ما نقص هو شريك يُغلق ما فتحتَه أنت.\",\"lock\":\"حاجتك لمن يُكمل فكرتك ليست \\\"عجزاً\\\" — إنها بنية دورك؛ كما يحتاج المهندس المعماري من يبني ما رسمه. تقييم الفكرة وتنفيذها عدسات ودوائر أخرى مستقلة عن درجتك هنا.\",\"title\":\"المخرج إمكان لا قرار (تحتاج شريكاً يُغلق)\",\"user\":\"ما ينتجه عقلك ليس \\\"الحل النهائي\\\" بل \\\"الاحتمال الجديد\\\" — البذرة لا الثمرة. وهذا ليس نقصاً فيك؛ إنه طبيعة دورك: أنت تفتح الأبواب، ويأتي غيرك ليعبر منها. أخصب لحظاتك حين تعمل مع من يُكمل ما بدأت — من يبرهن فكرتك، أو يجسّدها، أو يرتّبها، أو يوجّهها نحو هدف.\"},\"U-04\":{\"example\":\"في مؤسسة \\\"كل شيء فيها يسير كما هو منذ سنوات\\\"، قد تشعر بالاختناق — بينما تشتعل حماستك فجأة حين يُقال \\\"طريقتنا القديمة لم تعد تعمل، نحتاج تفكيراً مختلفاً كلياً\\\".\",\"lock\":\"هذا وصف لما يشعل معالجتك المعرفية، لا تفسير لدوافعك العميقة — تلك لها مفتاح مستقل (مفتاح الإبداع والإمكان) يُقرأ في قسمه.\",\"title\":\"المحرك (كسر الجمود لا الترتيب)\",\"user\":\"ما يحركك هو تحويل \\\"المستحيل\\\" إلى \\\"لمَ لا؟\\\" — كسر جمود، إعادة تخيّل مألوف، خلق معنى جديد. النظام الذي يعمل بكفاءة ولا يحتاج إعادة تفكير قد يصيبك بالملل؛ أما الجمود المتكلس الذي يحتاج من يكسره فيوقظ طاقتك كلها.\"},\"U-05\":{\"example\":\"حين يُرفض اقتراحك بجملة \\\"هذا ليس معمولاً به هنا\\\" دون نقاش، تشعر باختناق حقيقي — ليس لأن اقتراحك رُفض، بل لأن الباب أُغلق قبل أن يُفتح أصلاً.\",\"lock\":\"لا يُقرأ من هذا أن أصحاب القوالب والقواعد \\\"أعداء الإبداع\\\" — حفظ النظام (المنظم) وصون المجرّب (المحافظ) عدستان مشروعتان تحميان ما تبنيه أنت من الانهيار.\",\"title\":\"ثلاثي الإزعاج\",\"user\":\"ثلاثة أشياء تخنقك: القوالب الجامدة التي تقول \\\"هكذا تُفعل الأمور دائماً\\\"، والبيروقراطية التي تعاقب الخروج عن المألوف، وكل بيئة تقتل الخيال باسم \\\"الواقعية\\\". انزعاجك ليس تمرداً لأجل التمرد — هذه الثلاثة تسجن فعلياً الوظيفة التي تعمل بها عدستك: توليد الجديد.\"},\"U-06\":{\"example\":\"تحمّست لشخص شاركك خيالك في مشروع طموح، وتجاهلت زميلاً \\\"تقليدياً\\\" ظللت تراه محدوداً — بينما كان هو الوحيد القادر على تحويل خيالكما إلى شيء يعمل فعلاً.\",\"lock\":\"تصنيفك للناس بعلاقتهم بالإطار زاوية عدستك، لا حكم على قيمتهم — الجدوى (الواقعي) والمآل (الاستراتيجي) والاحتياج (المتفهم) عدسات أخرى مستقلة.\",\"title\":\"قراءة الآخرين (أسرى الإطار أم كاسروه)\",\"user\":\"حين تنظر إلى الناس، تصنّفهم تلقائياً بمعيار واحد: من يفكر داخل الصندوق ومن يستطيع الخروج منه. تنجذب لمن يجاريك في كسر المألوف، وتملّ ممن يتشبث بـ\\\"هكذا هي الأمور\\\". قد يفوتك في المقابل أن المتمسك بالمألوف يحمل حكمة عملية، أو أن فكرتك \\\"الرائعة\\\" لا جدوى مادية لها اليوم.\"},\"U-07\":{\"example\":\"انسدّت كل الحلول المعتادة لأزمة، وساد اليأس — وكنت أنت من قال \\\"ماذا لو قلبنا المسألة رأساً على عقب وفعلنا العكس تماماً؟\\\"، ففُتح طريق لم يره أحد.\",\"lock\":\"كونك مولّد الاحتمالات **ذهنياً** لا يعني أنك منفّذها — توليد البديل عدسة تفكير، وتحويله واقعاً دائرة أخرى (الإنجاز). بل إن أكثر ما يُخلط بك أن غزارة أفكارك تُقرأ خطأً \\\"إنجازاً\\\"، وهما مختلفان تماماً.\",\"title\":\"الموقع في الفريق (مولّد الاحتمالات)\",\"user\":\"موقعك الطبيعي في أي فريق هو **مولّد الاحتمالات**: حين تُغلق كل الأبواب المعروفة ويستسلم الجميع، أنت من يخترع باباً لم يكن موجوداً. الفرق التي تضمّك لا تموت بالتكلس عند تغيّر القواعد؛ والتي تفتقدك تحسّن الموجود بإتقان حتى اللحظة التي يصبح فيها الموجود كله بلا قيمة.\"},\"U-08\":{\"example\":\"لديك خمسة مشاريع بدأتها كلها بشغف حقيقي، وأنجزت منها القليل — لا لأنها لم تكن جيدة، بل لأن كل واحد منها فتح أمامك عالماً جديداً سحبك قبل أن تُنهي الذي قبله.\",\"lock\":\"هذا ثمن معروف لعدسة التوليد، **لا \\\"تشتت مرضي\\\" ولا كسل ولا حكم نهائي** — ويُدار بشراكة من يجيدون الإغلاق (المنطق يبرهن، الواقعي يجسّد، المنظم يرتّب، الاستراتيجي يوجّه)، لا بكبح خيالك.\",\"title\":\"نقطة العمى (ألف باب مفتوح بلا عبور)\",\"user\":\"الوجه الآخر لغزارتك أن عدستك تجيد الفتح ولا تملك معياراً داخلياً للإغلاق: تولّد عشر أفكار رائعة فلا تعرف أيها تختار، وتبدأ مشاريع بحماس ثم يجذبك احتمال جديد قبل إكمال الأول. أنت لا \\\"تفشل في الإنجاز\\\" — أنت ببساطة ترى دائماً باباً أجمل لم تدخله بعد.\"},\"U-09\":{\"example\":\"مهمة إدخال بيانات متكررة قد تنهكك في ساعة، بينما تخرج منتعشاً بعد ثلاث ساعات من جلسة \\\"تخيّل كيف يمكن أن يكون هذا مختلفاً\\\".\",\"lock\":\"نفورك من الروتين وصف لمصدر شحن العدسة، لا مقياس التزام ولا جدية — ولا يعني أن أصحاب التفاصيل \\\"أقل إبداعاً\\\"؛ لكل عدسة محطة وقودها.\",\"title\":\"اقتصاد الطاقة واللغة\",\"user\":\"طاقتك تتغذى من التخيّل الحر: توليد الأفكار وكسر الأطر يشحنك، والروتين المتكرر والتفاصيل الحرفية تستنزفك. ولغتك تشبه عدستك: مجازية، مليئة بالاستعارات و\\\"ماذا لو؟\\\"، وتنفر من الحرفية الجافة ومن حصر الحديث في التفاصيل الصغيرة.\"},\"U-10\":{\"example\":\"في فترة مزدحمة بالمطالب، قد تجد نفسك تقفز بين عشرات الأفكار الجديدة بلا إنجاز أيّ منها، وترفض بحدة أي محاولة من زميل لترتيبك — ثم يهدأ الضغط فتعود قدرتك على التركيز والاختيار.\",\"lock\":\"لا يُبنى على هذه الحالة وصف دائم (\\\"فوضوي/مشتت\\\")، ولا تُقرأ منها شدة التوتر المصاحب — الشدة الانفعالية ملف مستقل (دائرة الانفعال).\",\"title\":\"حالة الضغط القصوى (الارتداد العابر)\",\"user\":\"تحت ضغط شديد جداً، قد تمر بحالة مؤقتة معروفة لهذا النمط: ينفجر توليدك بلا ضابط — أفكار متلاحقة بلا قدرة على ترجيح أو إغلاق، ثم تشتت كامل، ثم نفور حادّ من أي محاولة لتنظيمك أو تأطيرك. المهم أن تعرف: **هذه حالة طوارئ عابرة يصنعها الضغط، لا شخصيتك** — تنقضي بانقضائه.\"},\"U-11\":{\"example\":\"قد يظنك الفريق \\\"صاحب الرؤية الاستراتيجية\\\" لأنك تفيض بالأفكار — بينما دورك الحقيقي أنك تفتح الاحتمالات، ويبقى تحديد \\\"أيها يخدم مستقبلنا\\\" لعدسة أخرى قد تكون عند شخص آخر تماماً.\",\"lock\":\"يُحظر في تقريرك عدّ درجتك المرتفعة هنا \\\"رؤية استراتيجية\\\" أو \\\"مقياس ذكاء\\\" — التوجيه عدسة مستقلة (الاستراتيجي)، والذكاء العام خارج النموذج كلياً؛ لا يُستدل عليهما من هذه الدرجة.\",\"title\":\"ما لا تعنيه هذه العدسة (تحصين مزدوج)\",\"user\":\"أمران كثيراً ما يُخلطان بعدستك وهما ليسا منها: **الأول** — التوجيه الاستراتيجي: أنت **تولّد** الاحتمالات لكل الاتجاهات؛ أما اختيار الاتجاه الواحد النافع ورسم مآله فعدسة أخرى (الاستراتيجي). قد تجتمعان في شخص، لكن الفرق جوهري: أنت تفتح الأبواب كلها، وهو يختار الباب. **الثاني** — الذكاء أو الموهبة: هذه العدسة لا تقيس ذكاءك العام ولا موهبتك الفنية؛ إنها تقيس فقط ميلك الفطري لكسر الأطر وتوليد البدائل — وقد يحملها شخص عادي الذكاء ويفتقدها عبقري.\"},\"U-12\":{\"example\":\"حين انقلب المجال فجأة وسقطت الطرق المعتادة، كان فريقك قد بدأ بالفعل يجرّب البديل — لأنك قبل الجميع تخيّلت \\\"ماذا لو لم يعد هذا يعمل؟\\\" حين كان لا يزال يعمل.\",\"lock\":\"كون هذا إسهامك المميز لا يجعله \\\"الأعلى\\\" — كل عدسة تضيف ما لا يعوضه غيرها، ولا ترتيب تفاضلي بين البصمات.\",\"title\":\"البصمة (ما تضيفه ولا يعوَّض)\",\"user\":\"إسهامك الذي لا يعوضه أحد: أنت من يتخيّل ما لم يوجد بعد. غيرك يحسّن الموجود بإتقان؛ أنت من يخلق البديل حين يصبح الموجود بلا قيمة. المجموعة التي تضمّك تنجو حين تتغير قواعد اللعبة لأنها تخيّلت الملعب الجديد؛ والتي تفتقدك تتقن ملعباً قديماً حتى تُهزم فيه وهي بطلته.\"}},\"O\":{\"U-01\":{\"example\":\"يُطلب من الأسرة تجهيز مناسبة كبيرة؛ بينما يتحمس الجميع للفكرة، تكون أنت من أخرج ورقة وكتب: \\\"أولاً القاعة، ثانياً الدعوات، ثالثاً الضيافة — ومن المسؤول عن كل بند\\\". بورقتك تلك تحوّلت الحماسة إلى مشروع.\",\"lock\":\"هذا يصف كيف يبني عقلك **خريطة** العمل — لا كيف تنفذها يداك في الواقع. التنفيذ الفعلي والالتزام الميداني نظام مستقل في النموذج (دائرة الإنجاز) لا تقيسه هذه العدسة.\",\"title\":\"دورة المعالجة (بوابة الأوعية)\",\"user\":\"عقلك يستقبل أي موضوع كبير بسؤال تلقائي: \\\"كيف نقسّمه؟ وما ترتيبه؟\\\". لا يرتاح للفكرة وهي كتلة واحدة سائلة — يرتاح لها حين تصير خطوات مرقمة لكل خطوة مالك وموعد. أنت لا تؤجل البدء حين تفعل ذلك؛ أنت **تبدأ** فعلاً، لأن بناء المسار عندك هو الخطوة الأولى الحقيقية.\"},\"U-02\":{\"example\":\"بعد اجتماع ودّي انتهى باتفاقات متناثرة، أنت من أرسل رسالة تلخّص: \\\"إذن اتفقنا: فلان يتولى كذا قبل الخميس، وفلانة كذا\\\". رسالة دقيقتين وفّرت أسبوع التباس.\",\"lock\":\"إعادة تشكيل السائل ليست \\\"تحكماً\\\" في الآخرين ولا وسوسة — إنها الطريقة التي تحمي بها عدستك تدفق العمل من الضياع، ولا يُستنتج منها أي حكم على نواياك.\",\"title\":\"صانع الشكل (ما يقاوم الوعاء)\",\"user\":\"الأشياء \\\"السائلة\\\" تقلقك معرفياً: مهمة لا يُعرف صاحبها، هدف بلا خطوات، اتفاق شفهي بلا توثيق. رد فعلك التلقائي أن تعيد تشكيلها — تكتبها، تحدد مالكها، تعطيها موعداً. قيمتك الخاصة ليست في المحتوى نفسه، بل في صناعة **الشكل** الذي يجعل المحتوى قابلاً للتشغيل والتكرار.\"},\"U-03\":{\"example\":\"رتّبت ملفات العائلة الرقمية في مجلدات واضحة استغرقت منك عطلة كاملة؛ بعد شهر وجدت أحدهم يحفظ الملفات عشوائياً على سطح المكتب \\\"مؤقتاً\\\" — انزعاجك لم يكن من الملف، بل من بداية انهيار النظام كله.\",\"lock\":\"حساسيتك لكسر القالب استجابة بنيوية لعدستك، لا \\\"ضيق صدر\\\" — ولا تعني أن كاسر القالب \\\"مستهتر\\\"؛ غالباً هو يعمل بعدسة أخرى لا ترى القالب أصلاً.\",\"title\":\"المنطق الاقتصادي (استثمار القالب)\",\"user\":\"أنت تدفع مقدماً لترتاح طويلاً: تقضي وقتاً في بناء نظام (قالب، جدول، طريقة عمل) يوفر عليك وعلى الجميع مئات القرارات الصغيرة لاحقاً. ولهذا بالذات يزعجك من \\\"يكسر النظام لمرة واحدة\\\" أكثر مما يتوقع — فهو لا يكسر استثناءً في نظرك، بل يهدر استثماراً كاملاً بنيته للجميع.\"},\"U-04\":{\"example\":\"قد تتطوع بحماس لترتيب مخزن الجمعية المقلوب رأساً على عقب — المهمة التي يهرب منها الجميع — وتخرج منه بعد ساعات منتعشاً لا مرهقاً.\",\"lock\":\"هذا وصف لما يشعل معالجتك المعرفية، لا تفسير لدوافعك العميقة — تلك لها مفتاح مستقل (مفتاح النظام والهيكلة) يُقرأ في قسمه.\",\"title\":\"المحرك (إخضاع الفوضى لا جمال الترتيب)\",\"user\":\"ما يجذبك ليس \\\"المنظر المرتب\\\" بذاته، بل لحظة تحويل الفوضى إلى نظام: ملفات متراكمة تصير أرشيفاً، عمل عشوائي يصير خط سير. المكان المرتب أصلاً قد لا يثيرك — أما الفوضى القابلة للترويض فتوقظ طاقتك كلها.\"},\"U-05\":{\"example\":\"حين يقول زميل \\\"لا تقلق، نرتب أمورنا وقتها\\\" عن مشروع يبدأ بعد أسبوعين، تشعر بقلق فوري لا يفهمه — أنت ترى المشهد الكامل: وقتها سيكون الترتيب قد فات أوانه.\",\"lock\":\"لا يُقرأ من هذا أن المرتجلين \\\"فاشلون\\\" — الارتجال المرن عدسة أخرى مشروعة (البُعد الواقعي)، والفريق يحتاج القالب والمرونة معاً.\",\"title\":\"مثلث الإزعاج\",\"user\":\"ثلاثة أشياء تستنزفك: عمل يسير بلا ترتيب معلوم، ومهام لا يُعرف من صاحبها فيتدخل الجميع في كل شيء، ومواعيد تُكسر وكأنها اقتراحات. انزعاجك ليس تزمتاً — كل واحدة منها تهدم ركناً من البنية التي تجعل العمل ممكناً أصلاً في نظر عدستك.\"},\"U-06\":{\"example\":\"توزّع مهام رحلة العائلة توزيعاً عادلاً محكماً — وتتفاجأ بامتعاض أحدهم؛ التوزيع كان سليماً على الورق، لكن أحداً لم يسأله أصلاً إن كان يطيق هذه المهمة تحديداً.\",\"lock\":\"هذا لا يعني أنك \\\"لا تبالي بالناس\\\" — قراءة سعة الناس الداخلية عدسة مستقلة (بُعد المتفهم) لا تقيسها درجتك هنا ولا تُستنتج منها.\",\"title\":\"قراءة الآخرين (الأدوار والتسليمات)\",\"user\":\"حين تنظر إلى فريق، ترى تلقائياً خريطة أدوار: من يفعل ماذا، ومن سلّم ومن تأخر. قد يفوتك في المقابل ما لا تظهره الخريطة — أن المتأخر منهك فعلاً، أو أن توزيعاً \\\"منطقياً\\\" للمهام لمس حساسية بين شخصين. عدستك تقرأ المصفوفة قبل البشر الذين يسكنونها.\"},\"U-07\":{\"example\":\"نجح حدث تطوعي نجاحاً باهراً بجهد بطولي مرتجل؛ أنت من جلس بعده وكتب \\\"كيف ننظمه\\\" خطوة بخطوة — وبفضل تلك الورقة نجح في السنوات الخمس التالية بلا بطولات.\",\"lock\":\"كونك من يبني السقالة **ذهنياً** لا يعني تلقائياً أنك من يتسلقها ميدانياً — بناء النظام عدسة تفكير، وتشغيله على الأرض دائرة أخرى (الإنجاز) تُقاس مستقلة.\",\"title\":\"الموقع في الفريق (باني السقالات)\",\"user\":\"موقعك الطبيعي في أي فريق هو **باني السقالات**: تستلم فكرة ملهمة أو رؤية كبيرة أو حماساً متدفقاً، وتعيد تسليمه نظاماً يمكن لأي شخص تشغيله وتكراره. بدونك تبقى الأفكار العبقرية شفهية، والرؤى شعارات، والنجاحات صدفاً غير قابلة للإعادة.\"},\"U-08\":{\"example\":\"ما زلت تملأ جدول متابعة أسبوعياً بدقة كاملة رغم أن المشروع الذي أُنشئ له انتهى منذ شهرين — الجدول يعمل بكفاءة تامة، فقط لم يعد له موضوع.\",\"lock\":\"هذان ثمنان معروفان لعدسة القوالب، **لا عيبا شخصية ولا حكم نهائي** — ويُداران بمراجعة دورية بسيطة (\\\"هل ما زال هذا النظام يخدم غرضه؟\\\") وبشراكة من يجيدون الارتجال، لا بتغيير طبيعتك.\",\"title\":\"نقطة العمى المزدوجة (القالب بعد انتهاء صلاحيته)\",\"user\":\"الوجه الآخر لإتقانك وجهان: الأول أن النظام الذي بنيته قد يستمر بالعمل بعد أن تنتهي حاجته — يدور بسلاسة تامة حول مهمة لم تعد مهمة، وسلاسة الدوران نفسها تخفي عنك السؤال \\\"هل ما زلنا نحتاجه؟\\\". والثاني أن المفاجأة الكاملة الخارجة عن كل قالب قد توقفك لحظياً — ليس عجزاً، بل لأن عقلك يبحث أولاً عن وعاء للجديد قبل التعامل معه.\"},\"U-09\":{\"example\":\"حين يشرح لك أحدهم قصة ويبدأ من نهايتها، تجد نفسك تقاطعه: \\\"لحظة — ارجع للبداية، ماذا حدث أولاً؟\\\". أنت لا تعطّل الحكاية؛ أنت تبني تسلسلها لتفهمها.\",\"lock\":\"حبك للتسلسل وصف لأسلوب معالجة، لا مقياس ذكاء لك أو لمن يقفز — القافزون غالباً يعالجون بعدسة أخرى (الصورة الكلية) مشروعة بنفس القدر.\",\"title\":\"اقتصاد الطاقة واللغة\",\"user\":\"ما يستنزف غيرك قد يشحنك أنت: ساعة ترتيب ملفات أو تحديث قوائم قد تكون استراحتك الفعلية. ولغتك مثل عدستك — متسلسلة: \\\"أولاً... ثانياً... ثالثاً\\\"، وتنزعج ممن يقفز إلى النتيجة قبل شرح الطريق، لأن القفز يترك في ذهنك فراغات معلقة.\"},\"U-10\":{\"example\":\"حين يقول لك أحدهم \\\"نلتقي مساءً\\\" تشعر بانزعاج خفيف وتسأل \\\"السادسة أم الثامنة؟\\\" — ليس تشدداً، بل لأن \\\"مساءً\\\" فراغ في خريطتك الذهنية لا تستطيع البناء حوله.\",\"lock\":\"حساسيتك الذهنية للمواعيد **لا تعني تلقائياً أنك ملتزم بها فعلياً على الأرض** — الالتزام الميداني بالوقت يقيسه نظام آخر (دائرة الإنجاز). شخص يحمل خريطة زمنية ذهنية دقيقة **ويتأخر فعلياً** = تركيبة واردة لا تناقض فيها، والعكس صحيح.\",\"title\":\"الحس الزمني (خريطة الوقت الذهنية)\",\"user\":\"الوقت عندك ليس خطاً غامضاً بل خريطة مقسمة: تعرف ذهنياً أين تقع كل مهمة من الأسبوع، ومتى \\\"نقطة التفتيش\\\" التالية. تأخير موعد لا يزعجك كوقت ضائع فحسب — بل كخلل في خريطة كاملة بُنيت عليه. هذه حساسية **إدراكية** للزمن المجدول.\"},\"U-11\":{\"example\":\"في أسبوع منهك، يقترح عليك زميل تعديلاً صغيراً منطقياً على ترتيب متفق عليه — فترفضه بحدة تفاجئك أنت نفسك، ثم بعد انقضاء الضغط تتبناه بهدوء.\",\"lock\":\"لا يُبنى على هذه الحالة وصف دائم (\\\"متصلب/عنيد\\\")، ولا تُقرأ منها شدة التوتر المصاحب — الشدة الانفعالية ملف مستقل (دائرة الانفعال).\",\"title\":\"حالة الضغط القصوى (الارتداد العابر)\",\"user\":\"تحت ضغط شديد جداً، قد تمر بحالة مؤقتة معروفة لهذا النمط: تتشبث بالخطة القائمة حرفياً حتى لو تغيّر كل شيء حولها، وترفض أي تعديل مهما بدا معقولاً — لأن التعديل في تلك اللحظة يُقرأ تهديداً لآخر شيء متماسك. المهم أن تعرف: **هذه حالة طوارئ عابرة يصنعها الضغط، لا شخصيتك** — تنقضي بانقضائه.\"},\"U-12\":{\"example\":\"حين غاب الموظف \\\"الذي يعرف كل شيء\\\" فتعطلت الإدارة، كانت وثيقة الإجراءات التي كتبتَها قبل سنة هي ما أبقى العمل يدور.\",\"lock\":\"كون هذا إسهامك المميز لا يجعله \\\"الأعلى\\\" — كل عدسة تضيف ما لا يعوضه غيرها، ولا ترتيب تفاضلي بين البصمات.\",\"title\":\"البصمة (ما تضيفه ولا يعوَّض)\",\"user\":\"إسهامك الذي لا يعوضه أحد: أنت من يجعل النجاح **قابلاً للتكرار**. الآخرون قد ينجزون مرة ببطولة فردية؛ أنت تحوّل البطولة إلى نظام ينجح به أي شخص كل مرة. المجموعة التي تضمّك لا تعيد اختراع العجلة كل صباح — والتي تفتقدك تدفع ثمن الفوضى يومياً دون أن تعرف اسم ما تدفعه.\"}},\"R\":{\"U-01\":{\"example\":\"في نقاش عائلي عن السفر، بينما يتجادل الجميع عن الوجهة الأجمل، تكون أنت من فتح الهاتف يتحقق من أسعار التذاكر والإجازات المتاحة — لأن الوجهة بلا حجز مجرد كلام.\",\"lock\":\"هذا يصف كيف **يفكّر** عقلك، لا كيف **تتحرك** يداك — سرعة التنفيذ الفعلي والمبادرة الميدانية نظام مستقل تماماً في النموذج (دائرة الإنجاز)، ودرجتك هنا لا تقيسه.\",\"title\":\"دورة المعالجة (بوابة \\\"الممكن الآن\\\")\",\"user\":\"عقلك يستقبل أي فكرة بسؤال تلقائي واحد: \\\"طيب — عملياً، كيف ننفذها بما نملك الآن؟\\\". لا يرتاح للفكرة لأنها جميلة أو عميقة، بل حين يرى طريقها إلى أرض الواقع بالموارد المتاحة. الفكرة التي لا تملك \\\"أرجلاً\\\" تمشي بها لا تحجز مكاناً في تفكيرك طويلاً.\"},\"U-02\":{\"example\":\"في محاضرة عن \\\"مستقبل التقنية\\\"، ينشط ذهنك فقط عندما يقول المتحدث \\\"وهذا التطبيق متاح الآن ويوفر عليك ساعة يومياً\\\" — هنا فجأة صار الكلام حقيقياً.\",\"lock\":\"ميلك للملموس لا يعني أنك \\\"سطحي\\\" ولا أن المنظّرين \\\"أفضل عمقاً\\\" — هما عدستان مختلفتان تلتقطان طبقتين مختلفتين من نفس العالم، ولا ترتيب بينهما.\",\"title\":\"قاعدة الاختزال (ما يسقط من المعالجة)\",\"user\":\"الحديث النظري الطويل يفقد إشارتك بسرعة — ليس استخفافاً بأصحابه، بل لأن عقلك لا يجد فيه شيئاً \\\"يمسكه\\\". أنت تحتاج مثالاً ملموساً أو رقماً أو خطوة أولى واضحة حتى تدخل الفكرة منطقة اهتمامك.\"},\"U-03\":{\"example\":\"قد تؤجل ترتيب أوراق مشروع كبير لأسابيع، ثم تقضي عطلة كاملة بحماس في إصلاح باب البيت — لأن الباب يُصلَح **اليوم** ويُرى أثره اليوم.\",\"lock\":\"هذا وصف لما يجذب معالجتك المعرفية، لا تفسير لدوافعك العميقة — تلك لها مفتاح مستقل في النموذج (مفتاح الفاعلية العملية) يُقرأ في قسمه.\",\"title\":\"المحرك (الأثر المرئي فوراً)\",\"user\":\"ما يشحنك فعلاً هو رؤية أثر يديك: مشكلة كانت قائمة صباحاً وحُلّت مساءً، شيء معطل صار يعمل. المشاريع الطويلة التي لا يظهر أثرها إلا بعد سنة تستنزف حماسك مهما كانت مهمة — ليس لقلة صبرك، بل لأن وقودك هو \\\"الفرق الملموس\\\".\"},\"U-04\":{\"example\":\"بعد ساعة من نقاش \\\"رؤيتنا للخمس سنوات القادمة\\\"، سؤالك الوحيد: \\\"جميل — ماذا سنفعل يوم الأحد؟\\\". السؤال الذي قد يضحك الحضور هو نفسه الذي ينقذ الرؤية من البقاء حبراً.\",\"lock\":\"لا يُقرأ من هذا أن المخططين بعيدي المدى \\\"مضيعو وقت\\\" — رصد المآلات عدسة مشروعة أخرى (البُعد الاستراتيجي)، والفريق الكامل يحتاج العدستين معاً.\",\"title\":\"مثلث الإزعاج\",\"user\":\"ثلاثة أشياء تستنزفك: اجتماع نظري طويل ينتهي بلا خطوة واحدة، ومشروع \\\"كبير وملهم\\\" لا يستطيع أحد تحديد ما المطلوب فيه غداً صباحاً، ورؤية موارد تُهدر أمامك. انزعاجك ليس ضيق أفق — إنه رد فعل عدسة تعيش على الجدوى.\"},\"U-05\":{\"example\":\"زميل تراجع أداؤه فتقترح مباشرة إعادة توزيع مهامه — اقتراح سليم عملياً، لكنه قد يفوته أن تراجع الرجل مؤقت وسببه ظرف عائلي كان يحتاج كلمة قبل قرار.\",\"lock\":\"هذا لا يعني أنك \\\"قاسٍ\\\" — قراءة بواطن الناس عدسة مستقلة (بُعد المتفهم) لا تقيسها درجتك هنا، ولا تُستنتج منها.\",\"title\":\"قراءة الآخرين (المساهمة الحالية)\",\"user\":\"حين تقيّم شخصاً في العمل، يذهب نظرك تلقائياً إلى إنتاجه الفعلي: ماذا أنجز؟ ماذا يضيف الآن؟ قد يفوتك في المقابل ما لا يظهر في الإنتاج — ظرفه الخفي، أو حساسية موقعه بين الناس. عدستك تلتقط \\\"المخرجات\\\" قبل أصحابها.\"},\"U-06\":{\"example\":\"في مبادرة تطوعية مليئة بالأفكار المتحمسة، أنت من قال: \\\"نبدأ بحيّ واحد، بميزانية كذا، السبت القادم\\\" — وبك وحدك خرجت المبادرة من مجموعة الواتساب إلى الشارع.\",\"lock\":\"كونك من **يُنزل** الفكرة أرضاً ذهنياً لا يعني تلقائياً أنك من **ينفذها** ميدانياً بتفوق — حساب \\\"كيف ننفذ\\\" عدسة تفكير، والتنفيذ نفسه دائرة أخرى (الإنجاز) تُقاس مستقلة. **هذا أهم فصل في تقريرك كله.**\",\"title\":\"الموقع في الفريق (صمام الإنزال الأرضي)\",\"user\":\"موقعك الطبيعي في أي فريق هو **نقطة الهبوط**: حيث تتحول الرؤى والخطط والأفكار إلى شيء يعمل فعلاً. أنت من يسأل \\\"بكم؟ ومتى؟ وبمن؟\\\" — الأسئلة الثلاثة التي تفصل المشروع عن الحلم. الفرق التي تفتقد صوتك تملأ الجدران خططاً ولا تسلّم شيئاً.\"},\"U-07\":{\"example\":\"جهاز في البيت يتعطل فتصلحه بحيلة ذكية في دقائق — ثلاث مرات في السنة. الحيلة عبقرية حقاً؛ لكن أحداً لم يسأل بعد لماذا يتعطل أساساً.\",\"lock\":\"هذا ثمن معروف لعدسة الاستجابة السريعة، **لا عيب شخصية ولا حكم نهائي** — ويُدار بشراكة مع من يحفرون نحو الجذر (العدسة التحليلية)، لا بتغيير طبيعتك.\",\"title\":\"نقطة العمى الأولى (السطح والترقيع)\",\"user\":\"الوجه الآخر لسرعتك أن الحل السريع قد يعالج العرض ويترك الجذر: المشكلة \\\"تنحل\\\" اليوم وتعود الشهر القادم بثوب آخر، فتحلها ثانية بنفس البراعة — وتتراكم الترقيعات. أنت لا تتهاون؛ عدستك ببساطة تُغلق الملف عند توقف النزيف، وسؤال \\\"لماذا نزف أصلاً؟\\\" خارج نطاقها التلقائي.\"},\"U-08\":{\"example\":\"تختار العرض الأرخص فوراً وتوفر مبلغاً محترماً اليوم — ويتضح بعد عامين أن كلفة صيانته التراكمية أكلت الفارق مرتين.\",\"lock\":\"لا يُستنتج من هذا استهتار بالمستقبل — إنه حدّ فلترة تُغطّى بالتخادم مع أصحاب النظر البعيد (العدسة الاستراتيجية)، والفريق المكتمل يجمع العدستين.\",\"title\":\"نقطة العمى الثانية (سقوط الغد من الحسبة)\",\"user\":\"حساباتك دقيقة جداً في مدى قريب، لكن ما يتجاوز الأفق المنظور قد يسقط من الحسبة دون أن تقصد: قرار ممتاز لهذا الشهر قد يحمل كلفة صامتة بعد سنتين لم تدخل المعادلة أصلاً. أنت لم \\\"تتجاهل\\\" الغد — الغد ببساطة لم يكن في نطاق العدسة.\"},\"U-09\":{\"example\":\"بعد ساعتين من اجتماع تنظيري تخرج مرهقاً كأنك حملت أثقالاً، ثم تقضي أربع ساعات في عمل ميداني وتعود أنشط مما ذهبت.\",\"lock\":\"حاجتك للحركة وصف لمصدر شحن العدسة، لا مقياس التزام ولا حكم على من يفضلون المكاتب — لكل عدسة محطة وقودها.\",\"title\":\"اقتصاد الطاقة واللغة\",\"user\":\"طاقتك تأتي من الحركة والاحتكاك بالواقع: الميدان يشحنك والمكتب المغلق يستنزفك، والنقاش النظري الطويل يطفئك أسرع من يوم عمل شاق. لغتك مثل عدستك — قصيرة، مباشرة، تنتهي بخطوة: \\\"خلاصة الكلام، ماذا نفعل؟\\\".\"},\"U-10\":{\"example\":\"في أسبوع تتزاحم فيه ثلاث أزمات، قد تجد نفسك تصلح الأمور بعشوائية غير معهودة منك وتُغلق الأبواب بقوة أكثر من اللازم — ثم يخف الحمل فتعود دقتك المعهودة.\",\"lock\":\"لا يُبنى على هذه الحالة وصف دائم، **ولا تُقرأ منها شدة الغضب أو الانفعال** — الشدة الانفعالية ملف مستقل تماماً (دائرة الانفعال) لا تلمسه هذه العدسة.\",\"title\":\"حالة الضغط القصوى (الارتداد العابر)\",\"user\":\"تحت ضغط شديد جداً، قد تمر بحالة مؤقتة معروفة لهذا النمط: تبدأ بإطلاق حلول سريعة متلاحقة دون حساب معتاد دقتك، ترقّع هنا وهناك، ويصير تعاملك مع الأشياء من حولك أخشن. المهم أن تعرف: **هذه حالة طوارئ عابرة يصنعها الضغط، لا شخصيتك** — تنقضي بانقضائه.\"},\"U-11\":{\"example\":\"تعطلت الأداة الأساسية قبل التسليم بساعات ولا بديل — فابتكرت طريقة إنجاز مختلفة كلياً بما هو موجود على الطاولة، طريقة ما كانت لتخطر ببالك لو كانت الأداة تعمل.\",\"lock\":\"هذه الآلية تعمل عند **انعدام الأصول** تحديداً، وهي غير حالة الضغط القصوى (K2-R-U-10) التي يصنعها تراكم الحمل — سياقان مختلفان لا يُخلطان في التقرير.\",\"title\":\"الملاذ الإبداعي عند الصفر (آلية فريدة)\",\"user\":\"لديك آلية مميزة موثقة في نمطك: حين تُغلق كل الأبواب فعلاً — لا مال، لا أدوات، لا وقت — لا تتجمد، بل ينقلب عقلك فجأة إلى وضع ابتكاري يخترع بدائل من لا شيء. المفارقة أن أكثر حلولك إبداعاً قد تولد في أفقر لحظاتك موارد.\"},\"U-12\":{\"example\":\"في نهاية العام، حين يستعرض الفريق ما تحقق فعلاً — لا ما خُطط له — تجد بصمتك على معظم القائمة.\",\"lock\":\"كون هذا إسهامك المميز لا يجعله \\\"الأعلى\\\" — كل عدسة تضيف ما لا يعوضه غيرها، ولا ترتيب تفاضلي بين البصمات.\",\"title\":\"البصمة (ما تضيفه ولا يعوَّض)\",\"user\":\"إسهامك الذي لا يعوضه أحد: أنت من يجعل الأشياء **تحدث**. الأفكار الذكية كثيرة، والخطط الجميلة أكثر — والنادر هو من يحوّلها واقعاً بما هو متاح اليوم. حضورك هو الفرق بين مؤسسة \\\"تنوي\\\" ومؤسسة \\\"تفعل\\\".\"}},\"S\":{\"U-01\":{\"example\":\"قبل أن تطرح فكرة في اجتماع عائلي، تكون قد حسبت تلقائياً: من سيتحمس، من سيعارض، ومن الأفضل أن يسمعها أولاً على انفراد لتصل للجميع بسلاسة — خطة تواصل كاملة لم تستغرق منك ثانية.\",\"lock\":\"هذا يصف قراءتك لـ**مناخ المجموعة الظاهر** — لا قراءةً لأعماق الأفراد ومشاعرهم الدفينة. سبر البواطن عدسة أخرى مستقلة تماماً في النموذج (بُعد المتفهم) لا تقيسها درجتك هنا.\",\"title\":\"دورة المعالجة (بوابة المحيط البشري)\",\"user\":\"عقلك يستقبل أي موقف بسؤال تلقائي: \\\"من الحاضرون؟ وكيف سيستقبلون هذا؟\\\". قبل أن تقرر **ماذا** تقول، تكون قد قرأت **لمن** ستقوله وكيف يُقال ليمرّ. القرار عندك لا يكتمل بصحته وحدها — يكتمل حين يجد طريقه إلى قبول الناس.\"},\"U-02\":{\"example\":\"في حفل، تلحظ خلال دقائق أن مجموعة الزاوية متوترة وأن ضيفاً يُترك وحده فتتحرك لإصلاح ذلك — بينما قد يجلس شخص آخر الليلة كلها مع ضيف واحد يستمع لهمّه العميق. أنتما تخدمان الناس بعدستين مختلفتين.\",\"lock\":\"اتساع رادارك لا يقول شيئاً عن عمق غوصك — والعكس؛ هما محوران مستقلان في النموذج **لا يُستدل من أحدهما على الآخر أبداً**، وهذا من أهم الفواصل في تقريرك كله.\",\"title\":\"العدسة الأفقية (السطح الواسع لا القاع العميق)\",\"user\":\"عدستك تعمل مثل رادار واسع: تمسح القاعة كلها في لحظة — من متوتر، من منسجم، أين يتشكل التكتل، ومتى يتغير مزاج المجلس. هذا مسح **بالعرض** يغطي الجميع؛ أما الغوص **بالعمق** في نفس شخص واحد — ما جرحه القديم؟ ما حاجته التي لا يقولها؟ — فهذه أداة أخرى مختلفة قد يحملها غيرك.\"},\"U-03\":{\"example\":\"قرار مؤلم بإلغاء رحلة العائلة — نفس الخبر: أوصلته للوالد كترشيد حكيم، وللصغار كتأجيل لمغامرة أكبر، ولمن دفع مقدماً بخطة استرداد. خبر واحد، ثلاث صياغات، صفر معارك.\",\"lock\":\"براعة التغليف لا تعني ضعف المضمون عندك ولا \\\"تلوّناً\\\" — إنها وظيفة عدستك: تحويل الصحيح إلى مقبول. صحة المضمون نفسه تُفحص بعدسات أخرى (المنطق، الجدوى) لكل منها قسمها.\",\"title\":\"المغلِّف لا المصدر (فن التأطير)\",\"user\":\"موهبتك المعرفية الخاصة ليست في صناعة الفكرة بل في **إيصالها**: تستطيع أخذ نفس المضمون وصياغته بعشر طرق حسب من أمامك — للطبيب بلغة، لكبير العائلة بلغة، للشباب بلغة — دون أن يتغير الجوهر. الفكرة الصحيحة التي تُقال بطريقة خاطئة تموت؛ وأنت من يمنحها طريقة العيش.\"},\"U-04\":{\"example\":\"في مشروع تخرّج أو عمل جماعي، لم يكن دورك الأبرز في المحتوى — بل في أنك جمعت بين زميلين متخاصمين ليعملا معاً، وأقنعت المشرف الصعب بمنح الفريق فرصة إضافية. بدون هذين \\\"الإنجازين غير المرئيين\\\" ما اكتمل المشروع.\",\"lock\":\"هذا وصف لما يشعل معالجتك المعرفية، لا تفسير لدوافعك العميقة — تلك لها مفتاح مستقل (مفتاح الانتماء والتواصل) يُقرأ في قسمه.\",\"title\":\"المحرك (النفوذ والتأييد وتماسك الشبكة)\",\"user\":\"ما يشحنك فعلاً هو تحريك الناس نحو شيء: كسب تأييد، بناء جسر بين طرفين متباعدين، تحويل مجموعة غرباء إلى فريق. المهمة الفردية المنعزلة — مهما كانت مهمة — تفقد بريقها لأن ملعبك الحقيقي هو ما **بين** الناس، لا ما على الطاولة.\"},\"U-05\":{\"example\":\"أسبوع عمل من البيت بلا لقاءات يستنزفك أكثر من أسبوع اجتماعات متتالية — عكس زملاء يحلمون بالعزلة. لستَ \\\"أقل جدية\\\"؛ وقودكما مختلف.\",\"lock\":\"لا يُقرأ من انزعاجك من الصدام أنك \\\"ضعيف الشخصية\\\" — تجنّب كسر الجو **العلني** خيار عدسة تحمي الشبكة، وقول الحقيقة له عندك قنوات أخرى غير المواجهة المفتوحة.\",\"title\":\"ثلاثي الإزعاج\",\"user\":\"ثلاثة أشياء تستنزفك: العمل المعزول الطويل بلا بشر، والمواجهات العلنية الجافة التي تكسر الجو أمام الجميع، وشعور أن المجموعة رفضت ما قدّمت. انزعاجك ليس \\\"حساسية زائدة\\\" — هذه الثلاثة تعطّل فعلياً الوظيفة التي تعمل بها عدستك: قراءة الناس والوصول إليهم.\"},\"U-06\":{\"example\":\"في دائرة حكومية معقدة، عرفت خلال زيارة واحدة أن \\\"الموظف الجانبي\\\" هو من ينهي المعاملات فعلياً — معلومة وفّرت عليك أسابيع كان سيقضيها غيرك مع المدير الرسمي.\",\"lock\":\"قراءة \\\"من المؤثر\\\" غير قراءة \\\"ماذا يخفي\\\" — الأولى عدستك، والثانية عدسة المتفهم المستقلة. لا يُستدل من إحداهما على الأخرى.\",\"title\":\"قراءة الآخرين (خريطة القوى)\",\"user\":\"حين تدخل مكاناً جديداً، ترتسم في ذهنك خلال دقائق خريطة لا يراها غيرك: من صاحب الكلمة الفعلي (وليس بالضرورة صاحب المنصب)، من يتحالف مع من، ومن مفتاح الوصول لمن. قد يفوتك في المقابل ما لا تظهره الخريطة — الجرح الصامت لشخص هادئ، أو خلل منطقي في حجة الشخص المحبوب.\"},\"U-07\":{\"example\":\"حين احتاج الفريق إبلاغ العميل بتأخير محرج، دُفعتَ أنت للواجهة بإجماع صامت — وخرج العميل من المكالمة متفهماً بل شاكراً. نفس الخبر بصوت آخر كان سيفقدهم الحساب.\",\"lock\":\"كونك مهندس القبول **ذهنياً** لا يعني تلقائياً أنك المنفّذ الميداني الأنشط للفعاليات والزيارات — هندسة الرسالة عدسة تفكير، والتنفيذ الحركي دائرة أخرى (الإنجاز) تُقاس مستقلة.\",\"title\":\"الموقع في الفريق (الواجهة والمترجم)\",\"user\":\"موقعك الطبيعي في أي فريق هو **الواجهة والمترجم**: بين الفريق والعالم، وبين أعضاء الفريق أنفسهم. القرار القاسي يمرّ حين تصوغه أنت، والفكرة الغريبة تُقبل حين تقدمها أنت، والخصام يبرد حين تتوسط أنت. الفرق التي تفتقد صوتك تنتج أعمالاً ممتازة يرفضها الناس — لا لخطئها، بل لأن أحداً لم يفتح لها القلوب قبل العقول.\"},\"U-08\":{\"example\":\"سُئلت عن رأيك في عمل صديق أمام مجموعة، فقدّمت إجابة أرضت الجميع — وخرج الصديق مطمئناً إلى عملٍ كان يحتاج فعلاً تعديلاً جوهرياً لم يسمعه من أحد.\",\"lock\":\"هذا ثمن معروف لعدسة القبول، **لا نفاقاً ولا ضعف شخصية ولا حكماً نهائياً** — ويُدار بشراكة مع أصحاب الوضوح الصريح (تصوغ أنت **كيف** تُقال حقيقتهم كاملة، لا أن تنحت منها)، لا بتغيير طبيعتك.\",\"title\":\"نقطة العمى (تمييع الحقيقة إرضاءً للكل)\",\"user\":\"الوجه الآخر لمهارتك أن ميزانك الداخلي يقيس \\\"هل الجميع راضٍ؟\\\" بدقة عالية — ولا يقيس بنفس الدقة \\\"هل ما قلته ظلّ صحيحاً بعد كل هذا التلطيف؟\\\". فقد تنحت من الحقيقة زاوية هنا وزاوية هناك لتناسب كل حاضر، حتى يصل الجميع راضين — إلى استنتاج لم يعد دقيقاً. الرضا العام قد يشتري بعملة الوضوح.\"},\"U-09\":{\"example\":\"بعد يوم مرهق، يقترح عليك أحدهم الراحة في هدوء البيت — فتكتشف أن ما أراحك فعلاً كان عشاءً صاخباً مع الأصدقاء.\",\"lock\":\"حاجتك للناس وصف لمصدر شحن العدسة، لا مقياس التزام ولا عمق — ولا يعني أن أهل العزلة \\\"أقل حباً للناس\\\"؛ لكل عدسة محطة وقودها.\",\"title\":\"اقتصاد الطاقة واللغة\",\"user\":\"البشر وقودك: المجلس العامر يشحنك والمكتب الخالي يفرغك، وأفضل أفكارك تولد في الحديث لا في الصمت. لغتك ناعمة مرنة تفتح الأبواب قبل طرح الطلبات، وتعرف قيمة \\\"الدردشة الجانبية\\\" التي يظنها غيرك مضيعة وقت — وهي عندك بناء جسور. وثمة فرق دقيق: أنت تشحن بالحضور **وسط الجمع**؛ بينما يشحن نمط آخر بالجلسة **العميقة مع شخص واحد** — كلاكما \\\"مع الناس\\\" بطريقتين مختلفتين.\"},\"U-10\":{\"example\":\"في أزمة عائلية محتدمة، وجدت نفسك أولاً توافق الجميع على كل شيء لتهدئة الجو، ثم حين لم يهدأ — انسحبت إلى \\\"نلتزم بما اتفقنا عليه سابقاً حرفياً\\\" بجمود ليس من عاداتك. ثم مرّت العاصفة وعادت مرونتك.\",\"lock\":\"لا يُبنى على هذه الحالة وصف دائم (\\\"إمّعة\\\" أو \\\"متقلب\\\")، ولا تُقرأ منها شدة القلق المصاحب — الشدة الانفعالية ملف مستقل (دائرة الانفعال).\",\"title\":\"حالة الضغط القصوى (الارتداد العابر)\",\"user\":\"تحت ضغط شديد جداً، قد تمر بحالة مؤقتة معروفة لهذا النمط على مرحلتين: أولاً تُفرط في التسكين — موافقات ومجاملات في كل اتجاه لإطفاء التوتر ولو على حساب الجوهر — فإن اشتد الضغط أكثر، تنسحب فجأة نحو الآمن والمألوف: تتمسك بالمتفق عليه والرسمي وتغلق باب المرونة الذي يميزك. المهم أن تعرف: **هذه حالة طوارئ عابرة يصنعها الضغط، لا شخصيتك** — تنقضي بانقضائه.\"},\"U-11\":{\"example\":\"قد تعرف بدقة أن \\\"فلاناً هو مفتاح إقناع المجموعة\\\" (عدستك تعمل بكامل قوتها)، دون أن تدري أن فلاناً هذا يمر بأصعب فترات حياته (عدسة أخرى لم تُفتح) — ودون أن تكون أنت نجم السهرة أصلاً.\",\"lock\":\"يُحظر في تقريرك استنتاج \\\"التعاطف\\\" أو \\\"العمق الإنساني\\\" من درجتك هنا، كما يُحظر اشتراط \\\"الكاريزما\\\" لها — **هذا أكثر خلط يحذّر منه النموذج كله**.\",\"title\":\"ما لا تعنيه هذه العدسة (تحصين مزدوج)\",\"user\":\"أمران كثيراً ما يُخلطان بعدستك وهما ليسا منها: **الأول** أن قراءتك الواسعة للمجالس لا تعني تلقائياً غوصاً في أعماق الأفراد — رادار القاعة غير مسبار القلب، وقد تجتمع لك أدق خريطة للحاضرين مع غفلة تامة عن جرح أقربهم. **والثاني** أن هذه العدسة ليست \\\"خفة الظل\\\" ولا الحضور الجذاب — تلك مهارات تُكتسب وتصقل؛ عدستك أعمق: هي أن يكون الناس **معيار قراراتك التلقائي**. وقد يحمل هذه العدسةَ شخصٌ خجول قليل الكلام يقرأ المجلس بدقة من زاويته الصامتة.\"},\"U-12\":{\"example\":\"مبادرتان متشابهتان في حيّين: نجحت التي تولّيت أنت \\\"تسويقها البشري\\\" — زيارات، قهوات، كلمات في المجالس — وتعثرت الأخرى رغم أنها كانت أفضل تخطيطاً على الورق.\",\"lock\":\"كون هذا إسهامك المميز لا يجعله \\\"الأعلى\\\" — كل عدسة تضيف ما لا يعوضه غيرها، ولا ترتيب تفاضلي بين البصمات.\",\"title\":\"البصمة (ما تضيفه ولا يعوَّض)\",\"user\":\"إسهامك الذي لا يعوضه أحد: أنت من يؤمّن للأفكار **بشرها** — التأييد الذي تمشي عليه، والتحالفات التي تحميها، والقبول الذي يفتح لها الأبواب. غيرك يصنع القرار الصحيح؛ أنت من يضمن ألا يموت وحيداً. المجموعة التي تضمّك تجد لكل مبادرة أنصاراً — والتي تفتقدك تتساءل دوماً: \\\"لماذا يقاوم الناس كل ما نطرح؟\\\".\"}},\"St\":{\"U-01\":{\"example\":\"حين تفكر العائلة في شراء بيت، يناقش الجميع السعر والموقع الحالي — بينما تسأل أنت: \\\"كيف سيكون هذا الحيّ بعد عشر سنوات؟ وأين ستكون مدارس الأبناء وقتها؟\\\". أنت تقرأ القرار على خريطة زمنية لا يراها الباقون.\",\"lock\":\"هذا يصف كيف يرسم عقلك **الاتجاه** — لا كيف تُنفّذ الخطوات على الأرض. رسم الوجهة عدسة تفكير؛ والتنفيذ الفعلي والمثابرة نظام مستقل في النموذج (دائرة الإنجاز) لا تقيسه هذه العدسة.\",\"title\":\"دورة المعالجة (بوابة المآل البعيد)\",\"user\":\"عقلك يستقبل أي حدث بسؤال تلقائي: \\\"إلى أين يقودنا هذا بعد سنوات؟\\\". لا تلتقط الحدث معزولاً، بل تراه نقطة في خط ممتد وتربطه بأنماط أخرى بعيدة عنه ظاهرياً. القرار عندك لا يُقاس بمكسبه اليوم، بل بموقعه من الصورة الكبيرة التي تراها وحدك أحياناً.\"},\"U-02\":{\"example\":\"في اجتماع يستغرق ساعة في نقاش لون الشعار، تجد نفسك غائباً منشغلاً بسؤال أكبر: \\\"هل هذا المنتج نفسه سيبقى مطلوباً بعد ثلاث سنوات؟\\\" — سؤال قد يبدو خارج الموضوع، وهو الأهم فيه.\",\"lock\":\"إهمالك للتفاصيل اللحظية لا يعني أنك \\\"غير منظم\\\" ولا \\\"غير عملي\\\" — التعامل مع التفاصيل والجداول عدسة أخرى (المنظم)، والتعامل مع اللحظة والموارد عدسة ثالثة (الواقعي)، وكلتاهما مستقلتان عن درجتك هنا.\",\"title\":\"قاعدة الإهمال (سقوط الضجيج اليومي)\",\"user\":\"التفاصيل اليومية الصغيرة تفقد إشارتك بسرعة — ليس استهانةً بها، بل لأن عدستك مضبوطة على \\\"الصورة الكبيرة\\\" فلا يدخل رادارها ما لا يحرّك المسار الكلي. قد يبدو هذا \\\"شروداً\\\" لمن حولك، بينما أنت في الحقيقة تعمل على طبقة زمنية أبعد من طبقتهم.\"},\"U-03\":{\"example\":\"في عمل مستقر يسير بكفاءة، قد تشعر بملل غير مفهوم للآخرين — بينما تشتعل فجأة حين يُطرح سؤال \\\"إلى أين نتجه في السوق الجديد؟\\\". الغموض الكبير وقودك، لا الوضوح الصغير.\",\"lock\":\"هذا وصف لما يشعل معالجتك المعرفية، لا تفسير لدوافعك العميقة — تلك لها مفتاح مستقل (مفتاح الرؤية والبوصلة) يُقرأ في قسمه.\",\"title\":\"المحرك (تأمين المستقبل)\",\"user\":\"ما يحركك ليس إنجاز اليوم بل تأمين الغد: أين ينبغي أن نكون بعد سنوات، وما \\\"الرافعة\\\" التي إن حرّكناها اليوم غيّرت كل شيء لاحقاً. المهمة الواضحة قصيرة المدى قد تملّك؛ أما الغموض المستقبلي الذي يحتاج من يرسم فيه بوصلة، فيوقظ طاقتك كلها.\"},\"U-04\":{\"example\":\"يُطلب منك متابعة تفاصيل يومية دقيقة لمشروع، فتشعر باختناق حقيقي — بينما ينتعش زميلك المنظّم في نفس المهمة تماماً. لستَ \\\"أرفع\\\" منه؛ عدساكما ببساطة تعملان على طبقتين مختلفتين.\",\"lock\":\"لا يُقرأ من هذا أن أصحاب التفاصيل \\\"محدودو الأفق\\\" — التفاصيل الدقيقة عدسة مشروعة (المنظم)، والفريق يحتاج البوصلة والتفاصيل معاً.\",\"title\":\"ثنائي الإزعاج\",\"user\":\"شيئان يستنزفانك: الغرق في تفاصيل صغيرة لا تُغيّر شيئاً في الصورة الكبرى، والانشغال الكامل بمكاسب اليوم دون سؤال عن الغد. انزعاجك ليس تعالياً على التفاصيل — إنه شعور عدستك بأنها سُحبت من طبقتها الطبيعية (البعيدة) إلى طبقة لا تعمل عليها بكفاءة (القريبة).\"},\"U-05\":{\"example\":\"تنصح بالاستثمار في تطوير موظف \\\"لأنه سيكون محورياً بعد سنوات\\\" — قراءة استراتيجية صائبة، وقد يفوتك أن نفس الموظف يمر الآن بضائقة تحتاج التفاتة اليوم قبل خطة الغد.\",\"lock\":\"رؤيتك للناس كأطراف في نظام ممتد **ليست معاملةً لهم كأدوات ولا برودة** — إنها زاوية عدستك (المآل)، لا موقفاً أخلاقياً. قراءة بواطنهم عدسة أخرى (المتفهم)، وقيمتهم الآنية عدسة ثالثة (الواقعي)، مستقلتان عن درجتك هنا.\",\"title\":\"قراءة الآخرين (قطع على رقعة ممتدة)\",\"user\":\"حين تنظر إلى الناس، تراهم تلقائياً في سياق أكبر: هذا اللاعب سيصعد، وذاك التحالف سينهار، وهذه الحركة الصغيرة اليوم لها أثر كبير بعد سنتين. قد يفوتك في المقابل ما لا تراه هذه العدسة — ألم الشخص الحاضر الآن، أو قيمة ما يقدّمه اليوم بصرف النظر عن مستقبله.\"},\"U-06\":{\"example\":\"اندفع الجميع لتطوير منتج بحماس وكفاءة، وكنت أنت الصوت الذي قال: \\\"قبل أن نكمل — هل ما زال هذا ما يريده السوق، أم أننا نتقن صناعة شيء يموت؟\\\". سؤالك أنقذ أشهر عمل.\",\"lock\":\"كونك من يحدد الوجهة **ذهنياً** لا يعني أنك من يرسم خطواتها التفصيلية (المنظم) ولا من ينفذها ميدانياً (دائرة الإنجاز) — تحديد الاتجاه عدسة مستقلة عن رصف الطريق والسير فيه.\",\"title\":\"الموقع في الفريق (البوصلة)\",\"user\":\"موقعك الطبيعي في أي فريق هو **البوصلة**: من يحدد أين نتجه قبل أن نتحرك، ومن يسأل \\\"هل هذا الطريق يوصلنا حيث نريد أصلاً؟\\\". غيرك يجيد المشي بسرعة؛ أنت تضمن أن الاتجاه صحيح. الفرق التي تفتقد بوصلتك قد تنجز بإتقان مذهل — نحو حائط.\"},\"U-07\":{\"example\":\"تنشغل بتخطيط توسّع الأعمال للسنوات القادمة، ويفوتك أن جهاز العمل الأساسي معطل منذ أيام ويشلّ الفريق **الآن** — الأفق واضح، والأرض تحت القدمين ضبابية.\",\"lock\":\"هذا ثمن معروف لعدسة الأفق البعيد، **لا \\\"انفصال عن الواقع\\\" كحكم ولا عيب نهائي** — ويُدار بشراكة مع أصحاب اللحظة (الواقعي) والتفاصيل (المنظم) الذين يمسكون اليوم بينما تمسك أنت الغد، لا بتغيير طبيعتك.\",\"title\":\"نقطة العمى (الانفصال عن اليوم)\",\"user\":\"الوجه الآخر لبُعد نظرك أن اللحظة الراهنة قد تسقط من حسابك: عدستك مضبوطة على الأفق البعيد بدقة، فلا تلتقط بنفس الوضوح الأزمة الصغيرة الملحّة تحت قدميك اليوم. قد تبني خطة عشر سنوات رائعة بينما فاتورة هذا الشهر لم تُدفع.\"},\"U-08\":{\"example\":\"يسألك أحدهم سؤالاً بسيطاً عن قرار اليوم، فتجيب بخريطة احتمالات للسنوات الثلاث القادمة — ليس مراوغة، بل هكذا يرى عقلك السؤال فعلاً.\",\"lock\":\"أسلوبك الكلي وصف لطريقة معالجة، لا مقياس ذكاء لك أو لأصحاب التفكير التفصيلي — القافزون إلى التفاصيل يعالجون بعدسة أخرى مشروعة بنفس القدر.\",\"title\":\"اقتصاد الطاقة واللغة\",\"user\":\"طاقتك تتغذى من التفكير الكلي نفسه: رسم خرائط المستقبل يشحنك لا يُتعبك، وقد تقضي ساعات ممتدة سعيداً في تفكيك \\\"الصورة الكبرى\\\" لنظام معقّد. ولغتك تشبه عدستك: تتحدث بالسيناريوهات والاحتمالات والاتجاهات، وتتجاوز التفصيلة الصغيرة نحو \\\"ماذا يعني هذا كله؟\\\".\"},\"U-09\":{\"example\":\"في فترة تتزاحم فيها قرارات مصيرية، قد تجد نفسك تقفز بين خطط متناقضة كل يوم بلا حسم، عاجزاً عن رؤية المسار الذي كان واضحاً لك دائماً — ثم يهدأ الضغط فتعود الصورة الكبرى للاتضاح.\",\"lock\":\"لا يُبنى على هذه الحالة وصف دائم (\\\"متردد/مشتت\\\")، ولا تُقرأ منها شدة القلق المصاحب — الشدة الانفعالية ملف مستقل تماماً (دائرة الانفعال).\",\"title\":\"حالة الضغط القصوى (الارتداد العابر)\",\"user\":\"تحت ضغط شديد جداً، قد تمر بحالة مؤقتة معروفة لهذا النمط: تبدأ بالقفز العشوائي بين سيناريوهات ومآلات متعددة دون قدرتك المعتادة على ترجيح أحدها، ثم تتشتت وتفقد بوصلتك التي تميّزك، وقد تصل إلى ذهول تنقطع فيه عن معطيات الواقع من حولك. المهم أن تعرف: **هذه حالة طوارئ عابرة يصنعها الضغط، لا شخصيتك** — تنقضي بانقضائه وتعود بوصلتك.\"},\"U-10\":{\"example\":\"في مشروع جديد، قد يظنك الفريق \\\"المبتكر\\\" لأنك ترى فرصاً كبيرة — بينما دورك الحقيقي أنك اخترتَ من بين أفكار المبتكر تلك الأجدى للمستقبل ووجّهتها؛ ثم سلّمت تفاصيل تنفيذها لمن يجيد الجداول.\",\"lock\":\"يُحظر في تقريرك عدّ درجتك المرتفعة هنا \\\"قدرة إبداعية\\\" أو \\\"مهارة تنظيمية\\\" — توليد الأفكار والجدولة عدستان مستقلتان تُقرآن من قسميهما، ولا يُستدل عليهما من هذه الدرجة.\",\"title\":\"ما لا تعنيه هذه العدسة (تحصين مزدوج: الإبداع والتنظيم)\",\"user\":\"أمران كثيراً ما يُخلطان بعدستك وهما ليسا منها: **الأول** — الإبداع: أنت لا \\\"تولّد\\\" أفكاراً لا متناهية؛ أنت تأخذ الاحتمالات المطروحة و**تفلترها نحو مسار واحد نافع**. صاحب توليد الأفكار الكاسرة عدسة أخرى (التصوري)؛ أنت من يحوّل فيضه إلى وجهة. قد تجتمع العدستان في شخص، لكنهما مختلفتان. **الثاني** — التنظيم: رسمك للوجهة الكبرى لا يعني أنك تجيد رصف خطواتها التفصيلية أو جدولة مواعيدها؛ تلك عدسة المنظم، وقد ترسم أدق بوصلة وتترك رصف الطريق لغيرك.\"},\"U-11\":{\"example\":\"حين تحوّل السوق فجأة وسقط منافسون كبار، كان فريقك مستعداً — لأنك قبل عامين قرأت الإشارة وأصررت على بناء \\\"الرافعة\\\" التي أنقذتهم، رغم أن أحداً لم يرَ حينها ضرورتها.\",\"lock\":\"كون هذا إسهامك المميز لا يجعله \\\"الأعلى\\\" — كل عدسة تضيف ما لا يعوضه غيرها، ولا ترتيب تفاضلي بين البصمات.\",\"title\":\"البصمة (ما تضيفه ولا يعوَّض)\",\"user\":\"إسهامك الذي لا يعوضه أحد: أنت من يرى المنعطف قبل الوصول إليه. غيرك يقود بمهارة وينفّذ بإتقان؛ أنت من يضمن أن الطريق نفسه يؤدي إلى مكان يستحق. المجموعة التي تضمّك تستعد للغد قبل حضوره؛ والتي تفتقدك تتقن حاضرها حتى اللحظة التي تتغير فيها القواعد فتُهزم وهي في أوج كفاءتها.\"}}}",
  CONTENT_K2: "{\"A\":{\"blindness\":\"عمى المركز `A` (§2.4 المحايد · مزدوج): (أ) شلل المعالجة — تمدد الفحص بلا قفل إغلاق؛ (ب) إغفال الإشارة الوجدانية — استبعادها كضوضاء فتغيب عن الخريطة أصلاً. الإغلاق يغطّيه `O`، والحسم/الإنجاز يغطّيه `R`، والإشارة الإنسانية يغطّيها `E`\",\"lines\":{\"A-C-D\":{\"presence\":\"يقترن استدلالك المنطقي بالسابقة؛ تُثبت حتمية التغيير منطقياً وتصوغ بروتوكول انتقال تدريجي آمن — حوكمة مبرهَنة رياضياً وتاريخياً\",\"question\":\"حين تنسف معياراً بحجة منطقية، هل تصمّم معه انتقالاً آمناً؟\",\"recommendation\":\"الحذر من العمى المشترك (عداء مفرط للابتكار الجذري وإجهاض أفكار `H`)\",\"source\":\"§4.1/`A-C` (التطور المحسوب)\"},\"A-C-L\":{\"presence\":\"بلا مرساة تاريخية، قد تنسف معياراً ثبت خطؤه منطقياً دون بروتوكول انتقال آمن؛ الصواب الورقي يسبق ثقل المُجرَّب\",\"question\":\"هل تُسقط قاعدة قائمة فور ثبوت خطئها المنطقي دون خطة انتقال؟\",\"recommendation\":\"تخادم مع عدسة محافظة تصوغ بروتوكول الانتقال الآمن («المدقق السيادي»)\",\"source\":\"§4.1/`A-C` (الصدام: الاستدلال ⚔️ السابقة)\"},\"A-C-M\":{\"presence\":\"مراعاة السابقة متاحة انتقائياً؛ تصون المُجرَّب في الحساس وتُرجّح المنطق في غيره\",\"question\":\"هل توازن حكمك المنطقي بالسابقة دائماً أم في الكبير؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`A-C`\"},\"A-E-D\":{\"presence\":\"إلى جانب تفكيكك المنطقي تدخل الإشارة الإنسانية خريطتَك كبيانات لا كضوضاء؛ تصمّم الهيكل الأصحّ واستراتيجية الامتصاص البشري معاً — «العقلاني الرحيم». عمى الإغفال مُغطّى داخلياً\",\"question\":\"حين تحلّل موقفاً بشرياً، هل تُدرِج إشارته الإنسانية في الحساب أم تعزلها كتشويش؟\",\"recommendation\":\"لا فجوة على المحور الإنساني؛ الانتباه لتوتر `A↔E` القطبي (منطق مجرد ضد رنين وجداني)\",\"source\":\"§2.4/(ب) + §4.1/`A-E` (العقلانية الرحيمة) + §3.1\"},\"A-E-L\":{\"presence\":\"بروتوكول الفلترة يستبعد الإشارة الوجدانية كضوضاء فتغيب عن الخريطة أصلاً (لا تُرى وتُهمَل، بل لا تُرسم) — بنيوي لا «برودة» كحكم\",\"question\":\"هل تغيب مشاعر المعنيين عن حسابك غالباً لأنها لا تدخل تحليلك أصلاً؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل عدسة تفهّم (يصمّم امتصاص الأثر البشري، وتصمّم أنت الهيكل: «العقلاني الرحيم»)\",\"source\":\"§2.4/(ب) + `MATRIX-04` §1 (مُغطّي `E`) + §3.3 + قفل §0.1\"},\"A-E-M\":{\"presence\":\"التقاط الإشارة الإنسانية متاح انتقائياً؛ يحضر مع أثر مباشر على القرار ويغيب في التحليل المجرد البحت\",\"question\":\"هل تُدخِل البُعد الإنساني في كل تحليل أم عند وضوح أثره؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`A-E`\"},\"A-H-D\":{\"presence\":\"تُتاح مساحة توليد معزولة للشريك ثم تُجري تشريحاً منطقياً يحوّل الفرضية نموذجاً ميكانيكياً — مفاهيم كاسرة للمألوف ببراهين مضادة للنقد\",\"question\":\"حين تصلك فرضية جامحة، هل تشرّحها إلى نموذج قابل للفحص أم ترفضها كعبث؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`A-H` (الابتكار المنضبط)\"},\"A-H-L\":{\"presence\":\"التفكير التقاربي يستبعد ليصل لإجابة واحدة؛ قد يُجهَض التوليد التباعدي قبل نضجه (بنيوي — لا «قتل إبداع» كحكم)\",\"question\":\"هل تميل لإغلاق الاحتمالات بسرعة نحو إجابة واحدة قبل توليد بدائل؟\",\"recommendation\":\"تخادم مع عدسة تصورية تولّد بحرية، وتُشرّح أنت الناتج نموذجاً («مخترق النماذج»)\",\"source\":\"§4.1/`A-H` (الصدام: التقاربي ⚔️ التباعدي) + قفل §0.1\"},\"A-H-M\":{\"presence\":\"تشريح الأفكار الجديدة متاح انتقائياً؛ تُخضِع الواعد منها للفحص وتتحفّظ على الباقي\",\"question\":\"هل تمنح الفرضيات الجريئة فحصاً بنّاءً أم رفضاً مبكراً؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`A-H`\"},\"A-O-D\":{\"presence\":\"قوة الإغلاق حاضرة؛ تُدقّق مسبقاً ثم تُسلّم الدفة للإغلاق دون مقاطعة مزمنة — أنظمة إجرائية خالية من الثغرات. عمى الشلل مُغطّى داخلياً من جهة الإغلاق\",\"question\":\"حين يكفي التحليل، هل تُغلق وتُنفّذ أم تظل تفتح زوايا جديدة؟\",\"recommendation\":\"لا فجوة من جهة الإغلاق؛ الانتباه لتوتر `A↔O` (الدقة المطلقة ضد إغلاق المهمة)\",\"source\":\"§2.4/(أ) + §4.1/`A-O` (العمليات المحسنة) + §3.1\"},\"A-O-L\":{\"presence\":\"لا قوة إغلاق داخلية؛ الشلل مكشوف من جهة الجدول — تتوقف العجلة عند كل خطأ منطقي فيتراكم التأخير («معطل مزمن» في نظر الجدول)\",\"question\":\"هل يتعطّل تسليمك أحياناً لأنك لا تُغلق قبل بلوغ الكمال المنطقي؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل تنظيم (تُدقّق أنت مسبقاً ثم يمسك هو الدفة للإغلاق: «المهندس المعصوم»)\",\"source\":\"§2.4/(أ) + `MATRIX-04` §1 (مُغطّي `O`) + §3.3\"},\"A-O-M\":{\"presence\":\"الإغلاق متاح انتقائياً؛ تُغلق المهام الكبرى وتُطيل الفحص في التفصيلي\",\"question\":\"هل تُغلق في وقت محدد دائماً أم في المهم فقط؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`A-O`\"},\"A-R-D\":{\"presence\":\"قوة الحسم الميداني حاضرة؛ تحتوي الأزمة فوراً لضمان التدفق وتصمّم الحل الجذري في الخلفية — «إصلاح نهائي دون تعطيل الحركة». عمى الشلل مُغطّى داخلياً من جهة الحسم\",\"question\":\"حين تشتد أزمة، هل تحسم تدخّلاً فورياً وتؤجّل الجذر أم يشلّك اكتمال التحليل؟\",\"recommendation\":\"لا فجوة من جهة الحسم؛ الانتباه لتوتر `A↔R` (لماذا حدث؟ ضد ماذا الآن؟)\",\"source\":\"§2.4/(أ) + §4.1/`A-R` (البراغماتية المنطقية) + §3.1\"},\"A-R-L\":{\"presence\":\"لا حسم ميداني داخلي؛ الشلل مكشوف من جهة التنفيذ — تنظير سببي ممتد بينما الميدان يحترق («منظّر ورقي»)\",\"question\":\"هل يمضي الوقت في «لماذا حدث؟» بينما يحتاج الموقف «ماذا نفعل الآن؟»\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل واقعي (يحتوي الأزمة فوراً، وتصمّم أنت الجذر خلفياً: «المحسّن التشغيلي»)\",\"source\":\"§2.4/(أ) + `MATRIX-04` §1 (مُغطّي `R`) + §3.3\"},\"A-R-M\":{\"presence\":\"الحسم الفوري متاح انتقائياً؛ تحسم في الأزمات الخانقة وتُطيل التنظير في غيرها\",\"question\":\"هل تحسم تدخلاً فورياً عند اللزوم أم يغلب التنظير؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`A-R`\"},\"A-S-D\":{\"presence\":\"تُصاغ حقيقتك الصلبة مغلقةً ويُغلّفها الحس الاجتماعي فتُمرَّر دون إثارة دفاعات — تمرير الحقائق القاسية دون تفكيك الشبكة\",\"question\":\"حين تُقيّم بصرامة، هل تغلّف الإيصال بما يحفظ التقبّل؟\",\"recommendation\":\"الحذر من العمى المشترك (تسكين السطح وتجاهل الاحتياج العميق للأفراد `E`)\",\"source\":\"§4.1/`A-S` (الدبلوماسية الحادة)\"},\"A-S-L\":{\"presence\":\"الموضوعية الصلبة تُوصَل بلا تغليف؛ قد تُفكَّك علاقات لأن الولاء للحقيقة يسبق تماسك الشبكة (بنيوي — لا «تدمير علاقات» كحكم)\",\"question\":\"هل يحدث أن تقول الصواب فتخسر تقبّل من حولك لغياب التغليف؟\",\"recommendation\":\"تخادم مع عدسة اجتماعية تغلّف تقييمك الصارم («المقنع الدبلوماسي»)\",\"source\":\"§4.1/`A-S` (الصدام: الموضوعية ⚔️ الانسجام) + قفل §0.1\"},\"A-S-M\":{\"presence\":\"التغليف الاجتماعي متاح انتقائياً؛ تُليّن الإيصال مع الحساسين وتُصرّح مع غيرهم\",\"question\":\"هل تراعي وقع نقدك على الشبكة دائماً أم أحياناً؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`A-S`\"},\"A-St-D\":{\"presence\":\"حفرك المجهري يختبر جسور الرؤية الكبرى؛ تُجري هندسة عكسية على البوصلة التي يرسمها الاستشراف — مسارات ممتدة مبرهَنة ضد الفشل\",\"question\":\"حين تُقدَّم رؤية كبرى، هل تحفر في متانة أركانها خطوة خطوة؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`A-St` (الرؤية المحققة)\"},\"A-St-L\":{\"presence\":\"التركيز المجهري قد يفوته انهيار الجبل الكلي؛ يُحفَر في المتغير الواحد بينما يسقط المآل من الرصد (العمى المشترك: انفصال عن اللحظة والميدان `R`)\",\"question\":\"هل تغرق أحياناً في تفصيل دقيق ويفوتك المسار الكلي الكبير؟\",\"recommendation\":\"تخادم مع عدسة استراتيجية ترسم البوصلة وتختبرها أنت («مهندس النظم الكبرى»)\",\"source\":\"§4.1/`A-St` (الصدام: المجهري ⚔️ التلسكوبي)\"},\"A-St-M\":{\"presence\":\"ربط التفصيل بالمآل متاح انتقائياً؛ تختبر أركان القرارات المصيرية وتترك غيرها\",\"question\":\"هل تصل تحليلك المجهري بالصورة الكلية دائماً أم في المصيري؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`A-St`\"}},\"n\":21},\"C\":{\"blindness\":\"عمى المركز `C` (§2.4 المحايد): معيار «تصفير المخاطرة» لا يلتقط كلفة عدم التغيير؛ فيُقرأ التطور الحتمي تهديداً حاضراً بينما خطر الجمود صامت. العدستان اللتان تريان هذا الصامت هما `H` (تخيّل البديل) و`St` (رصد تقادم المآل) — فحالتهما في الملف تحدّد إن كان الغطاء داخلياً أم يلزمه تخادم بيني\",\"lines\":{\"C-A-D\":{\"presence\":\"حرسك مسنود بالبرهان لا بالتقليد وحده؛ تدافع عن الإبقاء حين يثبت اتساقه، وتقبل التغيير حين تُثبَت حتميته منطقياً — «تطور محسوب» لا جمود\",\"question\":\"حين تعارض تغييراً، هل تسنده بحجة منطقية أم بأنه «هكذا كان دائماً»؟\",\"recommendation\":\"توأمة `A↔C` قوية؛ الحذر من جفاف يُهمل التوافق البشري (`S`/`E`) — العمى المشترك المسجَّل\",\"source\":\"§4.1/`C-A` (التطور المحسوب / المنطق المُدرج)\"},\"C-A-L\":{\"presence\":\"حرسك يستند إلى السابقة والزمن أكثر من المنطق؛ قد تُبقي إجراءً «مُجرَّباً» وإن سقط سنده المنطقي، لأن معيار «صمد عبر الزمن» يسبق معيار «متسق منطقياً»\",\"question\":\"هل تدافع أحياناً عن إجراء لأنه قديم مألوف دون فحص جدواه المنطقية الآن؟\",\"recommendation\":\"عند قرار إبقاء عالي الأثر، استدعِ مراجعة منطقية بينية («المدقق السيادي») قبل التثبيت\",\"source\":\"§4.1/`C-A` (الصدام: السابقة ⚔️ الاستدلال)\"},\"C-A-M\":{\"presence\":\"الفحص المنطقي متاح لأمانك انتقائياً؛ تطالب بالدليل في القرارات الكبرى بينما تكتفي بالسابقة في الأصغر\",\"question\":\"هل تطلب برهاناً لكل إبقاء، أم للكبير منه فقط؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`C-A`\"},\"C-E-D\":{\"presence\":\"أمانك مُنسنَن؛ تلتقط الظرف الفردي وتبحث في اللوائح عن مخرج يلبّيه دون كسر المرجعية — تُمأسس الإنسانية حقوقاً ثابتة\",\"question\":\"حين يصطدم المعيار بظرف إنساني، هل تبحث عن مخرج نظامي يحفظ الاثنين؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`C-E` (الاستيعاب المُمأسس)\"},\"C-E-L\":{\"presence\":\"يُنفَّذ المعيار المؤسسي فوق الظرف الفردي؛ قد تحمي الكيان بالالتزام بالقاعدة وتغيب عنك كلفة ذلك على الفرد (العمى المشترك: عجز عن القرارات المراعية `E`)\",\"question\":\"هل يسبق «حماية المعيار» عندك «مراعاة ظرف الفرد» غالباً؟\",\"recommendation\":\"تخادم مع عدسة متفهمة لصياغة مخرج نظامي يحفظ الفرد دون كسر المرجعية («المرجعية الحاضنة»)\",\"source\":\"§4.1/`C-E` (الصدام: المعيار المؤسسي ⚔️ الظرف الفردي)\"},\"C-E-M\":{\"presence\":\"مراعاة الظرف الفردي متاحة انتقائياً؛ تُفعّلها في الحالات البيّنة وتحتكم للمعيار في غيرها\",\"question\":\"هل تستوعب الاستثناء الإنساني افتراضياً أم عند وضوح الحاجة فقط؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`C-E`\"},\"C-H-D\":{\"presence\":\"عدستك المولّدة حاضرة بقوة إلى جانب حرسك؛ تلتقط ذاتياً «كلفة البقاء كما نحن» وتشعر بانجذاب للجديد حتى وأنت تحصّن القديم. عمى المركز مُغطّى داخلياً\",\"question\":\"هل تجد دفعاً تلقائياً لتخيّل بديل للقائم، أم يكفيك استقرار القائم؟\",\"recommendation\":\"لا فجوة تُسدّ؛ الانتباه لإدارة توتر `H↔C` (رهان الجديد ضد ضمان السابقة)، لا سدّ نقص\",\"source\":\"§2.4 (محايد) + §4.1/`C-H` (التطور المُحصّن) + §3.1\"},\"C-H-L\":{\"presence\":\"الابتكار غائب عن أولوية معالجتك؛ عمى المركز مكشوف — «كلفة عدم التغيير» لا تُطلَق داخلياً، وقد يُقرأ التطور الحتمي تهديداً بلا مُعادِل داخلي\",\"question\":\"هل يبدو لك «الإبقاء على ما يعمل» بديهياً نادراً ما يُساءَل؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل ابتكار مرتفع (هو يصمّم التغيير، وأنت شبكة أمانه: «مهندس التطور المُحصّن»)، لا بإطفاء حرسك\",\"source\":\"§2.4 + `MATRIX-04` §1 (مُغطّي `H`) + §3.3\"},\"C-H-M\":{\"presence\":\"الابتكار متاح يُستدعى انتقائياً (قرار كبير · تهديد للأصول) لا بالفطرة الأولى؛ فإشارة «تقادم القائم» تصلك مشروطةً بالسياق لا كإنذار افتراضي\",\"question\":\"حين يُطرح تغيير جذري، هل يخطر البديل تلقائياً أم بعد استحثاث؟\",\"recommendation\":\"نقطة استحثاث دورية («ما الذي تجاوزنا زمنه؟») تحوّل الغطاء من انتقائي إلى منتظم\",\"source\":\"§3.2 + §4.1/`C-H`\"},\"C-O-D\":{\"presence\":\"أمانك يقترن بهندسة الهيكل؛ فتنتج أنظمة توثيقية ضخمة تحرس الكيان لعقود — لكن انتبه: توأمتكما «مألوف موثوق ضد أكفأ حديث» قد تتوتر داخلياً\",\"question\":\"حين يتعارض «المألوف الآمن» مع «الأكفأ الجديد»، أيّهما يرجح عندك؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`C-O` (التحديث الآمن) + §4.2 (صدام داخل معسكر الاستقرار)\"},\"C-O-L\":{\"presence\":\"أمانك بلا تجسيد هيكلي منظّم؛ قد يبقى قيمةً وحرصاً دون قوالب إجرائية تحمله وتُكرّره\",\"question\":\"هل حرصك على الأمان محفوظ في نُظُم مكتوبة أم في ذاكرتك وحدها؟\",\"recommendation\":\"تخادم مع عدسة تنظيم لتثبيت الأمان في قوالب قابلة للتكرار\",\"source\":\"§4.1/`C-O`\"},\"C-O-M\":{\"presence\":\"البنية الهيكلية متاحة تساند أمانك انتقائياً؛ تُمأسس ما تراه جوهرياً وتترك الباقي عرفاً\",\"question\":\"هل تُقنّن حرصك في هياكل مكتوبة أم يبقى عُرفاً متوارثاً؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`C-O`\"},\"C-R-D\":{\"presence\":\"أمانك يتجسّد تشغيلياً؛ تحوّل حرص السلامة إلى انضباط يومي مختبَر بالمتاح — التزام وأمان بكفاءة عالية على الأرض\",\"question\":\"هل يظهر حرصك في إجراءات يومية ملموسة أم في مبادئ ولوائح مجرّدة؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`C-R` (الاختراق الآمن / الحارس التشغيلي)\"},\"C-R-L\":{\"presence\":\"أمانك يميل للبقاء لائحياً/مبدئياً دون اختبار ميداني فوري؛ قد تحرس بروتوكولاً على الورق يتخلف تطبيقه عن نبض الأرض\",\"question\":\"هل تظل بعض قواعدك «صحيحة نظرياً» دون التحقق من صلاحها اليوم عملياً؟\",\"recommendation\":\"تخادم مع عدسة واقعية لتحويل اللائحة إلى بروتوكول مُختبَر («الاختراق الآمن»)\",\"source\":\"§4.1/`C-R` (الصدام: السابقة ⚔️ التشغيل الفوري)\"},\"C-R-M\":{\"presence\":\"التجسيد التشغيلي متاح انتقائياً؛ تختبر بعض قواعد الأمان ميدانياً وتُبقي بعضها على مستوى اللائحة\",\"question\":\"كم من لوائح أمانك مُختبَر عملياً مقابل مكتوب فقط؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`C-R`\"},\"C-S-D\":{\"presence\":\"تُنفَّذ قاعدتك بوجه دبلوماسي؛ تحرس نزاهة اللائحة وتبلّغ الرفض بما يحفظ ماء الوجه والعلاقة — تحمي الهوية دون تمرد بشري\",\"question\":\"حين ترفض استثناءً، هل توصله بأسلوب يحفظ العلاقة أم بحدّ القاعدة وحده؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`C-S` (الحزم الدبلوماسي)\"},\"C-S-L\":{\"presence\":\"تُطبَّق القاعدة على الجميع بلا تلطيف اجتماعي — «قاعدة عمياء» تضمن العدالة لكنها قد تخسر حلفاء وتُقرأ جفافاً في الحس السياسي\",\"question\":\"هل تطبّق القاعدة نفسها على الكل دون نظر لأثرها على الشبكة؟\",\"recommendation\":\"تخادم مع عدسة اجتماعية لتبليغ الحزم دبلوماسياً («الدبلوماسي الحافظ»)\",\"source\":\"§4.1/`C-S` (الصدام: القاعدة العمياء ⚔️ الاستثناء الاجتماعي)\"},\"C-S-M\":{\"presence\":\"الحس الاجتماعي متاح انتقائياً؛ تُليّن تطبيق القاعدة مع من تقدّر أثرهم، وتُحدّه مع غيرهم\",\"question\":\"هل تراعي أثر العلاقة عند إنفاذ القاعدة دائماً أم أحياناً؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`C-S`\"},\"C-St-D\":{\"presence\":\"بوصلة المآل حاضرة بقوة؛ تقيس قرار الأمان بمعيار «إلى أين يقود هذا على المدى؟» لا بالسابقة وحدها. عمى تقادم القائم مُغطّى — تحرس الأصول راصداً منعطف الطريق\",\"question\":\"حين تدافع عن إبقاء نظام، هل تسنده بمآله البعيد أم بثباته الماضي؟\",\"recommendation\":\"لا فجوة؛ الانتباه لإدارة توتر `St↔C` (رهان المآل ضد ضمان السابقة)\",\"source\":\"§2.4 + §4.1/`C-St` (التحول الآمن) + §3.1\"},\"C-St-L\":{\"presence\":\"المآل البعيد غائب عن أولويتك؛ عمى «تقادم المألوف» مكشوف على محور الزمن — قد يُحمى القائم دون رصد أن السوق حوله يتحول\",\"question\":\"هل تُبنى قراراتك أساساً على «ما نجح سابقاً» دون سؤال «هل يظل ينجح؟»\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل استشراف مرتفع («باني الإمبراطوريات المستدامة»: هو يرسم التحول، وأنت شبكة أمان الأصول أثناءه)\",\"source\":\"§2.4 + `MATRIX-04` §1 (مُغطّي `St`) + §3.3\"},\"C-St-M\":{\"presence\":\"رصد المآل متاح انتقائياً؛ تستدعيه عند القرارات عالية الأثر لكن الفلترة الأولى تحكمها السابقة، فيبقى إحساس «التقادم» مشروطاً\",\"question\":\"هل يحضر سؤال «وماذا بعد سنوات؟» تلقائياً أم عند رفع المخاطر؟\",\"recommendation\":\"ربط مراجعة الأصول بأفق زمني معلن يثبّت الغطاء\",\"source\":\"§3.2 + §4.1/`C-St`\"}},\"n\":21},\"E\":{\"blindness\":\"\",\"lines\":{\"E-A-D\":{\"presence\":\"تشخّص الجرح النفسي والخلل الميكانيكي معاً؛ الحل المجرد القابل للقياس يمنع انصهارك\",\"question\":\"حين تعالج تعثّراً، هل تجمع الجذر النفسي بالحل المنطقي؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`E-A` (التخادم التشخيصي)\"},\"E-A-L\":{\"presence\":\"قراءتك الإنسانية بلا مرساة منطقية؛ قد يبطئ الغوص الحسمَ ويغيب المعيار الموضوعي\",\"question\":\"هل تغرق أحياناً في البُعد النفسي فيتأخر القرار المنطقي؟\",\"recommendation\":\"تخادم مع عدسة تحليلية توفّر الحل القابل للقياس («العقلاني الرحيم»)\",\"source\":\"§4.1/`E-A` (الصدام: الروح ⚔️ المنطق البارد)\"},\"E-A-M\":{\"presence\":\"الفحص المنطقي متاح انتقائياً يسند قراءتك الوجدانية\",\"question\":\"هل تُخضِع قراءتك الإنسانية لتحقّق منطقي أحياناً؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`E-A`\"},\"E-C-D\":{\"presence\":\"تلتقط الظرف الفردي وتبحث في اللوائح عن مخرج يلبّيه دون كسر المرجعية — تُمأسس لأبواب؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل عدسة تنظيم يعيد هندسة عبئك وفق سعتك الحقيقية («الهيكلة الرحيمة»)\",\"source\":\"§2.4 + `MATRIX-04` §1 + §3.3\"},\"E-O-M\":{\"presence\":\"بناء الحدود متاح انتقائياً؛ تحمي طاقتك في المواقف الكبرى وتنكشف في اليومي المتكرر\",\"question\":\"هل تضع حدوداً واضحة دائماً أم عند الإنهاك فقط؟\",\"recommendation\":\"أفق زمني معلن للراحة يثبّت الغطاء\",\"source\":\"§3.2 + §4.1/`E-O`\"},\"E-R-D\":{\"presence\":\"تترجم الجذر النفسي إلى حوافز وأدوات ملموسة تقي من الاحتراق\",\"question\":\"حين تشخّص مانعاً إنسانياً، هل تصمّم له تدخلاً مادياً؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`E-R` (الإمداد والاحتواء)\"},\"E-R-L\":{\"presence\":\"تقرأ الاحتراق ولا تترجمه مادياً؛ قد يبقى الاحتواء وجدانياً بلا أثر تشغيلي\",\"question\":\"هل يبقى تعاطفك بلا خطوة مادية تعالج الجذر؟\",\"recommendation\":\"تخادم مع عدسة واقعية تصمّم التدخل المادي\",\"source\":\"§4.1/`E-R` (الصدام: الكيان النفسي ⚔️ التروس الآلية)\"},\"E-R-M\":{\"presence\":\"الترجمة المادية متاحة انتقائياً\",\"question\":\"هل تحوّل قراءتك إلى تدخل ملموس دائماً أم أحياناً؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`E-R`\"},\"E-S-D\":{\"presence\":\"قراءتك العميقة مسنودة بمسح شبكي؛ تلبّي الاحتياج الدفين وتؤطّر خطابه للقبول — تحالفات ولاء يصعب اختراقها\",\"question\":\"حين تكسب شخصاً، هل تخاطب حاجته القاعية وتغلّفها اجتماعياً معاً؟\",\"recommendation\":\"الحذر من العمى المشترك (الحقائق المادية `R` والمنطقية `A`)\",\"source\":\"§4.1/`E-S`\"},\"E-S-L\":{\"presence\":\"تقرأ عمق الفرد لا مناخ الجماعة؛ قد يفوتك انسجام السطح والتحالف الأفقي (حدّ عدسة لا نقص)\",\"question\":\"هل تسبر همّ الفرد أعمق مما تقرأ مزاج القاعة؟\",\"recommendation\":\"تخادم مع عدسة اجتماعية تدير انسجام المجموع\",\"source\":\"§4.1/`E-S` (الصدام: المكاشفة العمودية ⚔️ الانسجام الأفقي)\"},\"E-S-M\":{\"presence\":\"التأطير الاجتماعي متاح انتقائياً؛ يحضر مع القريبين ويخفّ في المسح الواسع\",\"question\":\"هل توصل عمقك بلغة الجمهور دائماً أم للمقرّبين؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1
