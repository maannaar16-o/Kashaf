e\":\"تحوّل النموذج الخيالي إلى `MVP` يعمل بالمتاح فوراً — الأقدام المادية حاضرة. التشتت مُغطّى من جهة التجسيد\",\"question\":\"حين تصلك فكرة جامحة، هل تُنمذجها بأقل كلفة أم تبقيها تجريداً؟\",\"recommendation\":\"—\",\"source\":\"§2.4 + §4.1/`H-R` (الابتكار المجسّد)\"},\"H-R-L\":{\"presence\":\"تحلّق في فضاء الاحتمالات بلا أقدام مادية؛ التشتت مكشوف من جهة التجسيد — رؤى بلا نموذج يعمل\",\"question\":\"هل تبقى أفكارك في فضاء «ما يمكن أن يكون» دون تجربة ملموسة؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل واقعي يحوّل الفرضية نموذجاً («صانع النماذج الأولية»)\",\"source\":\"§2.4 + `MATRIX-04` §1 + §3.3\"},\"H-R-M\":{\"presence\":\"التجسيد المادي متاح انتقائياً للواعد من الأفكار\",\"question\":\"هل تُنزِل أفكارك للأرض دائماً أم للواعد منها؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`H-R`\"},\"H-S-D\":{\"presence\":\"تعيد تأطير الفكرة الغريبة بلغة مألوفة جذابة يتقبلها السوق — موضة أو ثقافة\",\"question\":\"حين تولّد غريباً، هل تعيد تغليفه للجمهور؟\",\"recommendation\":\"الحذر من «بيع الوهم» (مستحيل `R` أو متناقض `A`)\",\"source\":\"§4.1/`H-S` (الابتكار المسوّق)\"},\"H-S-L\":{\"presence\":\"توليد في العزلة بلا إعادة تأطير؛ الفكرة الغريبة تُستبعَد لأنها «لا تُفهم»\",\"question\":\"هل تُهمَل أفكارك لأنها لم تُصَغ بلغة الجماعة؟\",\"recommendation\":\"تخادم مع عدسة اجتماعية تعيد تأطير الغريب للقبول\",\"source\":\"§4.1/`H-S` (الصدام: التجريد الغريب ⚔️ المعايير الاجتماعية)\"},\"H-S-M\":{\"presence\":\"التسويق متاح انتقائياً للجديد\",\"question\":\"هل تسوّق أفكارك الجديدة أم تُبقيها في العزلة؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`H-S`\"},\"H-St-D\":{\"presence\":\"يخلق شريكك الاستراتيجي مسار التموضع بينما تولّد أنت المفاهيم الصفرية — سيناريوهات كاسرة للبارادايم\",\"question\":\"حين تولّد احتمالاً صفرياً، هل يُفلتر بالمآل والموارد؟\",\"recommendation\":\"الحذر من العمى المشترك (الانفصال عن اللحظة والأرض `R`)\",\"source\":\"§4.1/`H-St` (النماذج المستقبلية)\"},\"H-St-L\":{\"presence\":\"توسيع لكل الاتجاهات بلا فلتر اتجاهي؛ طاقة تتبدد في احتمالات لا تخدم بوصلة\",\"question\":\"هل تُوسّع الاحتمالات دون أن يُغلقها مسار واحد نافع؟\",\"recommendation\":\"تخادم مع عدسة استراتيجية تفلتر الاحتمال إلى مسار\",\"source\":\"§4.1/`H-St` (الصدام: اللامتناهي ⚔️ المسار الحتمي)\"},\"H-St-M\":{\"presence\":\"فلترة المآل متاحة انتقائياً للجريء من الأفكار\",\"question\":\"هل تُخضِع توليدك لبوصلة المآل أحياناً؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`H-St`\"}},\"n\":21},\"O\":{\"blindness\":\"عمى المركز `O` (§2.4 المحايد · مزدوج): (أ) البيروقراطية الصلبة — إنفاذ القالب بعد زوال جدواه (معيار «سلامة التدفق» لا يلتقط تقادم المحتوى)؛ (ب) الجمود عند الكسر — مدخل خارجي بلا وعاء جاهز يُجمّد `O-Gate`. التقادم يغطّيه `St` (المآل) و`H` (بارادايم جديد)، والكسر يغطّيه `R` (الارتجال) و`H` (الحل الصفري)\",\"lines\":{\"O-A-D\":{\"presence\":\"يسبق البناءَ لديك تدقيقٌ منطقي مسبق؛ ثم تُسلَّم الدفة للإغلاق دون مقاطعة — أنظمة إجرائية خالية من الثغرات المنطقية والتشغيلية\",\"question\":\"حين تبني قالباً، هل تتحقق من سلامة أساسه المنطقي قبل الجدولة؟\",\"recommendation\":\"الحذر من العمى المشترك (تصلب مفرط · عجز عن المفاجآت `H` والاستثناء الإنساني `E`)\",\"source\":\"§4.1/`O-A` (العمليات المحسنة)\"},\"O-A-L\":{\"presence\":\"قد يُحرَس الجدول فوق سلامة الأساس المنطقي؛ يُبنى قالب محكم التسلسل فوق أساس خاطئ («أسير روتين فوق أساس خاطئ»)\",\"question\":\"هل يحدث أن تُتقن جدولة عملية أساسها المنطقي غير مفحوص؟\",\"recommendation\":\"تخادم مع عدسة تحليلية تدقّق الأساس قبل بدء البناء («المهندس المعصوم»)\",\"source\":\"§4.1/`O-A` (الصدام: إغلاق المهمة ⚔️ الدقة المطلقة)\"},\"O-A-M\":{\"presence\":\"التدقيق المنطقي المسبق متاح انتقائياً؛ تفحص أساس النظم الكبرى وتبني الصغرى مباشرة\",\"question\":\"هل تفحص منطق كل قالب قبل بنائه أم الكبير منه؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`O-A`\"},\"O-C-D\":{\"presence\":\"هيكلك الحديث يُراجَع بلوائح الأمان ويُطابَق بالسابقة فيتأسس «معيار حديث موثوق» — هياكل توثيقية تسيّر كيانات لعقود؛ لكن انتبه لتوتر «الأكفأ الحديث ضد الأقدم المُجرَّب»\",\"question\":\"حين تصمّم نظاماً أكفأ، هل تراجع مخاطره بلوائح الأمان قبل التعميم؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`O-C` (التحديث الآمن) + §4.2 (صدام داخل معسكر الاستقرار)\"},\"O-C-L\":{\"presence\":\"الهيكل الأكفأ قد يُعمَّم دون مراجعة سابقة/أمان؛ نظام حديث غير مختبر ينسف إرثاً موثوقاً\",\"question\":\"هل تُعمّم نظاماً جديداً كفؤاً قبل اختبار مخاطره على الموروث؟\",\"recommendation\":\"تخادم مع عدسة محافظة تراجع مخاطر الجديد وتطابقه بلوائح الأمان («قلعة الكفاءة المؤسسية»)\",\"source\":\"§4.1/`O-C` (الصدام: الهندسة الأكفأ ⚔️ التقاليد الموروثة)\"},\"O-C-M\":{\"presence\":\"مراجعة السابقة متاحة انتقائياً؛ تختبر الجديد الجوهري وتُعمّم الباقي مباشرة\",\"question\":\"هل تُخضِع أنظمتك الجديدة لمراجعة أمان دائماً أم في الحساس؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`O-C`\"},\"O-E-D\":{\"presence\":\"يُعاد هندسة العبء والجداول وفق السعة الوجدانية الحقيقية للفريق دون التنازل عن الهدف — تدفقات تحمي الطاقة النفسية دون إخلال بالتسليم\",\"question\":\"حين توزّع الأعباء، هل تقرأ السعة الوجدانية الفعلية للأفراد؟\",\"recommendation\":\"الحذر من العمى المشترك (إفراط في حماية الراحة على حساب الرؤية `St` والسوق `R`)\",\"source\":\"§4.1/`O-E` (الهيكلة الرحيمة)\"},\"O-E-L\":{\"presence\":\"يُوزَّع البشر تروساً على المخطط دون قراءة سعتهم الوجدانية أولاً؛ محور الطاقة النفسية ليس في أولوية الفلترة (بنيوي — لا «توحّش إداري» كحكم)\",\"question\":\"هل توزّع المهام حسب المخطط أكثر من قراءة طاقة من يحملها؟\",\"recommendation\":\"تخادم مع عدسة تفهّم تقيّم السعة الوجدانية، وتعيد أنت هندسة العبء وفقها («مهندس السعة الوجدانية»)\",\"source\":\"§4.1/`O-E` (الصدام: الخريطة الإجرائية ⚔️ الاحتياج النفسي) + قفل §0.1\"},\"O-E-M\":{\"presence\":\"قراءة السعة الوجدانية متاحة انتقائياً؛ تراعيها في الأحمال الثقيلة وتوزّع الباقي على المخطط\",\"question\":\"هل تراعي طاقة الأفراد النفسية دائماً أم عند الضغط الشديد؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`O-E`\"},\"O-H-D\":{\"presence\":\"عدستك التوليدية حاضرة بقوة؛ تستشعر تقادم القالب وتقدر على كسره إلى بارادايم جديد، وأمام الأزمة الصفرية تملك جواباً توليدياً داخلياً — «مهندس الابتكار الممأسس». العميان مُغطّيان داخلياً من جهة التوليد\",\"question\":\"حين يتقادم قالب أو تنكسر قاعدة، هل يخطر لك بديل توليدي تلقائياً؟\",\"recommendation\":\"لا فجوة من جهة التوليد؛ الانتباه لتوتر `H↔O` (توليد لا نهائي ضد إغلاق خطي)\",\"source\":\"§2.4/(أ)+(ب) + §4.1/`O-H` (الهندسة المرحلية) + §3.1\"},\"O-H-L\":{\"presence\":\"لا كسر توليدي داخلي؛ العميان مكشوفان — يُنفَّذ القالب بعد زوال جدواه، وتُجمّد الأزمة الصفرية `O-Gate` بمدخل بلا وعاء\",\"question\":\"هل تظل تطبّق نظاماً بعد أن تجاوزه الواقع، أو تتجمّد أمام موقف لا قالب له؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل ابتكار (هو يولّد البارادايم/الحل الصفري، وأنت تبني سقالات تشغيله: «مهندس الابتكار الممأسس»)\",\"source\":\"§2.4/(أ)+(ب) + `MATRIX-04` §1 (مُغطّي `H`) + §3.3\"},\"O-H-M\":{\"presence\":\"كسر القالب متاح انتقائياً؛ تولّد البديل عند الأزمات الوجودية وتُبقي القالب القائم افتراضياً\",\"question\":\"حين يلزم حل غير مسبوق، هل يأتيك تلقائياً أم بعد استحثاث؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`O-H`\"},\"O-R-D\":{\"presence\":\"مرونة الميدان حاضرة؛ حين ينكسر القالب تُرتجل مساراً بمعطيات الأرض عبر مسار طوارئ رشيق — «التشغيل الرشيق». عمى الجمود مُغطّى داخلياً\",\"question\":\"حين يفاجئك موقف خارج القالب، هل تعدّل بمعطيات اللحظة أم تتجمّد؟\",\"recommendation\":\"لا فجوة من جهة الكسر؛ الانتباه لتوتر `R↔O` (تكتيك لحظي ضد تسلسل مكتوب)\",\"source\":\"§2.4/(ب) + §4.1/`O-R` (التشغيل الرشيق) + §3.1\"},\"O-R-L\":{\"presence\":\"لا مرونة ميدانية داخلية؛ عمى الجمود مكشوف — الكسر الخارجي يُجمّد `O-Gate` (مدخل بلا وعاء جاهز) بلا ارتجال معوّض\",\"question\":\"هل يوقفك الموقف الذي لا قالب جاهز له حتى يُبنى قالبه؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل واقعي يُفوَّض قوة تدخل سريع للاستثناءات على خط أساسك المستقر («آلة الإنجاز الميدانية»)\",\"source\":\"§2.4/(ب) + `MATRIX-04` §1 (مُغطّي `R`) + §3.3\"},\"O-R-M\":{\"presence\":\"الارتجال متاح انتقائياً؛ تعدّل في الاستثناءات الحرجة وتلتزم القالب في المعتاد\",\"question\":\"هل تملك مساراً للطوارئ خارج القالب أم تلتزمه دائماً؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`O-R`\"},\"O-S-D\":{\"presence\":\"تُصمَّم القواعد بصرامة في الخلفية وتُسوّقها واجهة اجتماعية للفريق دون صدام — جداول قاسية بلا تذمر أو تمرد جماعي\",\"question\":\"حين تفرض جدولاً صارماً، هل تهيّئ قبول الفريق له؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`O-S` (إدارة التغيير الإجرائي)\"},\"O-S-L\":{\"presence\":\"يُفرَض الجدول دون تسويق اجتماعي؛ قد يُقرأ «روبوتاً جافاً منفّراً» فتظهر مقاومة جماعية كان يمكن تفاديها\",\"question\":\"هل تفرض القاعدة الصحيحة فتصطدم بمقاومة بشرية لغياب تهيئتها؟\",\"recommendation\":\"تخادم مع عدسة اجتماعية تسوّق القالب للفريق («منسّق التغيير الهيكلي»)\",\"source\":\"§4.1/`O-S` (الصدام: الجدول الصارم ⚔️ التوافق المرن)\"},\"O-S-M\":{\"presence\":\"التسويق الاجتماعي للقالب متاح انتقائياً؛ تهيّئ القبول للتغييرات الكبرى وتفرض الصغرى مباشرة\",\"question\":\"هل تسوّق قواعدك للفريق دائماً أم في الكبير منها؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`O-S`\"},\"O-St-D\":{\"presence\":\"بوصلة المآل حاضرة؛ ترصد اقتراب تقادم القالب فتتقاعده قبل أن يتعفّن — `St` يرسم الوجهة و`O` يرصف الطريق. عمى التقادم مُغطّى داخلياً من جهة التوقيت\",\"question\":\"حين تُحكم نظاماً، هل تسأل «إلى متى يظل صالحاً؟» تلقائياً؟\",\"recommendation\":\"لا فجوة من جهة التوقيت؛ الانتباه لتوتر `St↔O` (وجهة كبرى ضد تفصيل السلم)\",\"source\":\"§2.4/(أ) + §4.1/`O-St` (تمهيد الطريق) + §3.1\"},\"O-St-L\":{\"presence\":\"المآل غائب عن أولويتك؛ عمى التقادم مكشوف — يُنفَّذ القالب بمعيار سلامة التدفق دون التقاط أن محتواه تجاوزه الزمن\",\"question\":\"هل تحرس انسياب النظام دون ملاحظة أنّ غرضه لم يعد قائماً؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل استشراف يرصد تقادم القالب ويحدد وقت تقاعده («معبّد الطرق»)\",\"source\":\"§2.4/(أ) + `MATRIX-04` §1 (مُغطّي `St`) + §3.3\"},\"O-St-M\":{\"presence\":\"رصد صلاحية القالب متاح انتقائياً؛ تراجع النظم الكبرى وتترك الصغرى لجمودها\",\"question\":\"هل تراجع صلاحية قوالبك دورياً أم عند تعطّلها فقط؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`O-St`\"}},\"n\":21},\"R\":{\"blindness\":\"عمى المركز `R` (§2.4 المحايد · ثلاثي): فلترة «الآن المادي» لا تلتقط الجذر (فتُحلّ السطوح وتتراكم الترقيعات) ولا المآل البعيد (فيسقط الغد من الحساب). العدستان اللتان تسدّان هذا هما `A` (حفر الجذر السببي) و`St` (تلسكوب المآل). قطب `R` هو `St` نفسه — فالتغطية هنا تشمل العلاقة القطبية\",\"lines\":{\"R-A-D\":{\"presence\":\"عدسة الجذر لديك حاضرة بقوة إلى جانب سرعتك الميدانية؛ تحتوي الأزمة فوراً وتصمّم في الخلفية حلّها الجذري — لا ترقيعاً يتكرر بل «إصلاح نهائي دون تعطيل الحركة». عمى السطحية مُغطّى داخلياً\",\"question\":\"حين تحلّ مشكلة عاجلة، هل تلاحقها ذاتياً حتى جذرها أم يكفيك احتواؤها الآن؟\",\"recommendation\":\"لا فجوة على محور الجذر؛ الانتباه لتوتر `A↔R` (لماذا حدث؟ ضد ماذا الآن؟)\",\"source\":\"§2.4 (محايد) + §4.1/`R-A` (البراغماتية المنطقية / المحسّن التشغيلي) + §3.1\"},\"R-A-L\":{\"presence\":\"لا مرساة جذر داخلية؛ عمى السطحية مكشوف — تتراكم حلول الاحتواء دون معالجة معمارية، فتتكرر المشكلة نفسها بوجوه مختلفة\",\"question\":\"هل تعود المشكلة ذاتها كثيراً رغم حلّها في كل مرة؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل تحليل (تحتوي أنت الأزمة فوراً، وهو يصمّم الجذر في الخلفية: «المحسّن التشغيلي»)\",\"source\":\"§2.4 + `MATRIX-04` §1 (مُغطّي `A`) + §3.3\"},\"R-A-M\":{\"presence\":\"الحفر الجذري متاح انتقائياً؛ تلاحق جذر الأزمات الكبرى وتكتفي بالاحتواء في الأصغر\",\"question\":\"هل تصل لجذر كل مشكلة أم للجسيمة منها؟\",\"recommendation\":\"جعل «ما جذر هذا؟» سؤالاً بعد كل احتواء يثبّت الغطاء\",\"source\":\"§3.2 + §4.1/`R-A`\"},\"R-C-D\":{\"presence\":\"تشغيلك اليومي داخل التزام آمن؛ تختبر البديل في بيئة معزولة ثم يُحوَّل سابقةً معتمدة — كفاءة فورية والتزام 100%\",\"question\":\"حين تبتكر إجراءً، هل تمرّره عبر بوابة اعتماد قبل تعميمه؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`R-C` (الاختراق الآمن)\"},\"R-C-L\":{\"presence\":\"التشغيل الفوري قد يمضي دون سابقة أو لائحة؛ تبتكر إجراءات غير معتمدة لأن معيارك «ما يصلح اليوم» لا «ما جُرّب بالأمس»\",\"question\":\"هل تتجاوز الإجراءات المعتمدة أحياناً لأنها تبطئ حلّ اليوم؟\",\"recommendation\":\"تخادم مع عدسة محافظة تصوغ بروتوكول تحويل بدائلك سابقةً معتمدة («الحارس التشغيلي الآمن»)\",\"source\":\"§4.1/`R-C` (الصدام: التشغيل الفوري ⚔️ السابقة واللائحة)\"},\"R-C-M\":{\"presence\":\"الاحتكام للائحة متاح انتقائياً؛ تلتزم المعتمد في الحرج وتُجرّب المتاح في اليومي\",\"question\":\"هل تراجع اعتماد إجراءاتك دائماً أم في الحساس منها؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`R-C`\"},\"R-E-D\":{\"presence\":\"تدخّلك المادي مترجَم عن جذر إنساني حقيقي؛ يُشخَّص المانع الوجداني للإنتاجية ثم تصمّم له حوافز وأدوات ملموسة تقي من الاحتراق\",\"question\":\"حين يتعثّر أداء فرد، هل تبحث عن جذره الإنساني أم عن بديل مادي فقط؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`R-E` (الإمداد والاحتواء)\"},\"R-E-L\":{\"presence\":\"يُعالَج البشر كعناصر تُضبط أو تُستبدَل؛ محور الاحتراق والدافع الداخلي ليس في أولوية الفلترة (بنيوي — لا حكم قسوة)\",\"question\":\"هل تميل لاستبدال العنصر المتعثّر أسرع من البحث عن جذر تعثّره الإنساني؟\",\"recommendation\":\"تخادم مع عدسة تفهّم تشخّص الجذر، وتترجمه أنت تدخلاً مادياً («المسعف الميداني»)\",\"source\":\"§4.1/`R-E` (الصدام: التروس الآلية ⚔️ الكيان النفسي) + قفل التفسير §0.1\"},\"R-E-M\":{\"presence\":\"قراءة الجذر الإنساني متاحة انتقائياً؛ تحضر مع أثر مباشر على الإنتاج وتخفّ في غيره\",\"question\":\"هل تربط تعثّر الأداء بجذره الإنساني دائماً أم عند وضوح أثره؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`R-E`\"},\"R-H-D\":{\"presence\":\"تحوّل الفكرة الكاسرة إلى نموذج أولي يعمل بالمتاح؛ تقلّم خيال الشريك إلى `MVP` بأقل كلفة — الابتكار مُجسّد لا مجرّد\",\"question\":\"حين تصلك فكرة جريئة، هل تسارع لتجريبها بنموذج بسيط أم تنفر من تجريدها؟\",\"recommendation\":\"الحذر من العمى المشترك (فوضى إجرائية وكراهية التوثيق `O`، ورفض الامتثال `C`)\",\"source\":\"§4.1/`R-H` (الابتكار المجسّد)\"},\"R-H-L\":{\"presence\":\"تعالج الملموس والقيود؛ فضاء الاحتمال الغريب خارج أولويتك، وقد يُقرأ الجديد «مضيعة وقت» قبل فحصه (الصدام: ما هو كائن ⚔️ ما يمكن أن يكون)\",\"question\":\"هل تنفر من الأفكار التجريدية قبل رؤية جدواها المادية الفورية؟\",\"recommendation\":\"تخادم مع عدسة تصورية تولّد، وتُجسّد أنت الناتج نموذجاً («صانع النماذج الأولية»)\",\"source\":\"§4.1/`R-H`\"},\"R-H-M\":{\"presence\":\"تجسيد الأفكار الجديدة متاح انتقائياً؛ تُنمذج الواعد منها وتُبقي معظم عملك في الملموس القائم\",\"question\":\"هل تتبنّى تجريب الأفكار الجديدة أم تفضّل المعطى الحالي غالباً؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`R-H`\"},\"R-O-D\":{\"presence\":\"تكتيكك اللحظي يجري على خط أساس مستقر؛ تُفوَّض كقوة تدخل سريع للاستثناءات ضمن مسار طوارئ معتمد — إنجاز ميداني بهدر يؤول للصفر\",\"question\":\"حين تعدّل بمعطيات الأرض، هل تفعل ذلك داخل نظام ثابت أم بلا خط أساس؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`R-O` (التشغيل الرشيق)\"},\"R-O-L\":{\"presence\":\"التكتيك اللحظي قد يجري بلا تسلسل مكتوب؛ تعديل مستمر بمعطيات الأرض دون جدول ثابت (الصدام: التكتيك ⚔️ التسلسل) — والعمى المشترك مآلي (`St`، `H`)\",\"question\":\"هل يجري عملك بارتجال متصل يصعب معه توثيق تسلسل ثابت؟\",\"recommendation\":\"تخادم مع عدسة تنظيم تبني خط الأساس، وتتحرك أنت في استثناءاته («آلة الإنجاز الميدانية»)\",\"source\":\"§4.1/`R-O`\"},\"R-O-M\":{\"presence\":\"الالتزام بالتسلسل المكتوب متاح انتقائياً؛ تحترم الجدول في المسارات الكبرى وتُرجّح التكتيك في الاستثناء\",\"question\":\"هل تلتزم بالجداول المسبقة دائماً أم عند الضرورة؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`R-O`\"},\"R-S-D\":{\"presence\":\"تحدّد الخط الأحمر المادي ويناور شريكك داخله لخلق نفوذ؛ تُحرَّك الشبكات لجلب موارد فورية على الأرض\",\"question\":\"حين تؤمّن مورداً، هل توظّف العلاقات لخدمته أم تكتفي بالأداة المادية؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`R-S` (التشغيل الدبلوماسي)\"},\"R-S-L\":{\"presence\":\"المخرجات المادية تُقدَّم دون رعاية الشبكة؛ قد تخسر حلفاء بقسوة الأداة (الصدام: المخرجات المادية ⚔️ شبكات العلاقات) — العمى المشترك نفعية لحظية وتجاهل مآلات التحالف (`St`)\",\"question\":\"هل يحدث أن تحقق الهدف المادي وتخسر معه علاقات كان يمكن صونها؟\",\"recommendation\":\"تخادم مع عدسة اجتماعية تناور داخل خطك الأحمر المادي («المشغّل التوافقي»)\",\"source\":\"§4.1/`R-S`\"},\"R-S-M\":{\"presence\":\"توظيف الشبكة متاح انتقائياً؛ تستدعيه في الصفقات الكبرى وتعتمد الأداة المادية في اليومي\",\"question\":\"هل تدمج العلاقات في تأمين مواردك أم في الكبير منها؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`R-S`\"},\"R-St-D\":{\"presence\":\"تلسكوب المآل حاضر بقوة؛ تطفئ حرائق اليوم وأنت ماسك للخريطة نحو الأفق — «المنفذ الرؤيوي» يسدّ فجوة حلم الغد وأزمة اليوم. عمى تجهيل المستقبل مُغطّى داخلياً\",\"question\":\"حين تحسم أزمة اليوم، هل تزن أثرها على مسار الغد تلقائياً؟\",\"recommendation\":\"لا فجوة؛ الانتباه لتوتر `St↔R` القطبي (تموضع الغد ضد عائد اليوم)\",\"source\":\"§2.4 + §4.1/`R-St` (الرؤية الممكّنة مادياً) + §3.1\"},\"R-St-L\":{\"presence\":\"المآل البعيد غائب عن أولويتك؛ عمى سقوط الغد مكشوف — قد تُقاد ببراعة نحو حلٍّ فوري يراكم ثمناً مستقبلياً غير مرصود\",\"question\":\"هل يحدث أن حلولك الناجحة اليوم تُنتج مشكلات لم تكن في الحسبان لاحقاً؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل استشراف يرسم الخريطة بينما تمسك أنت المقود («المنفذ الرؤيوي»)\",\"source\":\"§2.4 + `MATRIX-04` §1 (مُغطّي `St`) + §3.3\"},\"R-St-M\":{\"presence\":\"رصد المآل متاح انتقائياً؛ تستحضره في القرارات المصيرية بينما تحكم الفلترة الأولى «الآن المادي»\",\"question\":\"هل يحضر سؤال «وأثر هذا على الغد؟» تلقائياً أم عند الكبير فقط؟\",\"recommendation\":\"ربط كل حل فوري بأثره على المآل يثبّت الغطاء\",\"source\":\"§3.2 + §4.1/`R-St`\"}},\"n\":21},\"S\":{\"blindness\":\"عمى المركز `S` (§2.4 المحايد): معيار «الانسجام والقبول» لا يلتقط كلفة تمييع الحقيقة؛ فيُضحّى بالصواب المنطقي (`A`) والقرار الحاسم/المآل (`St`) حفاظاً على رضا المجموع. العدستان اللتان تحرسان هذا الصامت هما `A` (الحقيقة الصلبة) و`St` (القرار والمآل)\",\"lines\":{\"S-A-D\":{\"presence\":\"حرص الانسجام لديك مسنود بمرساة حقيقة صلبة؛ تُوصل الرسالة كاملةً بأسلوب مقبول دون أن تنحت من دقتها — «تُقال الحقيقة، لا تُميَّع». عمى تمييع الحقيقة مُغطّى داخلياً\",\"question\":\"حين تُلطّف خبراً، هل يبقى مضمونه دقيقاً أم يذوب مع التلطيف؟\",\"recommendation\":\"توأمة `A↔S` قوية؛ الحذر من إغفال الاحتواء النفسي للمتضررين (`E`) — العمى المشترك المسجَّل\",\"source\":\"§2.4 (محايد) + §4.1/`S-A` (الدبلوماسية الحادة / المقنع الدبلوماسي) + §3.1\"},\"S-A-L\":{\"presence\":\"لا مرساة حقيقة صلبة داخلية؛ عمى التمييع مكشوف — قد يُنحَت من الصواب زاوية هنا وأخرى هناك لإرضاء كل حاضر حتى يصل الجميع راضين إلى استنتاج لم يعد دقيقاً\",\"question\":\"هل يحدث أن يخرج الجميع راضين عن رأيٍ لم يعد يطابق الحقيقة كما تعرفها؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل تحليل مرتفع (هو يصوغ النقد الصلب، وأنت تغلّفه وتوصله: «المقنع الدبلوماسي»)، لا بإطفاء حسّك بالانسجام\",\"source\":\"§2.4 + `MATRIX-04` §1 (مُغطّي `A`) + §3.3\"},\"S-A-M\":{\"presence\":\"فحص دقة المضمون متاح انتقائياً؛ تصونه في القرارات الكبرى بينما قد تُغلّب الرضا في اللحظات الأصغر\",\"question\":\"هل تتأكد من بقاء الحقيقة دقيقة دائماً بعد التلطيف، أم في المهم فقط؟\",\"recommendation\":\"جعل «هل ظلّ المضمون دقيقاً؟» سؤالاً افتراضياً يثبّت الغطاء\",\"source\":\"§3.2 + §4.1/`S-A`\"},\"S-C-D\":{\"presence\":\"يُفرَض الالتزام بضغط اجتماعي إيجابي لا تهديد؛ تحرس التقاليد وتبلّغ الرفض بما يحفظ العلاقة — امتثال بلا قطيعة\",\"question\":\"حين تحمي قاعدة، هل تُنفّذها بأسلوب يكسب القبول أم يفرضها بحدّها؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`S-C` (الحزم الدبلوماسي)\"},\"S-C-L\":{\"presence\":\"قد تُكيَّف القواعد استرضاءً للشبكة حتى الاستثناء الضار؛ يغيب حارس نزاهة القاعدة الداخلي\",\"question\":\"هل تميل لثني قاعدة أو منح استثناء حفاظاً على علاقة أكثر من صون مبدئها؟\",\"recommendation\":\"تخادم مع عدسة محافظة تحرس نزاهة القاعدة بينما تُبلّغ أنت دبلوماسياً («الدبلوماسي الحافظ»)\",\"source\":\"§4.1/`S-C` (الصدام: الاستثناء الاجتماعي ⚔️ القاعدة العمياء)\"},\"S-C-M\":{\"presence\":\"الحس المرجعي متاح انتقائياً؛ تصون القاعدة حين تراها جوهرية وتُليّنها للشبكة أحياناً\",\"question\":\"هل تحرس نزاهة القاعدة أم تكيّفها استرضاءً للحاضرين؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`S-C`\"},\"S-E-D\":{\"presence\":\"رادارك الأفقي مسنود بعدسة عمق مستقلة عالية؛ تعدّل خطابك ليلبّي الاحتياج النفسي الحقيقي للأفراد لا انسجام السطح فقط — تحالفات يصعب اختراقها\",\"question\":\"حين تكسب شخصاً، هل تخاطب حاجته الدفينة أم قبوله الظاهر؟\",\"recommendation\":\"توأمة قطبية عالية القيمة؛ الحذر من العمى المشترك (الحقائق المادية `R` والمنطقية `A`)\",\"source\":\"§4.1/`S-E` (النفوذ العميق)\"},\"S-E-L\":{\"presence\":\"تقرأ اتساع الشبكة لا عمق الفرد؛ تلحظ مناخ المجموع وتترك القاع النفسي لغيرك. هذا حدّ عدسة `S` الطبيعي، لا نقص تعاطف — العمق ملف `E` مستقل\",\"question\":\"هل تجيد قراءة مزاج القاعة أكثر من سبر همّ فردٍ بعينه؟\",\"recommendation\":\"حين يلزم عمق فردي، تخادم مع حامل عدسة تفهّم — لا يُقرأ الحدّ ضعفاً\",\"source\":\"§4.1/`S-E` (الصدام: التوافق الظاهري ⚔️ الأصالة العميقة) + قفل §3.1\"},\"S-E-M\":{\"presence\":\"قراءة العمق الفردي متاحة انتقائياً؛ تحضر مع القريبين وتغيب في المسح الواسع\",\"question\":\"هل تلتقط الاحتياج الدفين لكل فرد أم للمقرّبين فقط؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`S-E`\"},\"S-H-D\":{\"presence\":\"تعيد تأطير الفكرة الغريبة بلغة مألوفة جذابة يتقبلها السوق؛ تحوّل اللامتوقع إلى موضة أو ثقافة مقبولة\",\"question\":\"حين تلقى فكرة غير مألوفة، هل تعيد تغليفها للجمهور أم تنفر منها؟\",\"recommendation\":\"الحذر من «بيع الوهم»: فكرة مقبولة اجتماعياً لكنها مستحيلة `R` أو متناقضة `A` (العمى المشترك)\",\"source\":\"§4.1/`S-H` (الابتكار المسوّق)\"},\"S-H-L\":{\"presence\":\"تعمل ضمن الإطار المقبول للجماعة؛ الجديد الغريب قد يُستبعد لأنه «لا يُفهم» لا لأنه خاطئ (الصدام: المعايير الاجتماعية ⚔️ التجريد الغريب)\",\"question\":\"هل تنفر من الأفكار الغريبة قبل فحصها لأنها خارج المألوف الجماعي؟\",\"recommendation\":\"تخادم مع عدسة تصورية تولّد، وأنت تعيد تأطيرها للقبول («مسوّق البارادايم»)\",\"source\":\"§4.1/`S-H`\"},\"S-H-M\":{\"presence\":\"إعادة التأطير متاحة انتقائياً؛ تسوّق بعض الجديد وتُبقي معظمك ضمن الإطار المقبول\",\"question\":\"هل تتبنّى تسويق الأفكار الجديدة أم تختار المألوف غالباً؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`S-H`\"},\"S-O-D\":{\"presence\":\"يقترن قبولك بهيكل منضبط؛ تُطبَّق الجداول الصارمة بشعور انتماء لا ديكتاتورية — انضباط بلا تمرد جماعي\",\"question\":\"حين تُدير مجموعة، هل تصونها بجدول واضح أم بالمرونة التفاعلية وحدها؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`S-O` (إدارة التغيير الإجرائي)\"},\"S-O-L\":{\"presence\":\"تفاعلك قد يمدّ الزمن على حساب الجدول؛ حرارة اللقاء تُقدَّم على انضباط الخطة، فتُهدَر الدقائق (الصدام: التوافق المرن ⚔️ الجدول الصارم)\",\"question\":\"هل يجرفك التفاعل أحياناً بعيداً عن جدول اللقاء وحدوده الزمنية؟\",\"recommendation\":\"مساحات حرة مبرمجة داخل جدول يضعه شريك تنظيمي («منسّق التغيير الهيكلي»)\",\"source\":\"§4.1/`S-O`\"},\"S-O-M\":{\"presence\":\"البنية الإجرائية متاحة انتقائياً؛ تُقنّن اللقاءات الكبرى وتترك الأصغر للتفاعل الحر\",\"question\":\"هل تحكم لقاءاتك بجدول دائماً أم في المهم فقط؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`S-O`\"},\"S-R-D\":{\"presence\":\"شبكتك تُحرَّك لجلب موارد ملموسة؛ تهندس تنفيذ الخطوة المادية القاسية سياسياً فتتجنب ردات الفعل — نفوذ يُنتج على الأرض\",\"question\":\"هل تُترجم علاقاتك إلى مخرجات مادية أم تبقى تحالفات بلا حصاد؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`S-R` (التشغيل الدبلوماسي)\"},\"S-R-L\":{\"presence\":\"بناء الشبكة قد يجري بلا رسوّ مادي؛ نفوذ ومجاملات دون مخرج ملموس، وخطر إهدار الموارد في العلاقة لذاتها (العمى المشترك: نفعية لحظية، تجاهل مآلات `St` وثغرات `A`/`C`)\",\"question\":\"هل تنتهي بعض تحالفاتك بلا ناتج مادي واضح؟\",\"recommendation\":\"تخادم مع عدسة واقعية تربط النفوذ بعائد على الأرض («المشغّل التوافقي»)\",\"source\":\"§4.1/`S-R` (الصدام: الشبكات ⚔️ المخرجات المادية)\"},\"S-R-M\":{\"presence\":\"التجسيد المادي متاح انتقائياً؛ بعض تحالفاتك يُثمر موارد وبعضها يبقى علاقةً لذاتها\",\"question\":\"كم من شبكتك مربوط بعائد ملموس مقابل علاقة خالصة؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`S-R`\"},\"S-St-D\":{\"presence\":\"إجماع اليوم لديك تابع لمآل الغد؛ تدير حملة القبول لتغيير تعرف أنه ضروري لا لتغيير يرضي الحاضر فقط — «مهندس التحول الناعم». عمى تضحية المآل مُغطّى\",\"question\":\"حين تسعى للإجماع، هل يخدم وجهةً مستقبلية محددة أم رضا اللحظة؟\",\"recommendation\":\"لا فجوة؛ الانتباه لإدارة توتر `St↔S` (المسار المصيري ضد إجماع اللحظة)\",\"source\":\"§2.4 + §4.1/`S-St` (هندسة التغيير / قائد الجماهير) + §3.1\"},\"S-St-L\":{\"presence\":\"المآل البعيد غائب عن أولويتك؛ عمى «إجماع اليوم على حساب مسار الغد» مكشوف — قد يُبنى قبولٌ حاضر يعرقل تحولاً ضرورياً\",\"question\":\"هل تميل لتفضيل ما يجمع الناس اليوم حتى لو أخّر قراراً مصيرياً؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل استشراف (هو يرسم التحول الحتمي، وأنت تدير قبوله الداخلي: «قائد الجماهير»)\",\"source\":\"§2.4 + `MATRIX-04` §1 (مُغطّي `St`) + §3.3\"},\"S-St-M\":{\"presence\":\"رصد المآل متاح انتقائياً؛ تستحضره في المنعطفات الكبرى بينما تحكم الفلترة الأولى قراءةُ القبول\",\"question\":\"هل يحضر سؤال «إلى أين يقودنا هذا الإجماع؟» تلقائياً أم عند القرارات المصيرية؟\",\"recommendation\":\"ربط حملات القبول بوجهة معلنة يثبّت الغطاء\",\"source\":\"§3.2 + §4.1/`S-St`\"}},\"n\":21},\"St\":{\"blindness\":\"عمى المركز `St` (§2.4 المحايد): الفلترة على مقياس المآل الكلي لا تلتقط أزمة اليوم واللحظة؛ فقد تنجح المنظومة اليوم وتُفاجأ بالغد، أو يُقاد ببراعة نحو هاوية سيولة آنية. العدستان اللتان تمسكان الحاضر هما `R` (الميدان والسيولة الآنية) و`O` (التفاصيل والخطوات اليومية)\",\"lines\":{\"St-A-D\":{\"presence\":\"رؤيتك مختبَرة رياضياً؛ ترسم البوصلة ثم تُجري هندسة عكسية تختبر متانة كل جسر خطوةً خطوة — مسارات ممتدة مبرهَنة ضد الفشل\",\"question\":\"حين تطرح مساراً، هل تسنده بأدلة صارمة أم بحدس النمط الكلي؟\",\"recommendation\":\"الحذر من العمى المشترك (الجفاف الإنساني `S`/`E` وصعوبة القوالب اليومية `O`)\",\"source\":\"§4.1/`St-A` (الرؤية المحققة)\"},\"St-A-L\":{\"presence\":\"قد تقفز للاستنتاج الكلي بلا فحص مجهري صارم؛ يُرصد النظام كله وتفوت متانة المتغير الواحد\",\"question\":\"هل تصل أحياناً لاستنتاج بعيد المدى قبل التحقق التفصيلي من أركانه؟\",\"recommendation\":\"تخادم مع عدسة تحليلية تختبر الجسور قبل العبور («الرؤية المحققة»)\",\"source\":\"§4.1/`St-A` (الصدام: الرصد الكلي ⚔️ الفحص المجهري)\"},\"St-A-M\":{\"presence\":\"الفحص المجهري متاح انتقائياً؛ تختبر المتغيرات الحرجة بصرامة وتترك غيرها للنمط\",\"question\":\"هل تُخضِع كل مسار للفحص الدقيق أم الحرج منه؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`St-A`\"},\"St-C-D\":{\"presence\":\"تحوّلك الكبير مسنود بشبكة أمان تحمي الأصول والذاكرة المؤسسية أثناء الرحلة — تغيير دون فقدان الهوية\",\"question\":\"حين تقود تحولاً، هل تصون معه الأصول القائمة تلقائياً؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`St-C` (التحول الآمن)\"},\"St-C-L\":{\"presence\":\"المسار المستقبلي قد يمضي بلا مرساة تاريخية تحمي الأصول؛ رهانٌ على الغد دون شبكة أمان للموروث القائم\",\"question\":\"هل تميل لرهان مستقبلي كبير دون خطة لحماية الأصول القائمة أثناءه؟\",\"recommendation\":\"تخادم مع عدسة محافظة تصمّم شبكة الأمان أثناء التحول («باني الإمبراطوريات المستدامة»)\",\"source\":\"§4.1/`St-C` (الصدام: النظر للأمام ⚔️ النظر للخلف)\"},\"St-C-M\":{\"presence\":\"حس صون الأصول متاح انتقائياً؛ تحمي الجوهري أثناء التحول وتقبل مخاطرة محسوبة في غيره\",\"question\":\"هل توازن كل رهان مستقبلي بحماية أصلٍ قائم، أم في الكبير فقط؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`St-C`\"},\"St-E-D\":{\"presence\":\"جراحات تغييرك الكبرى تعبر بأقل كلفة بشرية؛ تتخذ قرار التحول وتُصمَّم معه شبكة أمان نفسي وتأهيلي للمتضررين\",\"question\":\"حين يتطلب المسار تضحية، هل تُرفق بها معالجةً لأثرها على الأفراد؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`St-E` (التحول الرحيم)\"},\"St-E-L\":{\"presence\":\"نجاة الكل قد تُقدَّم دون رصد معاناة الجزء؛ محور كلفة الفرد ليس في أولوية الفلترة (بنيوي — لا «معاملة البشر كأحجار» كحكم)\",\"question\":\"هل يغيب عنك أحياناً الأثر الفردي وأنت تحمي المنظومة ككل؟\",\"recommendation\":\"تخادم مع عدسة تفهّم تصمّم شبكة الأمان النفسي للمتضررين («التحول الرحيم»)\",\"source\":\"§4.1/`St-E` (الصدام: الماكرو ⚔️ الفرد) + قفل التفسير §0.1\"},\"St-E-M\":{\"presence\":\"مراعاة كلفة الفرد متاحة انتقائياً؛ تحضر في التحولات الكبرى وتخفّ في الأصغر\",\"question\":\"هل تلحظ أثر القرار على الأفراد دائماً أم في الجسيم منه؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`St-E`\"},\"St-H-D\":{\"presence\":\"يخلق شريكك التصوري المفاهيم الصفرية، وتُسقط أنت عليها الموارد والقيود لترسم مسار التموضع — سيناريوهات كاسرة للبارادايم تعيد صياغة السوق قبل سنوات\",\"question\":\"حين تصلك فكرة صفرية غريبة، هل تفلترها إلى مسار ممكن أم تنفر منها؟\",\"recommendation\":\"الحذر من العمى المشترك (الانفصال عن الأرض واللحظة `R`)\",\"source\":\"§4.1/`St-H` (النماذج المستقبلية)\"},\"St-H-L\":{\"presence\":\"تصفّي البدائل ضمن المآلات الممكنة دون توليد قفزات صفرية؛ هذا حدّ طبيعة `St` الفلترية، لا نقص إبداع (الإبداع ملف `H` مستقل)\",\"question\":\"هل تعمل ضمن الاحتمالات القائمة وتندر عندك القفزة خارج المألوف كلياً؟\",\"recommendation\":\"تخادم مع عدسة تصورية تولّد المفاهيم الصفرية، وتفلترها أنت للمسار («مهندس النماذج المستقبلية»)\",\"source\":\"§4.1/`St-H` (الصدام: التموضع ⚔️ الفضاء المفتوح) + قفل `St≠H`\"},\"St-H-M\":{\"presence\":\"فلترة الاحتمال الصفري متاحة انتقائياً؛ تسقط القيود على الجريء منه وتبقى ضمن المآلات المألوفة غالباً\",\"question\":\"هل تُخضِع الأفكار الجذرية لفلترة المآل أم تتجنبها؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`St-H`\"},\"St-O-D\":{\"presence\":\"رؤيتك الكبرى تُنزَّل إلى خطوات يومية دقيقة؛ تعبّد الطريق إجراءً بعد إجراء — «معبّد الطرق / مهندس التحول». عمى بقاء الرؤية شعاراً مُغطّى. *(تذكير: `O` عدسة مرافقة مستقلة؛ لا يُقرأ هذا أن `St` نفسه «تنظيم».)*\",\"question\":\"حين تعلن وجهة، هل تُترجم لديك تلقائياً إلى خطوات إجرائية أم تبقى إطاراً عاماً؟\",\"recommendation\":\"لا فجوة؛ الانتباه لتوتر `O↔St` (تفصيل الخطوة ضد اتساع الوجهة)\",\"source\":\"§2.4 + §4.1/`St-O` (تمهيد الطريق) + §3.1 + قفل `St≠O`\"},\"St-O-L\":{\"presence\":\"الرؤية تبقى ماكرو بلا تجسيد إجرائي يومي؛ قد تُقرأ «تنظيراً بشعارات بلا أدلة تشغيل» لغياب الخطوة التفصيلية\",\"question\":\"هل تُطلق وجهاتٍ كبرى يصعب عليك تفصيل خطواتها اليومية؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل عدسة تنظيم يرصف الطريق خطوةً خطوة بعد أن ترسم أنت الوجهة («مهندس التحول»)\",\"source\":\"§2.4 + `MATRIX-04` §1 (مُغطّي `O`) + §3.3\"},\"St-O-M\":{\"presence\":\"التنزيل الإجرائي متاح انتقائياً؛ تُفصّل الوجهات الكبرى وتترك الأصغر إطاراً\",\"question\":\"هل تحوّل كل رؤية إلى خطوات، أم الكبرى منها فقط؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`St-O`\"},\"St-R-D\":{\"presence\":\"بوصلة المآل لديك ممسوكة بمقود ميداني قوي؛ تطفئ حرائق اليوم وتؤمّن السيولة والوقود بينما توجّه نحو الأفق — «المنفذ الرؤيوي» يسدّ الفجوة بين حلم الغد وأزمة اليوم. عمى الانفصال عن اللحظة مُغطّى داخلياً\",\"question\":\"حين ترسم مساراً بعيداً، هل تؤمّن معه احتياج اليوم المادي تلقائياً؟\",\"recommendation\":\"لا فجوة؛ الانتباه لإدارة توتر `R↔St` (عائد اليوم ضد تموضع الغد)\",\"source\":\"§2.4 (محايد) + §4.1/`St-R` (الرؤية المُمكّنة مادياً) + §3.1\"},\"St-R-L\":{\"presence\":\"لا مرساة ميدانية آنية؛ عمى الانفصال عن اليوم مكشوف — قد يُقاد ببراعة نحو مآلٍ بعيد بينما تتراكم أزمة سيولة/تنفيذ حاضرة بلا رصد\",\"question\":\"هل يحدث أن تنشغل بالمسار البعيد فتفاجئك أزمة يومٍ كان يمكن رصدها مبكراً؟\",\"recommendation\":\"الغطاء بيني — تخادم مع حامل عدسة واقعية يمسك مقود اليوم بينما ترسم أنت الخريطة («المنفذ الرؤيوي»)، لا بإطفاء بُعد نظرك\",\"source\":\"§2.4 + `MATRIX-04` §1 (مُغطّي `R`) + §3.3\"},\"St-R-M\":{\"presence\":\"الإمساك بالميدان متاح انتقائياً؛ تؤمّن اللحظة في المنعطفات الحرجة بينما تحكم الفلترة الأولى قراءةُ المآل\",\"question\":\"هل يحضر سؤال «وسيولة اليوم؟» تلقائياً أم عند اشتداد الأزمة؟\",\"recommendation\":\"ربط كل خطة بعيدة بنقطة تفقّد سيولة آنية يثبّت الغطاء\",\"source\":\"§3.2 + §4.1/`St-R`\"},\"St-S-D\":{\"presence\":\"أقسى قراراتك تمرّ دون انقسام بشري؛ تحدد الوجهة الحتمية وتُدار حملة قبول داخلي تُخفّض المقاومة\",\"question\":\"حين تفرض تحولاً، هل تهيّئ قبول الناس له تلقائياً؟\",\"recommendation\":\"—\",\"source\":\"§4.1/`St-S` (التحول الناعم)\"},\"St-S-L\":{\"presence\":\"المسار الحتمي البارد قد يمضي دون إدارة أثره على الشبكة البشرية؛ تُهيَّأ الوجهة ولا يُهيَّأ الناس لها (بنيوي — لا حكم أخلاقي)\",\"question\":\"هل يمضي قرارك المصيري أحياناً قبل تهيئة من سيتأثر به؟\",\"recommendation\":\"تخادم مع عدسة اجتماعية تهندس حملة القبول («قائد الجماهير»)\",\"source\":\"§4.1/`St-S` (الصدام: المسار الحتمي ⚔️ حماية الحلفاء)\"},\"St-S-M\":{\"presence\":\"هندسة القبول متاحة انتقائياً؛ تهيّئ المحيط للقرارات الكبرى وتترك الأصغر لمسارها\",\"question\":\"هل تُدير قبول كل قرار أم المصيري منه؟\",\"recommendation\":\"—\",\"source\":\"§3.2 + §4.1/`St-S`\"}},\"n\":21}}",
  SECTIONS_K3: "{\"BI\":{\"U01\":\"جوهر هذه المهارة سؤال حاسم يطرحه عقلك في اللحظة الحرجة: *«هل أسمح لهذا الفعل أو القول بالمرور الآن؟»*. مهمتها **الفرملة**: أن توقف اندفاعاً وشيكاً — كلمة حادة، تصرفاً متهوراً — قبل أن يخرج ويصعب التراجع عنه.\",\"U08\":\"أحياناً تكبح فعلاً بنجاح، ثم يعقب ذلك **سكون** — لا فعل ولا بديل. هذا السكون **ليس دائماً من هذه المهارة**. القاعدة المعتمدة:\\n- إن نشأت لديك نيّة/بديل واضح لكنه لم يُنفَّذ → الأمر يخص مهارات **الإنجاز** (تنفيذ)، لا الكبح.\\n- إن لم تنشأ أي نيّة أو بديل أصلاً → الأمر يخص مهارة **المرونة** (توليد البديل).\\n- إن كان سكوناً من إرهاق/تجمّد يمنع حتى المحاولة → الأمر يخص مهارة **الاحتمال** (استنزاف).\",\"U09\":\"- **عند الاستقبال:** تتلقى شحنتك دون أن تفلت منك فوراً.\\n- **عند التقييم:** تقيّم مآل الفعل الوشيك خلال لحظة كافية، دون تسرّع.\\n- **عند البوابة:** توقف فعلاً اندفاعاً وشيكاً (صمت قبل رد حاد، يد تتوقف قبل تصرف متهور).\\n- **عند السماح:** تمرّر الفعل السليم دون تردد يعطّله.\\n- **عند الحظر:** تحوّل الممنوع فعلياً لإعادة تكييف، لا تتركه معلّقاً.\",\"U10\":\"- تعرف أنه يجب أن تتوقف، لكنك لا تستطيع فعلياً في اللحظة.\\n- يسبق الفعل التفكير — تتصرف ثم تدرك أنك تسرّعت.\\n- تفلت منك كلمات أو ردود تندم عليها بعد أن تهدأ.\\n- تستقبل شحنة خام (لم تُهدَّأ) فتزيد صعوبة الفرملة.\"},\"CF\":{\"U01\":\"جوهر هذه المهارة سؤال يطرحه عقلك عند تغيّر الموقف: *«هل أحتاج أن أعدّل طريقة استجابتي؟»*. مهمتها **كسر القالب**: حين لا ينجح ردّك المعتاد، أن تبني استجابة مختلفة فعلاً تناسب ما استجدّ، لا أن تكرر ما لم ينفع.\",\"U08\":\"- **عند الالتقاط:** تلحظ بسرعة أن الموقف تبدّل أو أن مقاربتك لم تعد تصلح.\\n- **عند الاعتراف:** تقرّ صراحة أن نمطك المعتاد لم ينجح هذه المرة، دون تمسك دفاعي.\\n- **عند التوليف:** تولّد استجابة مختلفة جوهرياً، لا نفس النمط بثوب جديد.\\n- **بعد التعديل:** تحافظ على النمط الجديد بثبات معقول، لا تبديل عشوائي مستمر.\",\"U09\":\"- تعامل الموقف الجديد وكأنه القديم، لا تلحظ أن شيئاً تبدّل.\\n- تصرّ أن نمطك المعتاد \\\"يفلح دائماً\\\" رغم أدلة واضحة على العكس.\\n- تكرّر النمط الفاشل بصياغة مختلفة سطحياً فقط.\",\"U10\":\"حين تتسارع المتغيرات فوق طاقتك، أو حين تتعلّق بشدة بنمط استثمرت فيه، قد تفقد مؤقتاً مرونتك — فتتشبّث بما لم يعد يصلح رغم وضوح فشله. **حالة عابرة يصنعها الحمل أو التعلّق اللحظي، لا شخصيتك.**\"},\"EP\":{\"U01\":\"جوهر هذه المهارة سؤال واحد يطرحه عقلك تلقائياً: *«ماذا أشعر به الآن؟»* — سواء تجاه نفسك أو تجاه من أمامك. مهمتها أن **تعرف** ما يجري شعورياً بصدق ووضوح، لا أن تغيّره ولا أن تتصرف حياله. هي رادار، لا مقود.\",\"U08\":\"**عند الالتقاط:**\\n- تلحظ تغيّرات دقيقة في نبرة أو تعبير من حولك فور حدوثها، حتى وسط المشتتات.\\n- تشعر بتغيّرك الجسدي المبكر (تسارع نبض، شدّ) كإنذار قبل أن يتفاقم الشعور.\\n\\n**عند بناء الصورة:**\\n- تسمّي شعورك بدقة (\\\"أنا محرَج، لا غاضب\\\") بدل عبارات عامة.\\n- تميّز بين شعورين متزامنين (توتر وحماس معاً) دون خلطهما في انطباع واحد مبهم.\\n\\n**عند الاحتفاظ:**\\n- تستطيع \\\"الجلوس\\\" مع الشعور لحظة دون اندفاع فوري لتهدئته أو التصرف.\\n- تلاحظ حالتك كما هي (\\\"أنا غاضب الآن\\\") دون قفز فوري لتبريرها أو إخفائها.\",\"U09\":\"**عند الالتقاط:**\\n- أحياناً تكتشف أنك كنت متوتراً منذ ساعات ولم تنتبه إلا متأخراً.\\n- قد لا تلحظ تغيّراً واضحاً في نبرة محدّثك رغم وضوحه لطرف ثالث.\\n\\n**عند بناء الصورة:**\\n- تصف حالتك بعبارات عامة (\\\"تعبان\\\"، \\\"مش مرتاح\\\") دون تمييز أدق.\\n- تخلط شعورين مختلفين في انطباع واحد غامض (لا تميّز قلقاً من غضب).\\n\\n**عند الاحتفاظ:**\\n- تتحرك فوراً لتهدئة/تصرّف قبل اكتمال الملاحظة.\\n- تحتاج أحياناً لتعليق الآخرين لتعرف ما كنت تشعر به (\\\"قالوا لي إني بدوت منزعجاً، وقتها انتبهت\\\").\",\"U10\":\"تحت ضغط شديد ومتراكم، قد تمر بحالة مؤقتة: تتوقف عن ملاحظة مشاعرك بالسرعة المعتادة، وقد لا \\\"تشعر بشيء\\\" واعياً بينما جسدك يُظهر إرهاقاً واضحاً لغيرك. **حالة طوارئ عابرة يصنعها الحمل الزائد، لا شخصيتك** — تنقضي بانقضائه.\"},\"IR\":{\"U01\":\"بعد أن تلاحظ شعورك، تأتي مهمة هذه المهارة: **تهدئة شدّته** حين يرتفع أكثر مما يناسب الموقف، لإعادتك إلى مستوى متّزن يسمح بالتفكير الصافي — **لا إخفاء الشعور ولا قمعه**، بل تبريده فعلياً.\",\"U08\":\"هذه المهارة تخص تهدئة شحنتك **أنت** فقط. تهدئة غضب شخص آخر شيء مختلف كلياً (مهارات اجتماعية في دوائر أخرى)، لا يُقاس بهذه المهارة ولا يُخلط بها.\",\"U09\":\"- **عند الاستقبال:** تتقبّل شعورك كما هو دون إنكار أو تهوين (\\\"نعم، أنا قلق فعلاً\\\").\\n- **عند التقدير:** تدرك بسرعة أن شدّتك أعلى من اللازم وتحتاج تهدئة.\\n- **عند التهدئة:** تهدأ فعلياً خلال دقائق من موقف مستفز، لا مجرد كبت ظاهري.\\n- **بعد المواقف الصعبة:** تحتوي خيبة الأمل وتستعيد توازنك بسرعة دون أن تنغمس في الإحباط.\\n- **عند التسليم:** تسلّم حالة متوازنة تسمح بقرار رشيد، لا شحنة متطرفة.\",\"U10\":\"- **عند الاستقبال:** تنكر أو تهوّن شعورك للتو بدل معالجته (\\\"لست منزعجاً\\\" وأنت منزعج).\\n- **عند التهدئة:** تبقى مشحوناً وقتاً طويلاً بعد المواقف المستفزة، يصعب عليك النزول لمستوى متّزن.\\n- **الانزلاق للكبت:** تخفي الشعور دون تفريغه فعلياً — يبدو هادئاً ظاهرياً بينما يعمل في الخلفية.\\n- **بعد الفشل:** تدخل دوامة ندم أو لوم ذات يصعب الخروج منها.\\n- **عند التسليم:** توصل شحنة خام غير مهدَّأة لمهارة الكبح، فتثقلها.\"},\"ST\":{\"U01\":\"جوهر هذه المهارة سؤال يمتد عبر الوقت: *«هل أحافظ على ثباتي وأدائي رغم استمرار الضغط؟»*. مهمتها أن تبقيك متماسكاً وفعّالاً تحت حمل طويل أو غموض ممتد — **دون أن تنهار من الداخل**.\",\"U08\":\"- **الرصد المبكر:** تلاحظ تراكم الحمل قبل نقطة حرجة، لا تنتظر الانهيار لتكتشف أنك مرهق.\\n- **التماسك الممتد:** تحافظ على وضوح قرارك وانتباهك حتى بعد وقت طويل من ضغط مستمر.\\n- **الإنذار المتّزن:** تطلب دعماً في وقته المناسب — لا تتجاهل الإشارات ولا تهوّل من ضغط عادي.\\n- **الاستعادة الفعلية:** تستعيد قدرتك بعد زوال الذروة، لا تبقى في تأهّب دائم بلا مبرر.\",\"U09\":\"- لا تلاحظ تراكم الحمل — تُفاجَأ بانهيار مفاجئ دون وعي مسبق بالمسار إليه.\\n- يبدأ تشوّشك الوظيفي بعد وقت قصير نسبياً من حمل كان يُفترض احتماله.\\n- يبقى توترك مرتفعاً حتى بعد زوال سبب الضغط (تأهّب لا يهدأ).\",\"U10\":\"حين يبلغ الحمل ذروة استثنائية بلا أي تعافٍ، قد يتفكك تماسكك مؤقتاً مهما كانت قوة احتمالك المعتادة. **حالة طوارئ عابرة يصنعها الحمل الزائد، لا شخصيتك** — يعود احتمالك بعودة فرص التعافي.\"}}",
  THREE_K3: "{\"covenant_opening\":\"### قبل أن تقرأ\\n\\nهذا التقرير **وصف لطريقة عملك**، لا حكم عليك. يقرأ خمس قدرات تتعامل بها مع ما تشعر به: كيف **تلاحظه**، وكيف **تنظّم شدته**، ومتى **توقف** ما لا ينبغي أن يخرج، وكيف **تكيّف** استجابتك، وكم **تحتمل** حين يطول الضغط.\\n\\n**ثلاثة أمور تُقرأ بها هذه الصفحات:**\\n\\n**① ما تقرأه حالة لا صفة.** ما يظهر هنا يصف كيف يعمل نظامك **في هذه المرحلة** — والمرحلة تتغيّر بتغيّر الظروف والحمل والخبرة. لا شيء هنا يقول «هكذا أنت دائماً».\\n\\n**② ما تقرأه ترجيح لا يقين.** لغة هذا التقرير «يبدو» و«على الأرجح»، وهي مقصودة: الأداة ترى ما أجبتَ به، ولا ترى موقفك حين مررتَ به. فما يوافق تجربتك خذه، وما لا يوافقها **فأنت أعلم**.\\n\\n**③ آخر كلمة لك أنت.** ستجد في مواضع سؤالاً بدل حكم — لأن ثمة فروقاً **لا يبلغها أي اختبار**، ويعرفها صاحبها وحده. هذه ليست ثغرة في التقرير، بل **توزيع أدوار**: النظام يعطيك الصورة والإطار، وأنت تُكمل ما لا يُقاس.\\n\\n**وما لن تجده هنا:** تصنيفاً يُلصق بك، ولا مقارنةً بغيرك، ولا حكماً على صحتك — لا شيء من ذلك مما تقيسه هذه الأداة ولا مما تدّعيه.\",\"out_text\":\"**{القدرة} — قراءة خاصة**\\n\\nإجاباتك في هذا الجانب تشير إلى أنه **يستهلك من طاقتك حالياً أكثر مما يخدمك**. بعبارة أوضح: الجهد الذي يبذله نظامك هنا لا يعود عليك بمقابله في هذه الفترة.\\n\\n**وهذه قراءة لحالتك في هذه المرحلة، لا وصف لك.** الحالات الطرفية من هذا النوع ترتبط عادةً بحمل مرتفع أو ظرف ممتد أكثر من ارتباطها بالقدرة نفسها — **وتتغيّر بتغيّر الظرف**.\\n\\n**ما يفيدك عملياً:** أن تنظر في **ما يحيط بهذا الجانب** — حجم ما تحمله، وما تراكم منه دون أن يُفرَّغ — قبل أن تنظر في الجانب نفسه.\",\"reflective_frame\":\"### فكرة أخيرة — تصلح لما هو خارج هذا التقرير أيضاً\\n\\nثمة قاعدة في طريقة عمل هذه القدرات تستحق أن تُقرأ وحدها:\\n\\n**قوة جانب لا تُصلح ما اختلّ في جانب آخر.**\\n\\nقد **تحتوي أثره** — فيبدو الأمر من الخارج مستقراً — لكن **بكلفة تُدفع في مكان ما**: جهد يتكرر، أو شيء يبقى معلّقاً في الداخل، أو حمل ينتقل إلى جانب آخر.\\n\\nوقد يحدث ما هو أدقّ: أن يعمل جانب قوي على **معلومة أو موقف لم يُقرأ بدقة من البداية** — فيُتقن التعامل مع صورة ناقصة، **فيثبت الأثر بدل أن يزول**. الإتقان هنا لا يصحّح ما سبقه.\\n\\n**المعنى العملي:** حين يتكرر شيء لا يُحلّ رغم اجتهادك فيه، فالسؤال المفيد ليس «كيف أجتهد أكثر؟» بل **«أين ينشأ هذا فعلاً؟»** — لأن الجهد المبذول في غير موضعه يُتقن النتيجة نفسها.\\n\\nوهذا إطار للتأمل لا حكماً على حالتك بعينها.\"}",
  CIRCLE_K3: "{\"shared\":\"**بلغة المستخدم:** مهاراتك الخمس في هذا الجانب ليست صفات منفصلة، بل **نظام واحد يعمل معاً**:\\n\\n> **تلاحظ** ما تشعر به ← ثم **تنظّم** شدته ← ومن هناك يتفرّع طريقان معاً: **تقرر** هل تُخرجه سلوكاً، و**تكيّف** استجابتك إن تغيّر الموقف ← وما لا يُحسم في حينه **تحتمله** عبر الوقت.\\n\\nوما يميّز هذا النظام أمران: **تنظيم الشدة قلبه** — منه تتفرّع البقية **وإليه تعود**؛ و**القرار والتكيّف طريقان متوازيان**، لا واحد قبل الآخر. لذلك تُقرأ نتيجة كل مهارة **في ضوء موقعها من النظام**، لا وحدها.\",\"tail\":{\"BI\":\"وهذه المهارة — **كبح الاندفاع** — **أحد الطريقين** المتفرّعين من القلب: تستلم الشحنة بعد أن هدّأها، ثم تقف **عند البوابة** التي تقرر: هل يمر هذا الفعل/القول الآن أم يُحظر؟ أنت هنا \\\"الفرملة\\\": توقف الاندفاع اللحظي قبل أن يتحول إلى فعل يصعب التراجع عنه.\",\"CF\":\"وهذه المهارة — **التكيّف** — **الطريق الآخر** المتفرّع من القلب: حين يتغيّر الموقف أو يفشل ردّك المعتاد، مهمتها أن **تكسر القالب القديم وتبني استجابة جديدة** تناسب ما استجدّ. أنت هنا \\\"مُبدِّل المسار\\\": حين لا يعود الطريق المعتاد صالحاً، تجد طريقاً آخر.\",\"EP\":\"وهذه المهارة — **الملاحظة** — هي **منبع الصورة كلها**: ما تلتقطه أنت هو المادة التي يعمل عليها كل ما بعده. **ولو كانت الملاحظة غير دقيقة من البداية، عمل ما بعدها على معلومة ناقصة** — لا لخلل فيه، بل لأن ما وصله كان ناقصاً.\",\"IR\":\"وهذه المهارة — **تهدئة الشدة** — هي **قلب النظام**: تستلم ما لاحظته، وتُعيد شدّته المرتفعة إلى مستوى متّزن، ثم يتفرّع منها الطريقان. **وما يعجز طرف عن تصريفه يعود إليها**. أنت هنا \\\"مُبرِّد النظام\\\": حين ترتفع الحرارة، تعيدها إلى مستوى يسمح بالتفكير الصافي.\",\"ST\":\"وهذه المهارة — **الاحتمال** — **مصبّ النظام كله**، وهي مختلفة عن سابقاتها: لا تعالج لحظةً واحدة، بل تحافظ على تماسكك **عبر الزمن** تحت ضغط مستمر. **وما لم يُعالَج في موضعه ينتهي إليها تحمله.** هي **خط الدفاع الأخير**: كل المهارات الأخرى تعمل لحماية أدائك، وهذه تحمله حين يطول الحمل ولا ينقطع.\"}}",
  BANNER_K3: "{\"trust_banner\":\"قراءة هذا الملف تحتاج تحفّظاً لأن دقة ملاحظتك للمشاعر — وهي أساس كل ما بعدها — تحتاج دعماً.\"}",
  TEXTLAYER_K3: "{\"CONNECTIVES\":{\"C-01\":\"فيما يلي قدراتك الخمس، كلٌّ في نطاقها.\",\"C-02\":\"وقبل أن نمضي، ملاحظة تخصّ الدرجات المرتفعة.\",\"C-03\":\"وإلى جانب كل قدرة على حدة، هذه صورة كيف تعمل معاً.\",\"C-04\":\"وهنا سؤال يعرف جوابه أنت وحدك.\",\"C-05\":\"وهذه أسئلة تساعدك على قراءة ما سبق بنفسك.\",\"C-06\":\"ونختم بإطار عام قد يفيدك خارج هذا التقرير.\",\"C-07\":\"وفي جانب آخر:\",\"C-08\":\"وعلى مستوى ما تحمله على المدى الطويل:\",\"C-09\":\"وفي ما يصل إليك من انتباه أولاً:\",\"C-10\":\"وهذه الجوانب مجتمعة تُقرأ صورةً واحدة:\",\"C-11\":\"وما لم يظهر هنا لا يعني غيابه — يعني أن قراءته غير حاسمة الآن.\",\"C-12\":\"تُقرأ هذه الصورة كلها بتحفّظ، لأن دقة الملاحظة — أساس ما سبق — تحتاج دعماً.\",\"C-13\":\"هذه قراءة بنيوية محتملة، لا حكم — وأمامك تفسيران:\",\"C-14\":\"وهذا اشتقاق من بنية النموذج، لم يُختبر ميدانياً بعد.\",\"C-15\":\"وتتكرر صورة مشابهة في جانب آخر، تُعرض هنا وقائعَ بلا تفسير:\",\"C-16\":\"ولم تدخل {skill} في هذه الصورة، لأن إجاباتك عنها تحتاج مراجعة قبل قراءتها مع غيرها.\"},\"CONTAINMENT_TEXT\":{\"composite\":\"الصورة عندك موزّعة: بعض الجوانب في نطاق عالٍ وبعضها محدود، وما يهمّ ليس كل جانب وحده — بل كيف تتساند وبأي كلفة. وفيما يلي أين تقع تلك الكلفة.\",\"strong\":\"تشير إجاباتك إلى أن قدراتك الخمس جميعها في النطاق العالي. هذا يعني — على الأرجح — أن نظامك يستوعب الضغط ويعيده إلى وضعه.\",\"weak\":\"تشير إجاباتك إلى أن قدراتك الخمس جميعها في النطاق المحدود حالياً. هذه قراءة لمرحلتك، لا حكم على قدرتك.\"},\"LOAD_TAG\":\"تُقرأ هذه الصورة وأنت تحت الحمل، لا في الراحة — فالقدرات تظهر أوضح تحت الضغط المستمر.\",\"ROOT_QUESTIONS\":{\"RQ-01\":{\"alt\":[\"الشدة تنشأ عند نقطة واحدة فتصل الجانبين معاً، وما يظهر عندهما أثرٌ لا مصدر\",\"كل جانب يعمل بشرطه الخاص، والتزامن مصادفة تكوين\"],\"pattern\":\"HF-01\",\"q\":\"حين يتكرر الموقف — هل تجد الشدة قائمة فيك قبل أن تقرر كيف تتصرف، أم تنشأ في لحظة التصرف نفسها؟\"},\"RQ-02\":{\"alt\":[\"الضيق يتولّد عند الاصطدام بالمستجدّ ثم يعود إلى المركز فيحتويه\",\"الضيق عام غير مرتبط بالتغيير\"],\"pattern\":\"HF-02:CF\",\"q\":\"حين يتغيّر شيء في خطتك أو طريقتك فجأة — هل الضيق الذي تشعر به يظهر مع التغيير تحديداً، أم تجده حاضراً بالقدر نفسه في الأيام التي لا يتغيّر فيها شيء؟\"},\"RQ-03\":{\"alt\":[\"ما يُمنع لا يجد بديلاً يُولَّد فيتراكم بلا مصرف\",\"البديل يخطر فعلاً، ومصدر التراكم غير هذه الحافة\"],\"pattern\":\"HF-02:BI\",\"q\":\"حين تمنع نفسك من قول شيء أو فعله — هل يخطر لك بعدها طريق آخر، أم يبقى الأمر معلّقاً بلا مخرج؟\"},\"RQ-04\":{\"alt\":[\"الإرهاق ناتج تراكم من أكثر من مصدر — والاحتمال قد يكون سليماً يحمل عبئاً مضاعفاً\",\"سعة الاحتمال محدودة بذاتها، مستقلةً عن التراكم\"],\"pattern\":\"HF-04\",\"q\":\"في الفترات التي يخفّ فيها الضغط — هل تعود طاقتك إلى وضعها المعتاد، أم تجدها منخفضة حتى حين تهدأ الأمور؟\"},\"RQ-05\":{\"alt\":[\"الاستقرار مبنيّ على احتواء يُدفع ثمنه — يظهر أثره بعد الموقف لا فيه\",\"الاستقرار ناتج عن قلة الضغط في هذه المرحلة، لا عن احتواء\"],\"pattern\":null,\"q\":\"بعد المواقف التي تمرّ فيها بهدوء ظاهر — هل تحتاج وقتاً بعدها حتى تعود إلى وضعك، أم تنصرف عنها بلا أثر؟\"}},\"SEPARATION_QS\":\"**الغرض:** سلوكيات كثيرة **ظاهرها واحد وجذرها مختلف**. هذه الأسئلة تساعدك على معرفة أيّ مهارة تعمل فعلاً في مواقفك — وهي معرفة **لا يستطيع الاختبار الوصول إليها**، لأنه يرى النتيجة لا الطريق.\\n\\n| السلوك الشائع | السؤال الفاصل | ماذا يكشف |\\n| :--- | :--- | :--- |\\n| **«أفهم الناس بسرعة»** | هل **تلتقط الإشارة** (تلاحظ أن نبرته تغيّرت)، أم **تفسّر الدافع** (تعرف *لماذا* تغيّرت)؟ | الأولى ملاحظة المشاعر · الثانية قدرة عقلية مختلفة تماماً |\\n| **«أنا هادئ الطبع»** | هل **اشتعلتَ ثم هدأت**؟ أم **لم تشتعل أصلاً**؟ أم **أخفيتَ** ما شعرت به؟ | الأول تهدئة قوية · الثاني طبيعة وقودك · الثالث إخفاء |\\n| **«لم أصرخ رغم الاستفزاز»** | هل **خمدت النار** بداخلك؟ أم **بقيت مشتعلة وأغلقتَ الباب** عليها؟ | الأول تهدئة · الثاني كبح |\\n| **«بقيتُ على مساري»** | هل كان **التغيير متاحاً** ولم تغيّر؟ أم **لم يكن متاحاً** فصمدتَ؟ | الأول جمود · الثاني احتمال |\\n| **«توقفتُ عن المهمة»** | هل توقفتَ وأنت **مضغوط ومنهك داخلياً**؟ أم وأنت **هادئ تماماً لكن سئمت**؟ | الأول يخص الاحتمال · الثاني المثابرة |\\n| **«كبحتُ نفسي ثم لم أفعل شيئاً»** | هل **نشأ لديك بديل** ولم تنفّذه؟ أم **لم ينشأ بديل أصلاً**؟ أم كان **تجمّداً من إرهاق**؟ | الأول التنفيذ · الثاني المرونة · الثالث الاحتمال |\\n| **«أنا واعٍ بمشاعري»** | هل **تعرف** ما تشعر به؟ أم **تستطيع تغييره**؟ | مهارتان منفصلتان تماماً |\\n| **«لم أردّ بالمثل»** | هل **أوقفتَ الرد** فقط؟ أم **بنيتَ بديلاً أفضل** بعده؟ | الأول كبح · الثاني تكيّف |\\n\\n**🔒 ملاحظة مهمة:** هذه الأسئلة **ليست اختباراً** ولا تُعطي درجات. هي مرآة.\",\"TEMPLATES\":{\"T-01\":\"يبدو أن {a} و{b} يعملان معاً بانسجام: ما تنتجه إحداهما تجد الأخرى مهيَّأةً للتعامل معه.\",\"T-02\":\"يبدو أن {b} تمسك ما لم تهدأ شدته بعد — فلا يظهر في الخارج، لكنه يبقى قائماً في الداخل. الاستقرار الظاهر هنا له كلفة تُدفع داخلياً.\",\"T-03\":\"يبدو أن نظامك يحتوي ما ينشأ من مواقف لم يجد لها طريقة جديدة — فيستقر الموقف، ويتكرر الجهد نفسه مع كل مرة، دون أن يحدث التغيير الذي يُنهيه.\",\"T-04\":\"يبدو أن الاحتمال يحمل ما لم تُعالَج مصادره — فيستمر الأداء بلا انكسار ظاهر، بينما المصدر باقٍ. وهذه كلفة تتراكم مع الوقت لا تظهر في لحظة واحدة.\",\"T-05\":\"يبدو أن {a} لا يضيف عبئاً على {b} — ما يصلها منه مهيَّأ لا خام.\",\"T-06\":\"يبدو أن {b} تلتقط ما خرج وتعدّله بعد وقوعه — فيتحسّن النمط في المرة التالية، وما وقع يكون قد وقع.\",\"T-07\":\"يبدو أن ما ينشأ في الداخل يجد طريقه إلى الخارج بلا محطة تهيئة — فيقع أثره في الموقف نفسه.\",\"T-08\":\"يبدو أن ما لا يجد مصرفاً يتراكم، وينتهي إلى الاحتمال يحمله. لا يظهر ذلك في موقف واحد — بل في تكراره.\",\"T-09\":\"يبدو أن هذا الجانب لا يضيف عبئاً داخلياً — لأن ما ينشأ يخرج بدل أن يتراكم. الكلفة لم تختفِ؛ تغيّر موضعها فحسب.\",\"T-10\":\"حين تعمل قدرة قوية على معلومة أو موقف لم يُقرأ بدقة من البداية، فإنها تُتقن التعامل مع الصورة الناقصة — فيثبت الأثر بدل أن يزول. القوة هنا لا تصحّح ما سبقها.\",\"T-11\":\"يبدو أن ما يصلك من قراءة الموقف يحتاج دقة أكبر — فيقع الضبط في غير موضعه أو بعد وقته، لا لضعف فيه بل لأن ما وصله كان ناقصاً.\"},\"VERIFY_BLOCK\":\"### 🔍 سؤال لا يجيب عنه أي اختبار — تجيب عنه أنت\\n\\nدرجاتك في بعض الجوانب **عالية، والأرجح أنها قوة حقيقية**. لكن هناك تمييزاً واحداً **لا يلتقطه أي اختبار في العالم**: أن تبدو قوياً من الخارج شيء، وأن تكون قوياً من الداخل شيء آخر.\\n\\nالاختبار يرى **السلوك الظاهر**. أما الفرق بين **القوة** و**القناع** فلا يعرفه إلا أنت — من تجربتك اليومية، لا من رقم.\\n\\n**هذه ليست شكوكاً في نتيجتك.** هي فرصة لتتأكد بنفسك أن قوتك حقيقية — وإن كانت كذلك، فستزداد ثقتك بها بعد هذه الأسئلة:\",\"VERIFY_CLOSING\":\"**إن كانت إجابتك عن هذه الأسئلة مطمئنة — فقوتك حقيقية، وهذا تأكيد لها لا تشكيك فيها.**\\n**وإن أثار سؤال شيئاً بداخلك — فقد كسبتَ معرفة عن نفسك لا يعطيها أي رقم.**\",\"VERIFY_QUESTIONS\":{\"BI\":\"**كبح الاندفاع** — حين توقف نفسك: هل توقف **ما يستحق التوقف فقط**؟ أم تجد نفسك أحياناً تبتلع رأياً سليماً، أو تترك فرصة كان ينبغي أن تغتنمها؟ **الفرملة القوية نعمة حين تكون انتقائية.**\",\"CF\":\"**التكيّف** — حين تغيّر طريقتك: هل **تثبّت** الطريقة الجديدة بما يكفي لترى إن نجحت؟ أم تبدّل مرة أخرى قبل أن يتضح شيء؟ **المرونة تُغيّر عند الحاجة، ثم تستقر.**\",\"IR\":\"**تهدئة الشدة** — حين تهدأ بعد موقف صعب: هل **ينتهي** الشعور فعلاً؟ أم يعود لاحقاً بصورة أخرى (نبرة حادة مفاجئة، إرهاق بلا سبب واضح، ضيق تجاه أمر تافه)؟ **التهدئة الحقيقية تُنهي الشحنة؛ الإخفاء يؤجّلها فقط.**\",\"ST\":\"**الاحتمال** — حين يشتد الضغط: هل تعرف **متى تتوقف أو تطلب دعماً**؟ أم تستمر «حتى تنكسر»؟ **الاحتمال الصحي يتضمّن إشارة؛ الصمود بلا إشارة يبدو قوة حتى اللحظة الأخيرة.**\"}}",
