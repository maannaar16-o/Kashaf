</footer>
<button id="pwa-install" class="pwa-install" hidden>📲 ثبّت «الكشاف» تطبيقاً</button>
<script>
"use strict";
(function(){
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){});
  var deferred = null, btn = document.getElementById("pwa-install");
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); deferred = e; if (btn) btn.hidden = false;
  });
  if (btn) btn.addEventListener("click", function(){
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null; btn.hidden = true; });
  });
  window.addEventListener("appinstalled", function(){ if (btn) btn.hidden = true; });
})();
</script>
</body>
